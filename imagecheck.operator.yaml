{
  "version": "1",
  "gate": "operator-image-sdk-only",
  "base_image": "gcr.io/distroless/static-debian13:nonroot@sha256:f7f8f729987ad0fdf6b05eeeae94b26e6a0f613bdf46feea7fc40f7bd72953e6",
  "required_entrypoint": ["/release-operator"],
  "allowed_executables": [
    "/release-operator",
    "/etc/os-release",
    "/etc/ssl/certs/ca-certificates.crt",
    "/etc/update-motd.d/10-uname",
    "/usr/lib/os-release",
    "/usr/share/doc/ca-certificates/copyright"
  ],
  "forbidden_basenames": ["helm", "kubectl", "helmsman", "kubectl-plugin"],
  "additional_path_checks": [
    {
      "path": "/release-operator",
      "must_exist": true,
      "expected_type": "executable"
    },
    {
      "path": "/bin/sh",
      "must_not_exist": true
    }
  ]
}
