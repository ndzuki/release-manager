// File: operator/v1/upgrade_result.proto
// Package operator.v1 typed execution results: the frozen inputs handed to one
// Helm SDK upgrade, the observations taken before and after, and the typed
// terminal result an operator agent returns over its command stream.
// No service is declared here. release-operator embeds these messages in the
// CommandResult frames of operator.v1 OperatorService.CommandStream, which
// release-orchestrator consumes on its mTLS agent-gateway listener.
// The message set is a durable audit record: digests rather than manifests or
// values, and secret references rather than secret values, so it can be
// persisted and replayed without widening what the control plane can read.
syntax = "proto3";

package operator.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/ndzuki/release-manager/api/gen/operator/v1;operatorv1";

// ReleaseBundleSnapshot freezes the immutable bundle inputs used by an upgrade.
message ReleaseBundleSnapshot {
  string bundle_id = 1;
  string bundle_digest = 2;
  string chart_ref = 3;
  string chart_version = 4;
  string chart_digest = 5;
}

// ChartReference identifies the exact chart artifact verified during preflight.
message ChartReference {
  string resolved_uri = 1;
  string version = 2;
  string digest = 3;
}

// SecretRef carries a local Secret reference and its preflight consistency snapshot.
message SecretRef {
  string path = 1;
  string name = 2;
  string key = 3;
  // Namespace-independent object identity. A matching resource_version on a
  // different uid means the Secret was deleted and recreated, not edited.
  string uid = 4;
  // Kubernetes resource version of the Secret at preflight time, paired with uid,
  // used to detect that the object was replaced or rewritten before execution.
  string resource_version = 5;
  // Digest of the value read during preflight; it lets the agent prove the value
  // changed without the control plane ever holding it.
  string value_digest = 6;
}

// UpgradeCommand is the frozen, typed input for one Helm SDK upgrade.
// The complete, frozen input for one Helm SDK upgrade, assembled by the
// orchestrator and executed verbatim by the agent. Nothing inside it may be
// re-derived at execution time, since the digests recorded here are what the
// result is compared against.
message UpgradeCommand {
  string definition_id = 1;
  string namespace = 2;
  string release_name = 3;
  ReleaseBundleSnapshot bundle = 4;
  ChartReference chart = 5;
  bytes effective_values_json = 6;
  // Digest of the resolved values actually handed to Helm. The values themselves
  // are carried in effective_values_json and may contain resolved secret material,
  // so neither field may be logged or echoed back.
  string effective_values_digest = 7;
  // References only: paths, names, keys and digests, never plaintext values.
  repeated SecretRef secret_refs = 8;
  string operation_id = 11;
  string command_id = 12;
  // The Helm revision the orchestrator believes is live. The agent must refuse to
  // upgrade when the cluster disagrees rather than silently overwriting an
  // unobserved change.
  uint64 expected_revision = 20;
  bool atomic = 21;
  // A Duration, so it is an elapsed amount rather than an instant; the two are
  // easy to confuse with the Timestamp fields used elsewhere.
  google.protobuf.Duration timeout = 22;
  int32 max_history = 23;
}

// ReleaseProvenance identifies whether release-manager metadata was present.
enum ReleaseProvenance {
  RELEASE_PROVENANCE_UNSPECIFIED = 0;
  RELEASE_PROVENANCE_MANAGED = 1;
  // The release exists in the cluster but was not created by this contract, so no
  // bundle or values provenance can be asserted for it and takeover needs an
  // explicit decision.
  RELEASE_PROVENANCE_LEGACY = 2;
}

// ReleaseSnapshot is a non-sensitive observation of one Helm release revision.
message ReleaseSnapshot {
  // The Helm revision number this snapshot describes, distinct from the
  // contract's own record versions.
  uint64 helm_revision = 1;
  string bundle_digest = 2;
  string chart_digest = 3;
  string effective_values_digest = 4;
  string manifest_digest = 5;
  ReleaseProvenance provenance = 6;
  string status = 7;
}

// ResourceSummary summarizes rendered resources without returning manifests.
message ResourceSummary {
  string manifest_digest = 1;
  int32 resource_count = 2;
}

// UpgradeResult records the attempted and active release state after execution.
message UpgradeResult {
  ReleaseSnapshot from = 1;
  ReleaseSnapshot attempted = 2;
  ReleaseSnapshot active = 3;
  // Whether an automatic rollback after a failed attempt restored the previous
  // revision. False with a failed attempt means the cluster is in an unresolved
  // state, which is what the emergency effect status tracks.
  bool rollback_succeeded = 10;
  string rollout_tracking_ref = 11;
  ResourceSummary resource_summary = 12;
}

// ExecutionError is a stable, non-sensitive execution failure.
message ExecutionError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

// CommandResult is the typed terminal result returned by an operator.
message CommandResult {
  string command_id = 1;
  string operation_id = 2;
  // Free-form terminal status of the command, kept separate from the operation
  // state machine so a command can be terminal while the operation still
  // converges.
  string status = 3;
  // The typed outcome of the command, set only for commands that carry a typed
  // payload. Failure detail travels in the separate error field, so a result with
  // no member set is not the same as a failed result: read status first.
  oneof result {
    UpgradeResult upgrade = 20;
  }
  ExecutionError error = 30;
}
