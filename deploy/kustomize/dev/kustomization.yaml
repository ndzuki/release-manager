apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../postgres
  - ../redis
  - ../services
# Per-service configuration is generated from the configs/*.dev.yaml files
# below (semantics of configs/*.dev.yaml, overridden to the in-cluster
# PostgreSQL/Redis services, auth URL, and the orchestrator agent gateway).
configMapGenerator:
  - name: webhook-config
    namespace: release-manager-dev
    files:
      - configs/webhook.dev.yaml
  - name: orchestrator-config
    namespace: release-manager-dev
    files:
      - configs/orchestrator.dev.yaml
  - name: auth-config
    namespace: release-manager-dev
    files:
      - configs/auth.dev.yaml
  - name: notifier-config
    namespace: release-manager-dev
    files:
      - configs/notifier.dev.yaml
  - name: notification-sink-config
    namespace: release-manager-dev
    files:
      - configs/notification-sink.dev.yaml
# REQ-065 AC-065-01 / D1=A: the management-plane JWT is EdDSA (Ed25519), so the
# two halves travel as two Secrets — the private key only to cmd/auth, the
# public key only to cmd/orchestrator. Splitting them puts least privilege in
# the manifest itself: webhook/notifier mount neither (they never verified
# tokens), and a compromised verifier holds no signing material.
# dev-up sources these before apply — the local profile generates/reuses
# data/dev-jwt/jwt-{private,public}-key.pem (0700 dir) through the devseed
# helper; the ci profile materializes DEV_JWT_PRIVATE_KEY transiently (removed
# right after apply, never persisted). kustomize names each Secret
# <name>-<hash> and rewrites every reference in the built manifest, so a rotated
# key changes the hash and rolls only the consuming Deployment.
secretGenerator:
  - name: release-manager-jwt-private
    namespace: release-manager-dev
    files:
      - JWT_PRIVATE_KEY=../../../data/dev-jwt/jwt-private-key.pem
  - name: release-manager-jwt-public
    namespace: release-manager-dev
    files:
      - JWT_PUBLIC_KEY=../../../data/dev-jwt/jwt-public-key.pem
  # 批次3 D2 (AC-065-33): the bundle ingress service token travels through
  # this Secret into the webhook Deployment (sender side, env
  # DEV_WEBHOOK_SERVICE_TOKEN) and the orchestrator Deployment (verifier
  # side, current+previous). The local profile sources
  # data/dev-service-tokens/webhook-service-token (generated by dev-up,
  # 0600); the ci profile materializes the DEV_WEBHOOK_SERVICE_TOKEN env
  # value to the same path transiently. A rotated token changes the content
  # hash and rolls both Deployments. The optional PREVIOUS key supports
  # zero-downtime rotation (REQ-011 §562): it is only present when a CI
  # Secret manager overlays the Secret with two keys.
  - name: release-manager-webhook-service-token
    namespace: release-manager-dev
    files:
      - WEBHOOK_SERVICE_TOKEN=../../../data/dev-service-tokens/webhook-service-token
  # TASK-102 (REQ-011 §562): the CI ingress key and the Harbor ingress key are
  # independent, separately rotatable credentials. The CI key only opens
  # WebhookService/SubmitReleaseBundle; the Harbor key only opens
  # POST /webhooks/harbor and BundleService/RecordArtifactEvent, so neither can
  # be substituted for the other (AC-011-04/16/17).
  - name: release-manager-ci-api-key
    namespace: release-manager-dev
    files:
      - CI_API_KEY=../../../data/dev-service-tokens/ci-api-key
  - name: release-manager-harbor-service-token
    namespace: release-manager-dev
    files:
      - HARBOR_SERVICE_TOKEN=../../../data/dev-service-tokens/harbor-service-token
  # TASK-096 (REQ-031): the notifier ingress credential. Like the ingress
  # Secrets above it is generated by dev-up (local profile) or materialized
  # from DEV_NOTIFIER_SERVICE_TOKEN (ci profile); a missing Secret leaves the
  # notifier surface closed, because an empty allowlist matches nothing.
  - name: release-manager-notifier-service-token
    namespace: release-manager-dev
    files:
      - NOTIFIER_SERVICE_TOKEN=../../../data/dev-service-tokens/notifier-service-token
  # 批次5 D1 (AC-065-36): the dev mTLS CA travels through this Secret into
  # the orchestrator gateway mount (/data/gateway-ca.key + /data/gateway-ca.crt,
  # the ca.key_path/ca.cert_path config targets). The local profile sources
  # data/dev-ca/ (generated by dev-up before apply, 0600); the ci profile
  # materializes DEV_M_TLS_CA_KEY / DEV_M_TLS_CA_CERT to the same paths
  # transiently. A rotated CA changes the content hash and rolls the
  # orchestrator Deployment — the seed enrollment phase runs after apply, so
  # the CA is already in place before the first Enroll (no first-boot race).
  - name: release-manager-mtls-ca
    namespace: release-manager-dev
    files:
      - ca.key=../../../data/dev-ca/ca.key
      - ca.crt=../../../data/dev-ca/ca.crt
