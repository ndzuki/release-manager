apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../postgres
  - ../redis
  - ../services
# Per-service configuration is generated from the configs/*.dev.yaml files
# below (semantics of configs/*.dev.yaml, overridden to the in-cluster
# PostgreSQL/Redis services, auth URL, and the orchestrator agent gateway).
configMapGenerator:
  - name: webhook-config
    namespace: release-manager-dev
    files:
      - configs/webhook.dev.yaml
  - name: orchestrator-config
    namespace: release-manager-dev
    files:
      - configs/orchestrator.dev.yaml
  - name: auth-config
    namespace: release-manager-dev
    files:
      - configs/auth.dev.yaml
  - name: notifier-config
    namespace: release-manager-dev
    files:
      - configs/notifier.dev.yaml
  - name: notification-sink-config
    namespace: release-manager-dev
    files:
      - configs/notification-sink.dev.yaml
# D3: the JWT signing key secret is sourced by dev-up before apply — local
# profile generates/reuses data/dev-jwt/jwt-signing-key.pem (0600); the ci
# profile writes the DEV_JWT_SIGNING_KEY env value to the same path
# transiently (removed right after apply, never persisted). kustomize names
# the Secret release-manager-jwt-<hash> and rewrites every reference in the
# built manifest, so a rotated key changes the hash and rolls the consuming
# Deployments automatically.
secretGenerator:
  - name: release-manager-jwt
    namespace: release-manager-dev
    files:
      - JWT_SIGNING_KEY=../../../data/dev-jwt/jwt-signing-key.pem
