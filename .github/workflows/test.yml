name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run SDK-only static gate
        run: go run ./cmd/sdkcheck/ -exceptions sdkcheck.exceptions.yaml ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.71.0"

      - name: Generate proto
        run: make proto

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  rollout-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install kind v0.32.0
        env:
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
        run: |
          curl -fsSLo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum --check
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Run rollout watch integration gate
        run: make test-rollout-watch
