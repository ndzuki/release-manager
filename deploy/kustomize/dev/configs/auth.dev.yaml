http_port: 8085
log_level: debug
database:
  driver: postgres
  dsn: postgres://release_manager:dev-release-manager@postgres:5432/release_manager?sslmode=disable
redis:
  address: redis:6379
authorization:
  policy_reload_interval: 5s
maintenance: false
# The dev fixture re-authenticates all four accounts during seed/resume and
# retries them on transient failures; the production 5/min default blocks the
# canonical accounts drift check (real smoke 2026-08-27: resource_exhausted:
# too many login attempts).
login_rate_limit:
  max_attempts: 1000
  window: 1m
# ADR-028: the dev console is served over plain HTTP on loopback, so the
# rm_access/rm_refresh/rm_csrf cookies cannot be Secure here. Production keeps
# the default (Secure) by omitting this key.
browser_session:
  secure_cookies: false
