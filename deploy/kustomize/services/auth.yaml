apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: release-manager-dev
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/part-of: release-manager
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: auth
          image: localhost:5001/release-auth:dev
          imagePullPolicy: IfNotPresent
          args: ["--config", "/configs/auth.dev.yaml", "--signing-key", "dev-only-signing-key"]
          envFrom:
            - secretRef:
                name: release-manager-dev-credentials
          ports:
            - name: http
              containerPort: 8085
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: release-manager-dev-data
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: release-manager-dev
spec:
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: http
      port: 8085
      targetPort: http
