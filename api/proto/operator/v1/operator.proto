// File: operator/v1/operator.proto
// Package operator.v1 is the customer-cluster control channel: enrollment, and
// a single long-lived bidirectional stream that carries session lifecycle,
// command delivery, acknowledgements, heartbeats, resync, emergency stop and
// typed results.
// It is served twice by release-orchestrator (management listener dev port
// 8083, agent-gateway listener 8084); the gateway is the path the
// customer-cluster agent uses and presents a TLS client certificate, while
// release-operator can also host the same handler in gateway mode.
// Trust boundary: enrollment is bootstrapped once with a single-use enrollment
// token and a certificate signing request; afterwards the issued client
// certificate is the identity, and its serial number is the authority the
// server checks on every request, which is what makes revocation immediate.
// Command payloads are opaque bytes versioned by payload_version, so the
// contract stays stable while the execution protocol evolves.
syntax = "proto3";

package operator.v1;

import "common/v1/domain.proto";
import "operator/v1/upgrade_result.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ndzuki/release-manager/api/gen/operator/v1;operatorv1";

// EnrollRequest registers an operator agent with the orchestrator using a single-use token.
message EnrollRequest {
  // Single-use credential minted by the management plane; it is spent inside
  // this call, so it must never be logged or replayed.
  string enrollment_token = 1;
  string customer_id = 2;
  string cluster_id = 3;
  reserved 4;
  reserved "operator_id";
  // PEM certificate signing request whose subject and subject alternative names
  // encode the operator, customer and cluster identity; the server refuses a
  // request that does not match the enrollment token.
  bytes csr_pem = 5;           // PEM-encoded certificate signing request
  map<string, string> capabilities = 6;
}

// EnrollResponse acknowledges enrollment and starts a session.
message EnrollResponse {
  string session_id = 1;
  // Lifetime of the returned session in seconds, not of the certificate.
  int64 ttl_seconds = 2;
  bytes certificate_pem = 3;   // signed client certificate (mTLS)
  string operator_id = 4;      // center-generated operator identity (REQ-015 decision 4)
  // Certificate expiry as an RFC 3339 string, not a Timestamp, so the agent can
  // schedule its renewal; note that no renewal loop is wired in this repository.
  string certificate_expires_at = 5; // cert expiry for client-side renew scheduling
}

// CommandStreamRequest carries operator status updates and acknowledgments.
message CommandStreamRequest {
  // Exactly one member per frame, and the server ignores a frame whose payload is
  // not set rather than faulting the stream, so liveness must be expressed with
  // Heartbeat instead of an empty message.
  // The first frame of a new stream must be Hello: any other member, or none, is
  // answered with INVALID_ARGUMENT and the stream is closed. Members added later
  // are numbered forward, so a client must skip what it does not recognise.
  oneof payload {
    Hello hello = 1;           // initial session hello (after Enroll)
    Ack ack = 2;               // command acknowledgment
    Heartbeat heartbeat = 3;   // periodic liveness
    Result result = 4;         // command completion result
    ResyncResponse resync_response = 5;  // response to orchestrator resync request
    EmergencyAck emergency_ack = 6;
    EmergencyResult emergency_result = 7;
    CommandResult command_result = 8;  // typed terminal result for payload v2+
    RolloutProgress rollout_progress = 9;  // periodic workload rollout progress (TASK-077)
    WorkloadIdentityReport workload_identity_report = 10;  // authoritative live workload identities (REQ-085)
  }
}

// WorkloadIdentityReport carries authoritative workload identities the
// operator read from the live cluster (REQ-085): the orchestrator persists
// them on release_inventory and fills EmergencyTarget / EmergencyIntent /
// EmergencyCommand from them. Additive alongside RolloutProgress (field 9).
message WorkloadIdentityReport {
  repeated WorkloadIdentityItem items = 1;
}

// WorkloadIdentityItem identifies one live workload (REQ-085). kind uses the
// same enum-style vocabulary as EmergencyCommand.workload_kind
// (DEPLOYMENT/STATEFUL_SET/DAEMON_SET). namespace is the workload's
// Kubernetes namespace; release_namespace/release_name locate the Helm
// release the workload belongs to.
//
// Fields 7..11 are the observed field projection (TASK-168, REQ-058 C1/R1):
// the same report that carries the identity also carries the current container
// names, their image refs, the replica count and the observation time, so the
// orchestrator can derive real current values instead of unavailable
// sentinels. Every field is additive: an older operator that omits them leaves
// the orchestrator on the fail-closed "not observed" path. Empty containers /
// current_image_refs and an absent current_replicas mean "not observed", never
// a real empty value.
message WorkloadIdentityItem {
  string release_namespace = 1;
  string release_name = 2;
  string kind = 3;
  string name = 4;
  string namespace = 5;
  string uid = 6;
  // Live container names of the workload's pod template, in the order the
  // operator read them. Empty means "not observed".
  repeated string containers = 7;
  // Current image ref per container name (key = container name). Empty means
  // "not observed".
  map<string, string> current_image_refs = 8;
  // Observed replica count. proto3 explicit presence is required to tell
  // "not observed" (absent) apart from a real zero (e.g. a scaled-to-zero
  // Deployment); DaemonSets have no replica count and leave it absent.
  optional int32 current_replicas = 9;
  // Field 10 is intentionally unused: it is reserved for
  // current_annotations, whose data plane is deferred (annotation values may
  // carry sensitive data and need a whitelist decision first — TASK-168).
  // Time the operator took this observation, used for staleness decisions.
  // Absent means "not observed".
  google.protobuf.Timestamp observed_at = 11;
}

// RolloutProgress reports observed workload readiness during a standard operation.
message RolloutProgress {
  string operation_id = 1;
  string workload_ref = 2;  // "<gvr.resource>/<namespace>/<name>", e.g. "deployments/app/default"
  int32 ready = 3;
  int32 desired = 4;
}

// Hello is sent by the operator to establish a session after enrollment.
message Hello {
  string session_id = 1;       // optional legacy enrollment session
  string operator_id = 2;
  int64 last_seen_sequence = 3; // last sequence number the operator has seen
  string instance_id = 4;
  string version = 5;
  map<string, string> capabilities = 6;
}

// SessionEstablished confirms a validated operator session.
message SessionEstablished {
  string session_id = 1;
  int64 heartbeat_interval_seconds = 2;
  int64 heartbeat_timeout_seconds = 3;
  string active_config_version = 4;
}
// AckType classifies the acknowledgment level.
enum AckType {
  ACK_TYPE_UNSPECIFIED = 0;
  ACK_TYPE_RECEIVED = 1;       // command received (delivered)
  ACK_TYPE_PERSISTED = 2;      // command persisted to local store (fsynced)
}

// Ack acknowledges receipt of a command delivered to the operator.
message Ack {
  string outbox_id = 1;
  string command_id = 2;
  int64 sequence = 3;          // sequence of the acknowledged command
  AckType ack_type = 4;        // acknowledgment level
}

// Heartbeat signals operator liveness.
message Heartbeat {
  string session_id = 1;
}

// Result reports command execution outcome.
message Result {
  string outbox_id = 1;
  string command_id = 2;
  string status = 3;          // "succeeded" or "failed"
  string message = 4;
  bytes output = 5;
  int64 sequence = 6;          // sequence of the completed command
  string result_json = 7;      // JSON-encoded result for duplicate detection
}

message EmergencyAck {
  string emergency_command_id = 1;
  AckType ack_type = 2;
}

message EmergencyResult {
  string emergency_command_id = 1;
  string operation_id = 2;
  string status = 3;
  string error_code = 4;
  string message = 5;
  string result_json = 6;
}

// CommandStreamResponse delivers session lifecycle responses.
message CommandStreamResponse {
  // Exactly one member per frame. SessionEstablished is always first; after that
  // a client must accept any member, because command delivery, resync and
  // duplicate replay are the legacy shape while emergency and typed commands are
  // the current one, and an agent that cannot ignore an unknown member will break
  // when one is added.
  oneof payload {
    Command command = 1;       // legacy command delivery
    SessionEvent session_event = 2;  // session lifecycle event
    ResyncRequest resync_request = 3;  // legacy gap recovery
    DuplicateResponse duplicate_response = 4;  // legacy duplicate result
    SessionEstablished session_established = 5;
    EmergencyCommand emergency_command = 6;
  }
}

// Command is a deploy directive sent to the operator.
message Command {
  string outbox_id = 1;
  string command_id = 2;
  string operation_id = 3;
  string operation_type = 4;
  common.v1.ReleaseBundle bundle = 5;
  bytes values = 6;                  // approved ValuesRevision JSON
  int64 sequence = 7;                // global monotonic sequence number
  string definition_id = 8;
  string namespace = 9;
  string release_name = 10;
  bool create_namespace = 11;
  int64 timeout_seconds = 12;
  string values_revision_id = 13;
  int64 expected_current_revision = 14;
  bool atomic = 15;
  bytes values_patch = 16;            // JSON merge patch
  int64 target_revision = 17;         // target revision for ROLLBACK
  uint32 payload_version = 18;
  // Preflight stage this command executes (REQ-019 artifact/render/cluster/runtime_pull).
  // Empty for a normal execution command. When set, the agent runs that stage's
  // validation and reports its result instead of installing or upgrading: a stage
  // is a check, not a release write.
  //
  // The stage used to travel only inside the outbox JSON payload, which the
  // agent's decoder dropped, so every stage silently fell through to the
  // operation-type branch and performed a real install (TASK-114).
  string stage = 21;
  // Structured form of the command input, as an alternative to the flat fields on
  // the same message: the two describe one intent, so an agent reads whichever
  // form its payload version understands instead of merging both. Only an upgrade
  // command is defined today; the flat fields remain what a version 1 agent sees.
  oneof typed_payload {
    UpgradeCommand upgrade = 20;
  }
}

message EmergencyCommand {
  string command_id = 1;
  string operation_id = 2;
  string action = 3;
  string workload_kind = 4;
  string workload_name = 5;
  string workload_namespace = 6;
  string workload_uid = 7;
  // Exactly one member: which change to apply is expressed by the selected
  // member, and the action field mirrors it rather than selecting independently,
  // so a command with no change set cannot be executed.
  oneof change {
    EmergencySetContainerImage set_container_image = 8;
    EmergencySetReplicas set_replicas = 9;
    EmergencySetApprovedAnnotations set_approved_annotations = 10;
  }
}

message EmergencySetContainerImage {
  string container = 1;
  string image_reference = 2;
}

message EmergencySetReplicas {
  int32 replicas = 1;
}

message EmergencySetApprovedAnnotations {
  repeated EmergencyAnnotationEntry entries = 1;
  string scope = 2;
}

message EmergencyAnnotationEntry {
  string key = 1;
  string value = 2;
}

// ResyncRequest asks the operator to report its last seen sequence for gap recovery.
message ResyncRequest {
  int64 orchestrator_last_sequence = 1;  // the highest sequence known to orchestrator
  string reason = 2;                      // human-readable gap description
}

// ResyncResponse is sent by the operator in response to a ResyncRequest.
message ResyncResponse {
  int64 operator_last_sequence = 1;       // the last sequence the operator has stored
}

// DuplicateResponse is sent when the operator receives a command it has already completed.
message DuplicateResponse {
  string command_id = 1;
  string result_json = 2;                 // original result JSON
}

// SessionEvent signals a session lifecycle change.
message SessionEvent {
  string type = 1;            // "suspect", "offline", "replaced"
  string message = 2;
}


// OperatorService manages the bidirectional stream between orchestrator and operator agents.
// OperatorService pairs one orchestrator-side session with one operator agent:
// it enrolls, keeps the session alive, delivers commands and collects results.
// Callers: the operator agent running inside a customer cluster, plus read-only
// console and test tooling. Trust boundary: per-agent credentials, not human
// tokens; an agent may only act for the customer and cluster its certificate
// names, and cross-tenant identifiers are refused.
// The stream is the only stateful member: it must survive reconnects through
// the hello/resync exchange rather than by replaying commands blindly.
service OperatorService {
  // Exchanges a single-use enrollment token plus a certificate signing request
  // for a client certificate and an operator session.
  // One-shot and deliberately not replayable: the token is consumed inside the
  // call, so presenting it a second time answers UNAUTHENTICATED with an
  // enrollment-token reuse reason. Recovery after a lost response is a fresh
  // token, or reusing the certificate already delivered, never a resend.
  // The token pins the customer and cluster, which the request must match
  // exactly (PERMISSION_DENIED on a scope mismatch); the certificate signing
  // request must carry the canonical identity or it is refused
  // (INVALID_ARGUMENT for an unparsable request, PERMISSION_DENIED when its
  // subject alternative names do not encode that identity). An operator already
  // registered for the same customer and cluster is superseded, and an identity
  // name collision answers ALREADY_EXISTS.
  // The agent must persist the returned certificate before it can reconnect; the
  // token is already spent at that point.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Replaces the agent's client certificate while keeping its identity: same
  // operator, customer and cluster, only a new serial and expiry.
  // Authenticated by the certificate the agent already holds, verified at the
  // transport; an agent without one cannot renew and must re-enroll.
  // Not replayable. The update is compare-and-swap on the old serial, so a second
  // call with the now-superseded certificate is refused (PERMISSION_DENIED, old
  // certificate replaced) and the previous serial stops authenticating at once.
  // Refused with FAILED_PRECONDITION until the certificate enters its renewal
  // window. The returned time-to-live is the configured certificate lifetime in
  // seconds, not the remainder of the old one, and the response carries no expiry
  // instant: derive it or parse the certificate.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  // The long-lived bidirectional session: the agent reports hello, heartbeats,
  // acknowledgements, results, rollout progress and workload identity reports
  // while the orchestrator dispatches commands, cancellations, emergency stop and
  // resync requests over the same stream.
  // Informational reports never tear the stream down: a malformed progress report,
  // one for an operation this session does not own, or one for an operation that
  // already reached a terminal state, is dropped and logged. A result the server
  // cannot persist does end it.
  // The first client message must be a hello and the first server message is
  // always the established-session frame, which carries the heartbeat interval
  // the client should keep (half the server's heartbeat staleness window). While
  // another session for the same operator is still online, establishing a second
  // one is refused with ALREADY_EXISTS, and a session that is not online, or an
  // operator that was superseded or revoked, is refused with PERMISSION_DENIED.
  // At-least-once delivery reconciled by the client: each command has a stable
  // identifier and a monotonic sequence, an acknowledgement with the persisted
  // kind is what stops re-delivery, and a result for an already-terminal command
  // is answered with a duplicate frame replaying the original result instead of
  // re-executing. After a reconnect, report the last sequence seen and follow the
  // resync exchange.
  // Execution must stay idempotent per command identifier: a duplicate is
  // possible by design. Streams bypass the maintenance mode check.
  rpc CommandStream(stream CommandStreamRequest) returns (stream CommandStreamResponse);
  // GetActiveOperatorSession exposes the persisted active session for E2E
  // control-plane assertions without exposing capabilities (REQ-066).
  rpc GetActiveOperatorSession(GetActiveOperatorSessionRequest) returns (GetActiveOperatorSessionResponse);
}

// RenewCertificateRequest rotates the current operator certificate without changing identity.
// Authentication is the verified mTLS client certificate; operator_id must match it.
message RenewCertificateRequest {
  // Redundant with the certificate identity and checked against it, so it cannot
  // be used to renew another operator's certificate.
  string operator_id = 1;
  bytes csr_pem = 2;
}

// RenewCertificateResponse returns the replacement client certificate.
message RenewCertificateResponse {
  bytes certificate_pem = 1;
  // Lifetime of the new certificate in seconds, taken from the configured
  // certificate time-to-live. Different meaning from EnrollResponse.ttl_seconds.
  int64 ttl_seconds = 2;
}

// GetActiveOperatorSessionRequest selects one operator's current active
// persisted session. An absent active session is returned as not_found.
message GetActiveOperatorSessionRequest {
  string operator_id = 1;
}

// GetActiveOperatorSessionResponse contains only non-sensitive session
// lifecycle fields; capabilities are intentionally omitted (REQ-066).
message GetActiveOperatorSessionResponse {
  OperatorSession session = 1;
}

message OperatorSession {
  string session_id = 1;
  string operator_id = 2;
  string status = 3;
  string instance_id = 4;
  string version = 5;
  string active_config_version = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp last_heartbeat = 8;
  google.protobuf.Timestamp expires_at = 9;
}
