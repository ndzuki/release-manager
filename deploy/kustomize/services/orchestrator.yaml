apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: release-manager-dev
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
        app.kubernetes.io/part-of: release-manager
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: orchestrator
          image: localhost:5001/release-orchestrator:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /configs/orchestrator.dev.yaml
          # D3: the JWT signing key travels via the JWT_SIGNING_KEY env var
          # (release-manager-jwt Secret); cmd/orchestrator falls back to it
          # for the --signing-key flag default. Kubernetes cannot expand
          # secretKeyRef values inside args; the key rotation rolls the
          # Deployment via the Secret hash.
          env:
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: release-manager-jwt
                  key: JWT_SIGNING_KEY
            # 批次3 D2 (AC-065-33): verifier-side bundle ingress service
            # tokens. serviceTokens() loads current+previous as SHA-256
            # hashes and compares constant-time (REQ-011 §562); the optional
            # PREVIOUS key enables zero-downtime rotation when a CI Secret
            # manager overlays the Secret with two keys.
            - name: DEV_WEBHOOK_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: release-manager-webhook-service-token
                  key: WEBHOOK_SERVICE_TOKEN
            - name: DEV_WEBHOOK_SERVICE_TOKEN_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: release-manager-webhook-service-token
                  key: WEBHOOK_SERVICE_TOKEN_PREVIOUS
                  optional: true
          ports:
            # Management-plane Connect HTTP listener.
            - name: http
              containerPort: 8083
            # Agent mTLS gateway listener (gateway.enabled: true). Exposed
            # through the operator Service (nodePort 30084) so customer
            # cluster agents can enroll and stream commands.
            - name: gateway
              containerPort: 8084
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /configs/orchestrator.dev.yaml
              subPath: orchestrator.dev.yaml
            - name: data
              mountPath: /data
            # 批次5 D1 (AC-065-36): the dev mTLS CA generated by dev-up
            # before apply lands on the gateway paths the orchestrator
            # config points at (ca_key_path/ca_cert_path → /data/gateway-ca.*).
            # ca.LoadOrCreate reuses the pair, so the seed enrollment phase
            # never races the CA's first-time generation.
            - name: gateway-ca-key
              mountPath: /data/gateway-ca.key
              subPath: ca.key
            - name: gateway-ca-cert
              mountPath: /data/gateway-ca.crt
              subPath: ca.crt
      volumes:
        - name: config
          configMap:
            name: orchestrator-config
        - name: data
          persistentVolumeClaim:
            claimName: release-manager-orchestrator-data
        - name: gateway-ca-key
          secret:
            secretName: release-manager-mtls-ca
            defaultMode: 0600
        - name: gateway-ca-cert
          secret:
            secretName: release-manager-mtls-ca
            defaultMode: 0644
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: release-manager-dev
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: orchestrator
  ports:
    - name: http
      port: 8083
      targetPort: http
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: release-manager-dev
spec:
  # The management-plane OperatorService gateway is served by the orchestrator
  # (gateway.enabled: true, containerPort 8084). This Service exposes that
  # mTLS listener to customer clusters via the 30084 nodePort the k3d
  # loadbalancer maps from host 8084.
  type: NodePort
  selector:
    app.kubernetes.io/name: orchestrator
  ports:
    - name: gateway
      port: 8084
      targetPort: gateway
      nodePort: 30084
