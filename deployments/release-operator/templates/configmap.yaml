apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "release-operator.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      grpc_addr: "{{ .Values.grpc.addr }}"

    log:
      level: "{{ .Values.log.level }}"
      format: "{{ .Values.log.format }}"
      output: "{{ .Values.log.output }}"

    tls:
      ca_file: "/etc/release-operator/tls/ca.crt"
      cert_file: "/etc/release-operator/tls/tls.crt"
      key_file: "/etc/release-operator/tls/tls.key"
      require_client_cert: {{ .Values.tls.enabled }}
      hot_reload_dir: "{{ .Values.tls.hotReloadDir }}"

    harbor:
      url: "{{ .Values.harbor.url }}"
      insecure_skip_verify: {{ .Values.harbor.insecureSkipVerify }}
      timeout: "{{ .Values.harbor.timeout }}"
      ca_file: "{{ if or .Values.harbor.caCert .Values.harbor.existingCaSecret }}/etc/release-operator/harbor-ca/ca.crt{{ end }}"

    helm:
      upgrade_timeout: "{{ .Values.helm.upgradeTimeout }}"
      default_namespace: "{{ .Values.helm.defaultNamespace }}"
      max_history: {{ .Values.helm.maxHistory }}
      atomic: {{ .Values.helm.atomic }}
      wait: {{ .Values.helm.wait }}
      create_namespace: {{ .Values.helm.createNamespace }}
      cache_dir: "{{ .Values.helm.cacheDir }}"

    notification_endpoint: "{{ .Values.notificationEndpoint }}"
