apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "release-operator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.grpc.service.type }}
  ports:
  - name: grpc
    port: {{ .Values.grpc.service.port }}
    targetPort: grpc
    protocol: TCP
  selector:
    {{- include "release-operator.selectorLabels" . | nindent 4 }}
