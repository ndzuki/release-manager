# Release Manager local test environment configuration.
server:
  grpc_addr: ":8443"
  http_addr: ":8080"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 15s

log:
  level: debug
  format: console
  output: stdout

tls:
  ca_file: /etc/release-manager/tls/ca.crt
  cert_file: /etc/release-manager/tls/tls.crt
  key_file: /etc/release-manager/tls/tls.key
  require_client_cert: true
  client_insecure_skip_verify: true
  hot_reload_dir: /tmp/e2e-certs

store:
  type: sqlite
  dsn: /data/release-manager.db

dingtalk:
  enabled: false

smtp:
  enabled: false

audit:
  enabled: false
  retention_days: 0
  buffer_size: 1000

dev_mode: true
api_key: test-key
