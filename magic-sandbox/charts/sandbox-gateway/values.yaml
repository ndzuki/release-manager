# Default values for sandbox-gateway
replicaCount: 3

imageRegistry: "registry.local:5001"
imageRepository: magic/sandbox-components
imageTag: "0.0.20"
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: sandbox-gateway.magic-independent.local
      paths:
        - path: /
          pathType: Prefix
  # TLS 配置（优先级高于 global.ingress.tls）。留空则回退到全局 TLS 设置。
  # 示例：
  # tls:
  #   - secretName: sandbox-gateway-tls
  #     hosts:
  #       - sandbox-gateway.magic-independent.local
  tls: []

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

# 以下为可选：仅当配置了 resources 时，才会向 ConfigMap 写入 AGENT_* / FUSE_* 资源环境变量；
# 未配置时由 sandbox-gateway 进程使用程序内默认值。结构同 Pod resources（requests / limits）。
#
agent:
  resources:
    requests:
      cpu: "100m"
      memory: "300Mi"
    limits:
      cpu: "2"
      memory: "4Gi"

#
# fuse:
#   resources:
#     requests:
#       cpu: "100m"
#       memory: "300Mi"
#     limits:
#       cpu: "2"
#       memory: "2Gi"

# Service Account for K8s API access
serviceAccount:
  create: true
  annotations: {}
  name: sandbox-components

# RBAC configuration
rbac:
  create: true


