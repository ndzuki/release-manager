apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
# The per-customer secrets (operator-enrollment token, operator-gateway-ca)
# are applied imperatively by dev.sh agents_up: the single-use enrollment
# token is generated by devseed in the enrollment phase (data/
# dev-enrollment-tokens/<cluster>.token) and the gateway CA is copied from
# the management orchestrator's /data/gateway-ca.crt. A kustomize
# secretGenerator would hash-suffix the names and cannot express this
# runtime injection (real smoke 2026-08-24; see dev.sh agents_up).
