apiVersion: v2
name: release-operator
description: >
  Release Operator — 自动化 Helm Chart 更新服务。
  部署在私有化客户 K8s 集群中，接收来自 release-manager 的更新通知，
  自动从 Harbor 拉取 Helm chart 并执行 helm upgrade。
