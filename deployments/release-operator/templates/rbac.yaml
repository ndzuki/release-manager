{{- if .Values.rbac.create -}}
# =============================================================================
# ClusterRole — 集群级只读权限，Helm SDK 发现集群资源所需
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "release-operator.serviceAccountName" . }}-clusterrole
  labels:
    {{- include "release-operator.labels" . | nindent 4 }}
rules:
  # --- 核心资源（只读）---
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - persistentvolumes
    verbs: ["get", "list", "watch"]
  # --- RBAC（只读）---
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  # --- CRD 发现（只读）---
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]
  # --- 存储类（只读）---
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - csidrivers
      - csistoragecapacities
    verbs: ["get", "list", "watch"]
  # --- Ingress / Gateway API 集群资源（只读）---
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingressclasses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
    verbs: ["get", "list", "watch"]
  # --- 调度（只读）---
  - apiGroups: ["scheduling.k8s.io"]
    resources:
      - priorityclasses
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "release-operator.serviceAccountName" . }}-clusterrolebinding
  labels:
    {{- include "release-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "release-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "release-operator.serviceAccountName" . }}-clusterrole
  apiGroup: rbac.authorization.k8s.io

---
# =============================================================================
# Role — 命名空间级读写权限，在 managedNamespaces 中每个 namespace 创建一份
# =============================================================================
{{- $managedNamespaces := .Values.rbac.managedNamespaces | default (list .Release.Namespace) }}
{{- range $ns := $managedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "release-operator.serviceAccountName" $ }}-role
  namespace: {{ $ns }}
  labels:
    {{- include "release-operator.labels" $ | nindent 4 }}
rules:
  # --- 核心工作负载资源 ---
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/log
      - pods/portforward
      - services
      - endpoints
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumeclaims
      - events
      - limitranges
      - resourcequotas
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- 工作负载 ---
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - statefulsets
      - statefulsets/scale
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- 批处理 ---
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- 网络：Ingress ---
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingressclasses
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- 网络：Gateway API (gateway.networking.k8s.io) ---
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - httproutes
      - grpcroutes
      - tcproutes
      - tlsroutes
      - udproutes
      - referencegrants
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- RBAC（命名空间级）---
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- 弹性伸缩 ---
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- Pod 中断预算 ---
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- 调度 ---
  - apiGroups: ["scheduling.k8s.io"]
    resources:
      - priorityclasses
    verbs: ["get", "list", "watch"]

  # --- 服务发现（可选）---
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]

  # --- ServiceMonitor / PodMonitor (Prometheus Operator, 可选) ---
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- cert-manager (可选) ---
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificaterequests
      - issuers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- Istio 服务网格 (可选) ---
  - apiGroups: ["networking.istio.io"]
    resources:
      - virtualservices
      - destinationrules
      - gateways
      - serviceentries
      - peerauthentications
      - requestauthentications
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["security.istio.io"]
    resources:
      - authorizationpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "release-operator.serviceAccountName" $ }}-rolebinding
  namespace: {{ $ns }}
  labels:
    {{- include "release-operator.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "release-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "release-operator.serviceAccountName" $ }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
