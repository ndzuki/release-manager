# NetworkPolicies for the production namespace.
#
# Model: deny all ingress by default, then allow only
#   1. the ingress controller (where one exists) and the TLS edge -> web/webhook,
#   2. pods in this namespace -> the namespace's service ports,
#   3. pods in this namespace -> PostgreSQL/Redis,
#   4. customer-cluster agents -> the orchestrator mTLS gateway (NodePort 30844),
#   5. the kubelet -> the application probe ports (nodeCidr),
#   6. the host -> the TLS edge's own 443 (NodePort 30443, edge.yaml).
#
# Egress is deliberately NOT restricted in this batch. The services need DNS,
# PostgreSQL, Redis, the OIDC/JWT endpoints and customer webhook receivers; a
# deny-all egress policy without that inventory would break the Helm execution
# path in ways that are hard to debug. Egress policy is a later batch. The
# debug-friendly consequence: `kubectl exec` from a pod in this namespace can
# still reach anything, which is intentional until the egress inventory exists.
#
# Verification note: kubelet probes are allowed explicitly below because k3s'
# default kube-router evaluates NetworkPolicies in the filter INPUT chain, where
# node -> pod packets are seen. A host-network ingress controller presents a
# node address too; that path still needs a real cluster to verify (TASK-337
# batch 3 wires the Ingress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Kubelet probes. The kubelet dials the pod IP from the node, not from a pod, so
# pod/namespace selectors cannot express it: this rule needs an ipBlock.
# k3s' default kube-router installs NetworkPolicies into the filter INPUT chain,
# where that node -> pod traffic is evaluated against the source address the
# node path presents (the Pod CIDR); without this rule default-deny drops every
# probe and no application pod ever becomes Ready (k3s issue #10030). The cidr
# is the Pod CIDR (10.42.0.0/16 on k3s). It is replaced from
# production-settings.nodeCidr by the replacement in kustomization.yaml; the
# literal below only keeps this file renderable standalone.
# A cluster with a different --cluster-cidr must set nodeCidr accordingly (the
# replacement makes that a one-value change). A CNI that does not evaluate
# policies on the node path may not need this rule; the real-cluster check is
# still owed in TASK-337 batch 3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-probes
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 8082 # webhook
        - protocol: TCP
          port: 8083 # orchestrator management plane
        - protocol: TCP
          port: 8084 # orchestrator agent gateway
        - protocol: TCP
          port: 8085 # auth
        - protocol: TCP
          port: 8086 # notifier
        - protocol: TCP
          port: 8087 # web
        - protocol: TCP
          port: 8088 # api
---
# The console/static SPA is the only public entry point in this batch: the TLS
# edge (edge.yaml) proxies every path to web:8087. The k3s Traefik ingress
# controller runs in kube-system; ingress-nginx is listed for clusters that
# install it instead. The namespace labels below are the automatic
# `kubernetes.io/metadata.name` labels Kubernetes puts on every namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-web
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: edge
      ports:
        - protocol: TCP
          port: 8087
---
# The host reaches the TLS edge through NodePort 30443 (mapped to host 8443 by
# `k3d node edit ... --port-add`, README.md). NodePort traffic is DNAT'ed and
# arrives from a node address, not from a namespace or a pod that a selector
# could name, so this rule intentionally has no `from` clause: it opens TCP 443
# on the edge pod and nothing else. Everything else in the namespace stays
# behind default-deny-ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-nodeport
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 443
---
# CI/Harbor callbacks use the webhook ingress. Until batch 3 puts it behind the
# Ingress, the console's nginx proxy reaches webhook through the intra-namespace
# rule below; this rule is for the direct external callback path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-webhook
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8082
---
# Service-to-service traffic inside the namespace. This is intentionally one
# coarse policy rather than 6x6 pairwise rules: the management plane is one
# trust domain today (all pods share the same ServiceAccount secrets and the
# same PostgreSQL credentials), and per-edge rules would make debugging a real
# incident much harder without adding a security boundary that does not exist.
# A later hardening batch can split this once service identities differ.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-service-ports
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: release-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: release-manager
      ports:
        - protocol: TCP
          port: 8082 # webhook
        - protocol: TCP
          port: 8083 # orchestrator management plane
        - protocol: TCP
          port: 8084 # orchestrator agent gateway
        - protocol: TCP
          port: 8085 # auth
        - protocol: TCP
          port: 8086 # notifier
        - protocol: TCP
          port: 8087 # web
        - protocol: TCP
          port: 8088 # api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: release-manager
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: release-manager
      ports:
        - protocol: TCP
          port: 6379
---
# Customer-cluster agents enroll and stream commands over mTLS on pod port
# 8084. They enter through Service operator's NodePort 30844 (mapped to host
# 8444, kustomization.yaml), which DNATs to this pod port; NetworkPolicy
# evaluates the post-DNAT port, so this rule names 8084 exactly as
# allow-edge-nodeport names the edge pod's 443 and not its 30443.
# The source is a node address (or the external client address, depending on
# the CNI's masquerade) -- not a namespace or pod a selector could name -- so
# this rule deliberately has no `from` clause: it opens TCP 8084 on the
# orchestrator pod and nothing else. Agents live outside this cluster, so an
# ipBlock allow-list would have to name every customer network; narrow this
# rule here if that inventory ever exists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-gateway
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8084
