version: "2"
run:
  build-tags:
    - integration
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - errcheck
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - diagnostic
        - performance
        - style
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: exported
          disabled: false
        - name: error-return
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: unused-parameter
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - all
        path: (\.pb\.go|\.pb\.gw\.go|_mock\.go|/mocks/|/gen/)
    paths:
      - third_party$
      - builtin$
      - examples$
      # node_modules is populated by `npm ci` for the web suite and can contain
      # Go source (e.g. flatted/golang). It is a dependency directory, never
      # project code, and linting it fails the gate on third-party style.
      - node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
