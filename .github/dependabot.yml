version: 2
# TASK-101: pinned actions and base images must still be able to move, so the
# pins come with an update bot instead of a manual rotation chore.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # deploy/fixtures ships a builder image too; without this entry its digest only
  # moves when someone remembers to bump it by hand (TASK-265).
  - package-ecosystem: docker
    directory: /deploy/fixtures
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
