apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: release-manager-dev
  labels:
    app.kubernetes.io/name: webhook
    app.kubernetes.io/part-of: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook
        app.kubernetes.io/part-of: release-manager
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: webhook
          image: localhost:5001/release-webhook:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /configs/webhook.dev.yaml
            - --orchestrator-url
            - http://orchestrator:8083
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /configs/webhook.dev.yaml
              subPath: webhook.dev.yaml
      volumes:
        - name: config
          configMap:
            name: webhook-config
---
apiVersion: v1
kind: Service
metadata:
  name: webhook
  namespace: release-manager-dev
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: webhook
  ports:
    - name: http
      port: 8082
      targetPort: http
      nodePort: 30082
