{{- $global := .Values.global | default dict }}
{{- $agent := .Values.agent | default dict }}
{{- $fuse := .Values.fuse | default dict }}
{{- $goofys := .Values.goofys | default dict }}
{{- $qdrant := .Values.qdrant | default dict }}
{{- $s3 := .Values.s3 | default dict }}
{{- $playwright := .Values.playwright | default dict }}

{{- /* 构建镜像引用 */ -}}
{{- $agentImage := dict "imageRoot" (dict 
  "registry" ($agent.imageRegistry | default $global.imageRegistry)
  "repository" ($agent.imageRepository | default "magic/super-magic") 
  "tag" ($agent.imageTag | default "0.0.6-stream")
  "digest" ($agent.imageDigest | default "")
) }}
{{- $fuseImage := dict "imageRoot" (dict 
  "registry" ($fuse.imageRegistry | default $global.imageRegistry)
  "repository" ($fuse.imageRepository | default "magic/s3fs-fuse") 
  "tag" ($fuse.imageTag | default "0.0.15")
  "digest" ($fuse.imageDigest | default "")
) }}
{{- $goofysImage := dict "imageRoot" (dict 
  "registry" ($goofys.imageRegistry | default $global.imageRegistry)
  "repository" ($goofys.imageRepository | default "magic/goofys") 
  "tag" ($goofys.imageTag | default "0.0.1")
  "digest" ($goofys.imageDigest | default "")
) }}
{{- $qdrantImage := dict "imageRoot" (dict 
  "registry" ($qdrant.imageRegistry | default $global.imageRegistry)
  "repository" ($qdrant.imageRepository | default "qdrant/qdrant/qdrant") 
  "tag" ($qdrant.imageTag | default "v1.15.1")
  "digest" ($qdrant.imageDigest | default "")
) }}
{{- $playwrightImage := dict "imageRoot" (dict 
  "registry" ($playwright.imageRegistry | default $global.imageRegistry)
  "repository" ($playwright.imageRepository | default "magic/playwright-mod") 
  "tag" ($playwright.imageTag | default "0.0.1")
  "digest" ($playwright.imageDigest | default "")
) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sandbox-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sandbox-gateway.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.port | default "80" | quote }}
  APP_ENV: {{ .Values.appEnv | default "prod" | quote }}
  LOG_LEVEL: {{ .Values.logLevel | default "info" | quote }}
  NAMESPACE: {{ .Values.namespace | default .Release.Namespace | quote }}
  STORAGE_TYPE: {{ .Values.storageType | default "s3" | quote }}
  # Magic Gateway integration
  MAGIC_GATEWAY_BASE_URL: {{ .Values.magicGatewayBaseUrl | default "http://magic-gateway" | quote }}

  FUSE_EXTRA_OPTIONS: {{ $fuse.extraOptions | default "-o use_path_request_style" | quote }}
  FUSE_LOCAL_SYMLINK_PATH: {{ $fuse.localSymlinkPath | default "venv:node_modules:vendor" | quote }}
  
  # Container images
  AGENT_IMAGE: {{ include "common.images.image" $agentImage }}
  AGENT_PORT: {{ $agent.port | default "8002" | quote }}
  {{- include "sandbox-gateway.configmapWorkloadResourceEnv" (dict "resources" $agent.resources "prefix" "AGENT") }}
  FUSE_IMAGE: {{ include "common.images.image" $fuseImage }}
  {{- include "sandbox-gateway.configmapWorkloadResourceEnv" (dict "resources" $fuse.resources "prefix" "FUSE") }}
  GOOFYS_IMAGE: {{ include "common.images.image" $goofysImage }}
  QDRANT_IMAGE: {{ include "common.images.image" $qdrantImage }}
  {{- include "sandbox-gateway.configmapWorkloadResourceEnv" (dict "resources" $qdrant.resources "prefix" "QDRANT") }}
  PLAYWRIGHT_IMAGE: {{ include "common.images.image" $playwrightImage }}
  
  # S3 configuration
  S3_CSI_DRIVER: {{ $s3.csiDriver | default "s3.csi.k8s.io" | quote }}
  S3_SECRET_NAME: {{ $s3.secretName | default "s3-secret" | quote }}
  S3_SECRET_NAMESPACE: {{ $s3.secretNamespace | default .Release.Namespace | quote }}
  S3_URL: {{ $s3.url | default "http://minio.magic.local" | quote }}
  S3_BUCKET: {{ $s3.bucket | default "magic-sandbox" | quote }}

