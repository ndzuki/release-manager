http_port: 8083
log_level: debug
database:
  driver: postgres
  dsn: postgres://release_manager:dev-release-manager@postgres:5432/release_manager?sslmode=disable
authorization:
  auth_url: http://auth:8085
  pull_interval: 1s
  pull_backoff_max: 30s
values:
  max_document_bytes: 1048576
  secret_patterns: []
trust:
  verification_timeout: 5s
maintenance: false
# TASK-094 §7-3: this block used to be `retention:` with pre-rename keys
# (bundle_days, candidate_artifact_days, preflight_result_hours,
# prepare_session_hours, gc_interval_hours). The orchestrator only ever
# UnmarshalKey("gc"), so the old block silently ran the cluster GC on
# DefaultGcConfig. Renamed and re-keyed to match configs/orchestrator.dev.yaml
# (values mirror the local dev file; prepare_session_hours has no `gc:`
# counterpart — prepare-session cleanup stays a compiled-in default).
gc:
  interval: 6h
  bundle_retention_days: 90
  archive_grace_days: 30
  candidate_artifact_retention_days: 30
  preflight_retention_days: 90
  orphan_preflight_retention_days: 7
  gc_max_duration_minutes: 55
  cleanup_idempotency_retention_hours: 24
gateway:
  enabled: true
  port: 8084
# 批次5 D1 (AC-065-36): the dev mTLS CA travels through the
# release-manager-mtls-ca Secret into these paths (subPath ca.key/ca.crt,
# see deploy/kustomize/services/orchestrator.yaml volumeMounts). The
# orchestrator reads the top-level ca: block (CAConfig, ADR-017) via
# ca.LoadConfigured. (The legacy gateway.ca_key_path/ca_cert_path dead fields
# were removed from GatewayCfg entirely — TASK-094 §7-4.)
ca:
  key_path: /data/gateway-ca.key
  cert_path: /data/gateway-ca.crt

# REQ-081 (D2=A): the orchestrator seeds these keys into app_settings at
# startup — the dev cluster runs with the emergency kill switch on.
# REQ-087 (D5=B): effect_observe_timeout (default 24h) is the stuck-lock
# observation window; a terminal EMERGENCY operation whose effect stays
# UNKNOWN past this window surfaces as a stuck lock (alert+audit, never
# auto-released).
emergency:
  enabled: true
  operation_timeout: 30s
  effect_observe_timeout: 24h
