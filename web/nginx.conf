# Same-origin reverse proxy for the release-manager web app (REQ-065).
# The SPA is served from /usr/share/nginx/html; Connect procedure prefixes are
# proxied to the in-cluster management-plane Services. Cookie flags
# (HttpOnly/SameSite) and CSRF semantics are controlled by the backend
# services; nginx only relays them and never strips or rewrites Set-Cookie.
server {
    listen 8087;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Connect procedure prefixes -> in-cluster Services (same path, same
    # origin; proxy_pass without a URI forwards the original request URI).
    location ^~ /auth.v1. {
        proxy_pass http://auth:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /orchestrator.v1. {
        proxy_pass http://orchestrator:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /webhook.v1. {
        proxy_pass http://webhook:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /operator.v1. {
        proxy_pass http://operator:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /notifier.v1. {
        proxy_pass http://notifier:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA history-mode fallback (vue-router createWebHistory).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
