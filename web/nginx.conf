# Same-origin reverse proxy for the release-manager web app (REQ-065).
# The SPA is served from /usr/share/nginx/html; Connect procedure prefixes are
# proxied to the in-cluster management-plane Services. Cookie flags
# (HttpOnly/SameSite) and CSRF semantics are controlled by the backend
# services; nginx only relays them and never strips or rewrites Set-Cookie.
server {
    listen 8087;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Connect procedure prefixes -> in-cluster Services (same path, same
    # origin; proxy_pass without a URI forwards the original request URI).
    location ^~ /auth.v1. {
        proxy_pass http://auth:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    # RunCleanup runs the retention collector SYNCHRONOUSLY with a server-side budget
    # of ~55 minutes, so the shared 300s read timeout above would cut a healthy
    # collection (the client allows 65 minutes for exactly this call). Longest-prefix
    # matching lets this narrower block win over `/orchestrator.v1.`.
    location ^~ /orchestrator.v1.CleanupService/ {
        proxy_pass http://orchestrator:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3900s;
    }

    location ^~ /orchestrator.v1. {
        proxy_pass http://orchestrator:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /webhook.v1. {
        proxy_pass http://webhook:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /operator.v1. {
        proxy_pass http://operator:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /notifier.v1. {
        proxy_pass http://notifier:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    # AuditService lives on release-api (8088), not on this container's own
    # port. Without this location `/audit.v1.` fell through to the SPA fallback
    # and answered 405, so the console's audit page could never load (B5).
    location ^~ /audit.v1. {
        proxy_pass http://api:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # TrustService is served by release-orchestrator (8083) but lives in its own
    # proto package (`trust.v1`), so it needs its own prefix. Without this location
    # `/trust.v1.` fell through to the SPA fallback and answered 405, exactly like
    # `/audit.v1.` did (B5) — found by the A5 trust-root page (TASK-193).
    location ^~ /trust.v1. {
        proxy_pass http://orchestrator:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # AC-065-35 (REQ-066 Grilling v9 下游义务): the probe/metadata endpoints
    # are reverse-proxied to one fixed Go backend (orchestrator) so web:8087
    # satisfies the control-plane 6-service consistency assertions. `^~`
    # prefix matching wins over the SPA fallback `location /` below.
    location ^~ /health {
        proxy_pass http://orchestrator:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /readyz {
        proxy_pass http://orchestrator:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /environment {
        proxy_pass http://orchestrator:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history-mode fallback (vue-router createWebHistory).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
