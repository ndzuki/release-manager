version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ndzuki/release-manager/api/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: ../gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.4.0
    out: ../gen
    opt: paths=source_relative
