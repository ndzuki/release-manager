# Store interface methods that are not called through their interface nor on a concrete
# implementer (TASK-224).
#
# The list is produced by `go run ./cmd/storesurface/`, which loads the packages with
# go/packages and matches calls against the interfaces' *types.Func objects: comments,
# string literals and same-named methods on unrelated types do not count, and a method a
# concrete type EXPLICITLY BOUND to the interface calls (anywhere in the module, not just the
# store package) is alive. Every entry needs a reason and a
# review date; the gate fails when a dead method is missing here, when an entry no longer
# matches a dead method, when a reason is missing, or when review_by has passed.
#
# The first registry (TASK-224) listed 36 methods because it counted bare method names and
# same-named methods masked each other; the type-based analysis found 67. That difference is
# the finding, not a regression.
