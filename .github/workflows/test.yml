name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run SDK-only static gate
        run: go run ./cmd/sdkcheck/ -exceptions sdkcheck.exceptions.yaml ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.71.0"

      - name: Generate proto
        run: make proto

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  rollout-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: release-manager-rollout
          wait: 90s

      - name: Run rollout watch integration gate
        run: make test-rollout-watch
