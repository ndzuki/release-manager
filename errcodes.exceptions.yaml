version: "1"
# Accepted unemitted error codes for `make check-error-codes` (TASK-125).
#
# Every entry needs a reason and an expires_at; an expired entry stops excepting,
# so the code is checked again and the gate fails until it is fixed or the
# exception is renewed. Codes listed here are asserted by an AC but have no
# emitter, which means a client cannot branch on them.
#
# The list is deliberately tied to the 2026-09-18 audit
# (Notes/Audit-2026-09-18/05-error-code-emittability.md): each entry is a known
# gap with an owning requirement, not a permanent allowance.
exceptions:
  - owner: "release-manager"
    code: "non_bundle_image"
    reason: "REQ-056: the backend half of the non-bundle-image rejection is not wired; the frontend maps it but internal/ has no such code. Tracked as REQ-056 partial (audit bucket A/B)."
    expires_at: "2026-12-31"




  - owner: "release-manager"
    code: "emergency_feature_disabled"
    reason: "REQ-058: server-side annotation validation is missing; the codes exist only in the web client. Tracked as REQ-058 partial (audit bucket C)."
    expires_at: "2026-12-31"


