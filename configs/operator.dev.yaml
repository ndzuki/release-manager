http_port: 8084
log_level: debug
runtime_pull_preflight:
  enabled: false
  namespace: ""
  service_account: ""
  timeout: 2m
  cleanup_policy: always
  probe_command:
    - /bin/true

agent:
  mode: agent
  customer_id: dev-customer-a
  cluster_id: dev-customer-a-direct
  operator_name: dev-customer-a-direct
  enrollment_token_file: data/enrollment.token
ca:
  cert_path: data/gateway-ca.crt
  cert_ttl: 168h
  renew_before_ratio: 0.5
