apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: release-manager-dev
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        app.kubernetes.io/part-of: release-manager
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: notifier
          image: localhost:5001/release-notifier:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /configs/notifier.dev.yaml
          # D3: every management-plane service consumes release-manager-jwt.
          envFrom:
            - secretRef:
                name: release-manager-jwt
          env:
            # TASK-096 (REQ-031): NotifierService is machine-to-machine and now
            # requires a scoped service token (auth.ServiceTokenInterceptor).
            # optional: an overlay without the Secret leaves the surface closed
            # rather than open — an absent allowlist matches nothing.
            - name: DEV_NOTIFIER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: release-manager-notifier-service-token
                  key: NOTIFIER_SERVICE_TOKEN
                  optional: true
            - name: DEV_NOTIFIER_SERVICE_TOKEN_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: release-manager-notifier-service-token
                  key: NOTIFIER_SERVICE_TOKEN_PREVIOUS
                  optional: true
          ports:
            - name: http
              containerPort: 8086
          # TASK-099: startupProbe absorbs the synchronous store-open +
          # migration window; liveness must not fight slow startup.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /configs/notifier.dev.yaml
              subPath: notifier.dev.yaml
      volumes:
        - name: config
          configMap:
            name: notifier-config
---
apiVersion: v1
kind: Service
metadata:
  name: notifier
  namespace: release-manager-dev
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: notifier
  ports:
    - name: http
      port: 8086
      targetPort: http
      nodePort: 30086
