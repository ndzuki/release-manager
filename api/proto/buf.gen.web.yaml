version: v2
plugins:
  - remote: buf.build/bufbuild/es
    out: web/src/gen
    opt:
      - target=ts
      - import_extension=none
inputs:
  - directory: api/proto
    paths:
      - api/proto/auth/v1/auth.proto
      - api/proto/common/v1/domain.proto
      - api/proto/common/v1/trust.proto
      - api/proto/orchestrator/v1/orchestrator.proto
      - api/proto/audit/v1/audit.proto
      - api/proto/common/v1/types.proto
