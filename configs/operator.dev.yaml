http_port: 8084
log_level: debug
agent:
  mode: agent
  customer_id: dev-customer-a
  cluster_id: dev-customer-a-direct
  operator_name: dev-customer-a-direct
  enrollment_token_file: data/enrollment.token
ca:
  # The operator only consumes ca.cert_path (agent-side mTLS trust anchor).
  # ca.cert_ttl / ca.renew_before_ratio are orchestrator-side CA-authority
  # settings; setting them here decodes but changes nothing (TASK-094 §7-6).
  cert_path: data/gateway-ca.crt
