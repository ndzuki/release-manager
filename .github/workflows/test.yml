name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run SDK-only static gate
        run: go run ./cmd/sdkcheck/ -exceptions sdkcheck.exceptions.yaml ./...

  install-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0

      - name: Run Helm Install SDK integration gate
        run: make test-install-sdk

  operator-image-sdk-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run operator image SDK-only gate
        run: make test-operator-image-sdk-only

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.71.0"

      - name: Generate proto
        run: make proto

      # analysistest runs testdata fixtures in module mode with GOPROXY=off
      # (x/tools go/analysis/analysistest), so every fixture dependency must
      # already be in the module cache. The fixture modules are independent of
      # the root go.mod, so prefetch them explicitly and cache them by their
      # own go.sum hashes — otherwise every CI run re-downloads the Helm
      # dependency tree and the analyzer tests fail offline.
      - name: Cache analyzer fixture modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: fixture-mod-${{ hashFiles('internal/quality/sdkcheck/testdata/**/go.mod', 'internal/quality/sdkcheck/testdata/**/go.sum') }}

      - name: Prefetch analyzer fixture modules
        run: |
          for d in internal/quality/sdkcheck/testdata/*/; do
            (cd "$d" && go mod download)
          done

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
