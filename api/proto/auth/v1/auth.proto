// File: auth/v1/auth.proto
// Package auth.v1 owns who may act on a deployment: local accounts, sessions,
// bearer tokens, organizations, organization membership, the organization-to-
// customer bindings that scope cross-tenant work, and the readable authorization
// snapshot a caller resolves before acting.
// release-auth (dev port 8085) serves AuthService, OrganizationService,
// BindingService and AuthorizationService. Callers are the browser console, the
// other service binaries (ValidateToken, GetAuthorizationSnapshot) and
// administrative tooling. ExternalIdentityService is declared here but mounted
// by no binary; see its service comment.
// Three of the RPCs (GetInitStatus, Initialize, Login, RefreshToken,
// ValidateToken) are anonymous by design; every other procedure is authenticated
// with a bearer token or the access cookie, checked against the caller's
// organization and Casbin policy by the shared interceptor, which also demands a
// CSRF token for cookie-authenticated writes.
// An access token lives about 15 minutes, a refresh token about 7 days, and all
// expiry stamps in this package are Unix seconds, not milliseconds.
syntax = "proto3";

package auth.v1;

option go_package = "github.com/ndzuki/release-manager/api/gen/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

// --- AuthService (REQ-025) ---

message LoginRequest {
  string username = 1;
  string password = 2;
}

message SessionUser {
  string id = 1;
  string username = 2;
  repeated string roles = 3;
  string active_org_id = 4;
}

message LoginResponse {
  SessionUser user = 1;
  repeated Organization organizations = 2;
  // Access-token expiry in Unix seconds. The refresh token lives far longer and is
  // not reported here.
  int64 expires_at = 3;
  // Bearer credential for every other RPC. In cookie mode the browser session keeps
  // this empty and sets an HttpOnly cookie instead.
  string access_token = 4;
  // Single-use rotation credential: whichever value a caller last received is the
  // only one that still works, and replaying a spent one revokes the family.
  string refresh_token = 5;
  string token_type = 6;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  SessionUser user = 1;
  repeated Organization organizations = 2;
  int64 expires_at = 3;
  string access_token = 4;
  string refresh_token = 5;
  string token_type = 6;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  // True only; an invalid token is returned as an error rather than as valid=false,
  // so a client cannot distinguish the two from the payload alone.
  bool valid = 1;
  SessionUser user = 2;
  repeated Organization organizations = 3;
  int64 expires_at = 4;
  string user_id = 5;
  repeated string roles = 6;
  string org_id = 7;
}

message GetInitStatusRequest {}

message GetInitStatusResponse {
  bool initialized = 1;
}

message InitializeRequest {
  string username = 1;
  string password = 2;
  string organization_name = 3;
}

message InitializeResponse {
  SessionUser user = 1;
  repeated Organization organizations = 2;
  int64 expires_at = 3;
  string access_token = 4;
  string refresh_token = 5;
  string token_type = 6;
}

message SwitchOrganizationRequest {
  string org_id = 1;
}

message SwitchOrganizationResponse {
  SessionUser user = 1;
  repeated Organization organizations = 2;
  int64 expires_at = 3;
  string access_token = 4;
  string refresh_token = 5;
  string token_type = 6;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

// LocalUser is a local user account with its organization role binding (REQ-025, D-12/D-14).
message LocalUser {
  string id = 1;
  string username = 2;
  repeated string roles = 3;
  string org_id = 4;
  // One of active, pending, disabled. Only active accounts can authenticate; a
  // disabled account's sessions stop validating.
  string status = 5;
}

// CreateLocalUserRequest creates a local user bound to the caller's organization (D-12).
// Roles accepts at most one value (empty = viewer); platform_admin is rejected (D-16).
message CreateLocalUserRequest {
  string username = 1;
  string password = 2;
  repeated string roles = 3;
  string org_id = 4; // empty = caller's active organization
}

message CreateLocalUserResponse {
  LocalUser user = 1;
}

message GetLocalUserRequest {
  string username = 1;
}

message GetLocalUserResponse {
  LocalUser user = 1;
}

// ListLocalUsersRequest reuses the REQ-010 cursor pagination contract (page_size <= 100).
message ListLocalUsersRequest {
  string cursor = 1;
  int32 page_size = 2;
}

message ListLocalUsersResponse {
  repeated LocalUser users = 1;
  string next_cursor = 2;
}

// AuthService issues and validates the credentials every other service checks,
// and manages local accounts.
// Callers: the browser console, administrative tooling, and release-orchestrator
// and release-api, which validate tokens locally with the shared signing key
// rather than calling ValidateToken.
// Trust boundary: Login, Initialize, GetInitStatus, RefreshToken and
// ValidateToken answer anonymously; the rest require a live session, an active
// user and organization-scoped authorization.
service AuthService {
  // Reports whether any user exists, which is what the console uses to decide
  // between the first-run bootstrap form and a login form.
  // Anonymous read, replayable, and the only procedure usable while the service is
  // in maintenance mode.
  // Answers the question "is the user table non-empty", so it says nothing about
  // how many organizations or administrators exist.
  // INTERNAL on a store failure.
  rpc GetInitStatus(GetInitStatusRequest) returns (GetInitStatusResponse);
  // First-run bootstrap: creates the initial organization and a platform_admin
  // account, then returns a session for it.
  // Not idempotent in the replay sense. It is guarded instead by the initialization
  // flag: once any user exists a further call is refused with ALREADY_EXISTS
  // (system already initialized), so the credential can only be set once and a lost
  // response must be recovered by logging in, not by retrying.
  // Anonymous by design, which is safe only while nothing is initialized: the
  // deployment must reach this RPC before any user does.
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  // Exchanges a username and password for an access token plus a refresh token,
  // and opens an auth session that all other RPCs require.
  // Not replayable in a useful way: each success mints a new session and refresh
  // token family, so retrying after a lost response leaves an extra live session.
  // Wrong credentials and unknown users both answer UNAUTHENTICATED with the same
  // text, deliberately, so the code never reveals whether an account exists. A
  // disabled account is reported the same way.
  // Per-username throttling answers RESOURCE_EXHAUSTED (too many login attempts).
  // In cookie mode the tokens stay empty in the response body and are set as
  // HttpOnly cookies instead.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Revokes the caller's session: a supplied refresh_token retires its whole
  // token family, otherwise every session of the authenticated user is revoked.
  // Convergent rather than idempotent-keyed: an unknown or already revoked token is
  // not an error, and in cookie mode it only clears the cookies, so a replay always
  // answers success.
  // Does not shorten the lifetime of an already-issued access token; that expires
  // on its own, so the caller is refused from then on because no live session
  // remains.
  // Requires a live session but no particular role.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Rotates a refresh token: retires the presented one, issues a replacement and
  // returns a fresh access token.
  // Single-use by design. Replaying a token that was already rotated is treated as
  // token theft: the whole family is revoked and the call answers UNAUTHENTICATED,
  // so the client must persist each returned refresh token immediately.
  // An expired or unknown token answers UNAUTHENTICATED; there is no way to
  // re-attach an old session.
  // Anonymous, because it carries its own credential.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // Checks an access token's signature, lifetime and authorization context and
  // returns the user, roles and organization it implies.
  // Read-only and replayable.
  // A bad or expired token is reported as an error (UNAUTHENTICATED), so a caller
  // must handle an error, not just valid false.
  // Cookie sessions are checked here too, so a revoked user stops validating before
  // the token's own expiry.
  // Most service binaries validate locally against the shared signing key instead
  // of calling this; the console and end-to-end tests are the real clients.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  // Re-issues the caller's access token with a different organization as the
  // active one, so organization-scoped work can move without a new login.
  // The refresh token and session are left alone; the returned access token is a
  // short-lived projection of memberships the caller already has.
  // Fails PERMISSION_DENIED when the caller is not a member of the target
  // organization.
  // Note that the shared interceptor maps procedures to actions by name prefix and
  // has no entry for this verb, so over HTTP the request is currently refused as an
  // invalid actor context before the handler runs.
  rpc SwitchOrganization(SwitchOrganizationRequest) returns (SwitchOrganizationResponse);
  // Verifies the old password and stores a new hash for the authenticated user.
  // Not a credential-preserving operation: every auth session of the user is
  // revoked on success, so the caller must log in again afterwards.
  // A wrong old password answers UNAUTHENTICATED; a store failure during the
  // revocation step fails closed rather than reporting success.
  // The server applies no password strength policy: length and character rules
  // are the caller's responsibility today.
  // Requires an authenticated caller; it always acts on the session's own user, so
  // there is no administrator-reset path here.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Creates a local account bound to an organization with one role.
  // Idempotent on the username: an existing name returns that user unchanged and
  // never overwrites its password, so a retry after a lost response converges, and
  // there is no way to use this RPC to reset a password.
  // Fails INVALID_ARGUMENT on an empty username, more than one role or an unknown
  // role, PERMISSION_DENIED when the caller is not a platform_admin, may not grant
  // the target role, or is not a member of the target organization, and
  // FAILED_PRECONDITION when that organization is disabled.
  // Requires the platform_admin role in the organization being written to.
  rpc CreateLocalUser(CreateLocalUserRequest) returns (CreateLocalUserResponse);
  // Reads one local account and its aggregated roles by username.
  // Read-only and replayable; NOT_FOUND when no such account exists.
  // Requires auth/read, which the built-in role model gives platform_admin.
  rpc GetLocalUser(GetLocalUserRequest) returns (GetLocalUserResponse);
  // Lists local accounts with an opaque cursor and a page size.
  // Read-only and replayable while the cursor is still valid; a cursor the server
  // cannot decode answers INVALID_ARGUMENT (invalid or expired cursor), so resume
  // from the first page instead of retrying the same token.
  // Requires auth/read.
  rpc ListLocalUsers(ListLocalUsersRequest) returns (ListLocalUsersResponse);
}

// --- OrganizationService (REQ-026) ---

message Organization {
  string id = 1;
  string name = 2;
  // One of active, disabled. Disabling is terminal: no procedure reverses it.
  string status = 3;
  // Compare-and-swap token. Send it back unchanged as expected_version on an update
  // or disable; a rejected write means someone else changed the row first.
  int64 optimistic_version = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message OrganizationMember {
  string org_id = 1;
  string user_id = 2;
  // One of platform_admin, release_admin, deployer, viewer.
  string role = 3;
  int64 optimistic_version = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateOrganizationRequest {
  string name = 1;
}

message CreateOrganizationResponse {
  Organization organization = 1;
}

message GetOrganizationRequest {
  string org_id = 1;
}

message GetOrganizationResponse {
  Organization organization = 1;
}

message ListOrganizationsRequest {}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}

message UpdateOrganizationRequest {
  string org_id = 1;
  string name = 2;
  int64 expected_version = 3;
}

message UpdateOrganizationResponse {
  Organization organization = 1;
}

message DisableOrganizationRequest {
  string org_id = 1;
  int64 expected_version = 2;
}

message DisableOrganizationResponse {
  Organization organization = 1;
}

message AddMemberRequest {
  string org_id = 1;
  string user_id = 2;
  string role = 3;
}

message AddMemberResponse {
  OrganizationMember member = 1;
}

message RemoveMemberRequest {
  string org_id = 1;
  string user_id = 2;
  // Accepted for symmetry with the other membership writes and ignored by the
  // current implementation.
  int64 expected_version = 3;
}

message RemoveMemberResponse {}

message ListMembersRequest {
  string org_id = 1;
}

message ListMembersResponse {
  repeated OrganizationMember members = 1;
}

message UpdateMemberRoleRequest {
  string org_id = 1;
  string user_id = 2;
  string new_role = 3;
  int64 expected_version = 4;
}

message UpdateMemberRoleResponse {
  OrganizationMember member = 1;
}

// OrganizationService manages organizations and their membership, which is the
// domain every other authorization decision in this contract is evaluated in.
// Callers: the browser console and administrative tooling.
// Trust boundary: an authenticated caller may only touch the organization its
// token names, and every request carries an organization field matched against
// it; membership roles, not request fields, decide what a caller may do.
service OrganizationService {
  // Creates a top-level organization and adds the caller to it as platform_admin
  // of the new organization, so the creator can keep working in it immediately.
  // The membership write is best effort: if it fails, the organization still
  // exists and the call reports success, so confirm membership afterwards.
  // Not idempotent: there is no deduplication key and names are not unique, so a
  // retry after a lost response creates a second organization.
  // Fails INTERNAL on a store fault; the name is not required to be unique.
  // Requires platform_admin (enforced in the handler as well as by policy).
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  // Reads one organization by identifier.
  // Read-only and replayable; NOT_FOUND for an unknown identifier.
  // Requires organization/read.
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  // Lists every organization in the deployment.
  // Read-only, replayable and unpaginated: the answer grows with the deployment,
  // and although policy must be granted in the caller's own domain, the result is
  // not narrowed to organizations the caller belongs to.
  // Requires organization/read.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  // Renames an organization under optimistic locking.
  // Concurrent-conflict semantics: expected_version must match the stored version
  // or the write is refused with ABORTED (optimistic lock conflict); re-read and
  // retry.
  // A disabled organization cannot be updated: FAILED_PRECONDITION.
  // NOT_FOUND for an unknown organization.
  // Requires organization/write.
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse);
  // Disables an organization, which stops its members acting on anything scoped to
  // it. There is no re-enable procedure.
  // Versioned write with no state check: the request carries no "was enabled"
  // guard, so a replay with the version this call just wrote answers ABORTED
  // (optimistic lock conflict) and a re-read followed by another disable
  // succeeds again.
  // Requires organization/write.
  rpc DisableOrganization(DisableOrganizationRequest) returns (DisableOrganizationResponse);
  // Grants a user a role in an organization, or updates the role of an existing
  // member.
  // Not convergent: the (organization, user) pair is the primary key and the
  // insert has no upsert, so re-adding an existing member fails as INTERNAL
  // instead of updating its role; use the role-update procedure for that.
  // Fails INVALID_ARGUMENT on an unknown role, NOT_FOUND on an unknown
  // organization, FAILED_PRECONDITION when it is disabled, and PERMISSION_DENIED
  // when the caller is not a member or may not grant the requested role.
  // Requires organization/write.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  // Revokes a user's membership in an organization; the account itself survives.
  // Convergent: removing a member that is already gone answers success.
  // Refused with FAILED_PRECONDITION when it would remove the last platform_admin
  // of the organization, so an organization cannot lose its only administrator.
  // expected_version is not consulted by the current implementation, so it
  // provides no protection against a lost update here.
  // Requires organization/write.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // Lists the members and roles of one organization.
  // Read-only and replayable, unpaginated.
  // Fails INTERNAL only; an empty organization yields an empty list.
  // Requires member/read.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // Changes an existing member's role under optimistic locking, and is the only
  // way to demote or promote without a remove-and-add pair.
  // Conflicts are reported as ABORTED (optimistic lock conflict) when
  // expected_version is stale.
  // Fails INVALID_ARGUMENT on an unknown role, NOT_FOUND when the user is not a
  // member, and FAILED_PRECONDITION when the change would leave no platform_admin.
  // Requires organization/write.
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
}

// --- BindingService (REQ-049) ---

message OrgCustomerBinding {
  string id = 1;
  string org_id = 2;
  string customer_id = 3;
  // One of active, revoked. A revoked binding still exists for history and audit,
  // but grants no access.
  string status = 4;
  int64 optimistic_version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateBindingRequest {
  string org_id = 1;
  string customer_id = 2;
}

message CreateBindingResponse {
  OrgCustomerBinding binding = 1;
}

message GetBindingRequest {
  string binding_id = 1;
}

message GetBindingResponse {
  OrgCustomerBinding binding = 1;
}

message ListBindingsRequest {
  string org_id = 1;
}

message ListBindingsResponse {
  repeated OrgCustomerBinding bindings = 1;
}

message RevokeBindingRequest {
  string binding_id = 1;
  int64 expected_version = 2;
}

message RevokeBindingResponse {
  OrgCustomerBinding binding = 1;
}

// BindingService manages organization-to-customer bindings, the join that
// decides which customer a tenant may act on. A release action is only permitted
// when the caller's organization is bound to the target customer.
// Callers: the browser console and platform tooling.
// Trust boundary: an authenticated caller scoped to its own organization; reads
// resolve the organization behind a binding identifier so one tenant cannot probe
// another tenant's binding by identifier.
service BindingService {
  // Binds an organization to a customer, or reactivates a previously revoked
  // binding for the same pair.
  // Idempotent on the (organization, customer) pair: an active binding for the pair
  // is refused with ALREADY_EXISTS (duplicate_binding) rather than duplicated, and
  // reactivating a revoked one is a versioned update that answers ABORTED
  // (optimistic_lock_conflict) on a lost race.
  // Fails INVALID_ARGUMENT with a missing identifier, NOT_FOUND for an unknown
  // organization or customer, FAILED_PRECONDITION when either is disabled.
  // Requires binding/write.
  rpc CreateBinding(CreateBindingRequest) returns (CreateBindingResponse);
  // Reads one binding by identifier.
  // Read-only and replayable; NOT_FOUND (binding_not_found) for an unknown or
  // cross-tenant identifier.
  // Requires binding/read.
  rpc GetBinding(GetBindingRequest) returns (GetBindingResponse);
  // Lists the bindings of one organization.
  // Read-only and replayable, unpaginated.
  // Fails INVALID_ARGUMENT without an organization identifier; an empty result is
  // not an error.
  // Requires binding/read.
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse);
  // Revokes a binding so the organization loses access to that customer; history is
  // kept rather than deleted.
  // Versioned: a stale expected_version answers ABORTED
  // (optimistic_lock_conflict), and an already revoked binding answers
  // FAILED_PRECONDITION (binding_revoked) rather than replaying the first result.
  // Requires binding/write.
  rpc RevokeBinding(RevokeBindingRequest) returns (RevokeBindingResponse);
}

// --- Authorization Snapshot (REQ-027) ---

message GetAuthorizationSnapshotRequest {
  // Must be a UUID, and is the domain the capability flags are evaluated in.
  string organization_id = 1;
  string customer_id = 2;
}

message GetAuthorizationSnapshotResponse {
  string organization_id = 1;
  string customer_id = 2;
  bool binding_active = 3;
  bool customer_active = 4;
  string role = 5;
  bool can_execute_emergency = 6;
  bool can_resolve_emergency = 7;
  bool can_create_values_revision = 8;
  bool can_approve_values_revision = 9;
  // Monotonic counter of the authorization state this snapshot was computed from;
  // pairs with policy_version to tell a client how stale its cached decision is.
  uint64 source_version = 10;
  uint64 policy_version = 11;
  uint64 checkpoint = 12;
  // False when nothing was persisted yet for this scope, so a client must not read
  // an all-false capability set as a decision.
  bool fresh = 13;
  string actor_id = 14;
  // Global emergency change kill switch (REQ-079 D6): false blocks every
  // ExecuteEmergencyChange entry.
  bool emergency_change_enabled = 15;
}

message SetCapabilityGrantRequest {
  string organization_id = 1;
  string subject = 2;
  string action = 3;
  bool revoked = 4;
}

message SetCapabilityGrantResponse {
  uint64 source_version = 1;
  uint64 policy_version = 2;
}

// AuthorizationService exposes the authorization decision a caller is about to
// act under as a readable snapshot, and lets an administrator toggle one capability
// grant.
// Callers: the browser console (notably before offering an emergency action) and
// operational tooling.
// Trust boundary: authorization is evaluated inside the handler against the
// requested organization and customer rather than by the shared policy
// interceptor, so the response always describes the caller's own rights.
service AuthorizationService {
  // Reads the caller's effective role and capability flags for one organization and
  // customer pair, together with the policy and source versions the answer was
  // computed from.
  // Read-only and replayable, but the versions make the answer explicitly stale-
  // able: a client must re-read rather than cache it indefinitely.
  // Every refusal is deliberately indistinguishable: an unknown scope, a disabled
  // organization or customer, or a missing binding all answer PERMISSION_DENIED
  // with a machine reason code, and an unreadable policy answers UNAVAILABLE
  // (POLICY_UNAVAILABLE) so a client fails closed.
  // Requires valid UUID identifiers for both scope fields.
  rpc GetAuthorizationSnapshot(GetAuthorizationSnapshotRequest) returns (GetAuthorizationSnapshotResponse);
  // Grants or revokes a single capability for one subject inside an organization,
  // and returns the new source and policy versions.
  // Convergent: applying the same grant twice leaves one entry, and the versioned
  // update answers ABORTED (AUTHORIZATION_VERSION_CONFLICT) when the store moved
  // underneath it, so the caller re-reads and retries.
  // Fails INVALID_ARGUMENT on a malformed scope or an unsupported action, and
  // PERMISSION_DENIED when the caller is not an administrator, the subject is not
  // an active member, or the scope is unavailable.
  // Requires an administrator role in the target organization; nothing in the
  // product currently calls it, so it exists for operators and future tooling.
  rpc SetCapabilityGrant(SetCapabilityGrantRequest) returns (SetCapabilityGrantResponse);
}

// --- External IdP (REQ-028) ---

message IdPConfig {
  string provider = 1;
  string client_id = 2;
  string issuer_url = 3;
  // Directory or provider group to local role mapping; a provider identity with no
  // match gets no roles rather than a default one.
  map<string, string> role_mappings = 4;
}

message AuthenticateLDAPRequest {
  string username = 1;
  string password = 2;
}

message AuthenticateLDAPResponse {
  LoginResponse session = 1;
}

message GetOIDCAuthURLRequest {}

message GetOIDCAuthURLResponse {
  string url = 1;
}

message GetDingTalkAuthURLRequest {}

message GetDingTalkAuthURLResponse {
  string url = 1;
}

// ExternalIdentityService describes identity federation: directory
// authentication and the redirect URLs for browser-based sign-in.
// Contract level only: no service binary mounts this service today, so these
// procedures have no reachable handler, and the identifiers below describe the
// intended shape rather than observed behaviour.
// Intended trust boundary: AuthenticateLDAP is a credential exchange performed
// before a session exists, the URL builders answer anonymously, and any returned
// session must still carry the organization and role a local policy grants.
// Intended callers: an interactive sign-in flow that needs a provider URL
// before it holds any session. Nothing in this repository calls these three
// procedures and the console has no consumer for them, so treat the shapes
// here as an unfulfilled contract rather than as behaviour to rely on.
service ExternalIdentityService {
  // Would authenticate a directory username and password and return the same
  // session shape a local login returns, so a federated principal enters the
  // contract without a local password.
  // No handler is mounted, so there is no observed idempotency or failure behaviour
  // to rely on.
  // Contract expectation: the credential travels in the request, so the transport
  // must be TLS-terminated and directory availability must surface as an error, not
  // as an empty session.
  rpc AuthenticateLDAP(AuthenticateLDAPRequest) returns (AuthenticateLDAPResponse);
  // Would return the provider authorization URL to redirect a browser to, with the
  // state and redirect parameters already embedded.
  // Contract expectation: pure read of configuration, so it must stay reachable
  // before anyone is signed in; the callback that completes the flow is an HTTP
  // handler, not part of this contract.
  // No handler is mounted, and no provider is configured by any binary today.
  rpc GetOIDCAuthURL(GetOIDCAuthURLRequest) returns (GetOIDCAuthURLResponse);
  // Would return the sign-in URL for the second supported external provider, with
  // the same contract shape as GetOIDCAuthURL.
  // No handler is mounted, and no provider is configured by any binary today.
  rpc GetDingTalkAuthURL(GetDingTalkAuthURLRequest) returns (GetDingTalkAuthURLResponse);
}
