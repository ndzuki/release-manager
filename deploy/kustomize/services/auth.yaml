apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: release-manager-dev
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/part-of: release-manager
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: auth
          image: localhost:5001/release-auth:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /configs/auth.dev.yaml
          # REQ-065 AC-065-01 / D1=A: cmd/auth is the ONLY holder of the Ed25519
          # signing key — it signs the management-plane access tokens. The key
          # travels via the JWT_PRIVATE_KEY env var (release-manager-jwt-private
          # Secret); Kubernetes cannot expand secretKeyRef values inside args
          # ($(VAR) only sees env `value`), and key rotation rolls this
          # Deployment via the Secret hash.
          env:
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: release-manager-jwt-private
                  key: JWT_PRIVATE_KEY
          ports:
            - name: http
              containerPort: 8085
          # TASK-099: startupProbe absorbs the synchronous store-open +
          # migration window; liveness must not fight slow startup.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /configs/auth.dev.yaml
              subPath: auth.dev.yaml
      volumes:
        - name: config
          configMap:
            name: auth-config
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: release-manager-dev
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: http
      port: 8085
      targetPort: http
      nodePort: 30085
