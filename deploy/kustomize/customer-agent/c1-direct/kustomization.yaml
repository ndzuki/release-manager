apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
# Agent-only overlay for the dev-customer-a-direct cluster. Runs only the
# operator agent with the per-cluster identity config; no management plane.
configMapGenerator:
  - name: operator-config
    namespace: release-manager-customer
    files:
      - configs/operator.dev.yaml
