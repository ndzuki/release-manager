name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.71.0"

      - name: Generate proto
        run: make proto

      - name: Run tests
        run: go test -race ./...

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
