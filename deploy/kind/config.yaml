kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: release-manager-dev
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 8082
        hostPort: 8082
        protocol: TCP
      - containerPort: 8083
        hostPort: 8083
        protocol: TCP
      - containerPort: 8084
        hostPort: 8084
        protocol: TCP
      - containerPort: 8085
        hostPort: 8085
        protocol: TCP
      - containerPort: 8086
        hostPort: 8086
        protocol: TCP
      - containerPort: 8087
        hostPort: 8087
        protocol: TCP
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
