http_port: 8088
log_level: debug
audit:
  archive:
    retention_days: 90
    poll_interval: 6h
    batch_size: 1000
    archive_dir: data/archives
    compression: gzip_jsonl
    checksum_algorithm: sha256
# release-api asks release-auth for the caller's role-aware audit scope
# (ADR-021). In-cluster the auth Service answers on 8085; the repository-root
# configs/api.dev.yaml keeps localhost for the manual `make run-api` entry.
authorization:
  auth_url: http://auth:8085
