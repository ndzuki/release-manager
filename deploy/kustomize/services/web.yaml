apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: release-manager-dev
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: release-manager
    spec:
      containers:
        - name: web
          image: localhost:5001/release-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
          # TASK-099: static asset server — / is the only endpoint; the
          # startupProbe replaces the liveness initialDelay as the boot budget.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: release-manager-dev
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8087
      targetPort: http
      nodePort: 30087
