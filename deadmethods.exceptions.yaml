# Exported methods on unexported receiver types that nothing references and no interface claims
# (TASK-234).
#
# The list is produced by `go run ./cmd/deadmethods/`, which loads the module with go/packages
# and answers two questions with go/types: does the method object appear in TypesInfo.Uses or
# TypesInfo.Selections anywhere in shipping code, and does any interface reachable from the
# loaded package graph (standard library and third-party modules included) declare it for a type
# that implements that interface. Comments, string literals and same-named methods on other types
# do not count. Every entry needs a reason and a review date; the gate fails when an unreferenced
# method is missing here, when an entry no longer matches one (stale), when a reason is missing,
# or when review_by has passed.
#
# This registry is NOT part of `make quality` and NOT wired into CI: whether that happens is a
# project decision, not an implementation detail.

exceptions:
  # TASK-234 finding (2026-09-30): both methods are unreachable today. Casbin selects them only
  # through the runtime assertion `e.adapter.(persist.UpdatableAdapter)`
  # (enforcer_distributed.go:144/174), but *storeAdapter does not implement that interface: it is
  # missing UpdateFilteredPolicies, which persist.UpdatableAdapter requires
  # (persist/update_adapter.go:18-26). The bodies only return "authorization policy writes use
  # AuthorizationStore" anyway, so nothing calls them. Kept rather than deleted because whether
  # this adapter should support Casbin's Auto-Save/update path (and therefore gain
  # UpdateFilteredPolicies) is a product decision; TASK-234 reported it to the Lead instead of
  # forcing a fix.
  - package: github.com/ndzuki/release-manager/internal/auth
    receiver: storeAdapter
    method: UpdatePolicy
    reason: "[dynamic-iface] 当前不可达：本仓构建的是 casbin.NewSyncedEnforcer（internal/auth/casbin.go:56），而唯一选择 persist.UpdatableAdapter 的代码在 DistributedEnforcer 路径（enforcer_distributed.go:144/174）⇒ 这两行根本不会执行。注意该断言**不带 comma-ok**：*storeAdapter 恰缺 UpdateFilteredPolicies（UpdatableAdapter = Adapter 5 方法 + UpdatePolicy + UpdatePolicies + UpdateFilteredPolicies）⇒ 若将来改用 DistributedEnforcer，走到该行会 panic 而非静默跳过。保留待裁决（补齐 UpdateFilteredPolicies 或删除这两个 stub，属产品决定）"
    review_by: "2026-12-31"
  - package: github.com/ndzuki/release-manager/internal/auth
    receiver: storeAdapter
    method: UpdatePolicies
    reason: "[dynamic-iface] 同 UpdatePolicy：SyncedEnforcer 不触发 DistributedEnforcer 路径（enforcer_distributed.go:174 的无守卫断言不会执行），且 *storeAdapter 缺 UpdateFilteredPolicies ⇒ 当前不可达；方法体只返回 authorization policy writes use AuthorizationStore；保留待裁决"
    review_by: "2026-12-31"
