apiVersion: v1
kind: ConfigMap
metadata:
  name: microservice-config
  labels:
    app.kubernetes.io/part-of: release-manager
data:
  config.yaml: |
    server:
      grpc_addr: ":8443"
      http_addr: ":8080"
      read_timeout: 30s
      write_timeout: 30s
      shutdown_timeout: 15s

    log:
      level: info
      format: json
      output: stdout

    tls:
      ca_file: /etc/release-manager/tls/ca.crt
      cert_file: /etc/release-manager/tls/tls.crt
      key_file: /etc/release-manager/tls/tls.key
      require_client_cert: true

    harbor:
      url: "https://harbor.example.com"
      insecure_skip_verify: false
      timeout: 60s

    store:
      type: sqlite
      dsn: /data/release-manager.db

    dingtalk:
      webhook_url: ""
      secret: ""
      enabled: false

    audit:
      enabled: false
      retention_days: 0
      buffer_size: 1000
