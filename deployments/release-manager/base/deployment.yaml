apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-manager
  labels:
    app.kubernetes.io/name: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: release-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-manager
    spec:
      containers:
      - name: notification
        image: release-manager:latest
        imagePullPolicy: IfNotPresent
        args:
          - "--config=/etc/release-manager/config.yaml"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/release-manager/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: release-manager-config
      - name: data
        emptyDir: {}
