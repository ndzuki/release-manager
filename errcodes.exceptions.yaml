version: "1"
# Accepted unemitted error codes for `make check-error-codes` (TASK-125).
#
# Every entry needs a reason and an expires_at; an expired entry stops excepting,
# so the code is checked again and the gate fails until it is fixed or the
# exception is renewed. Codes listed here are asserted by an AC but have no
# emitter, which means a client cannot branch on them.
#
# The list is deliberately tied to the 2026-09-18 audit
# (Notes/Audit-2026-09-18/05-error-code-emittability.md): each entry is a known
# gap with an owning requirement, not a permanent allowance.
exceptions:
  - owner: "release-manager"
    code: "non_bundle_image"
    reason: "REQ-056: the backend half of the non-bundle-image rejection is not wired; the frontend maps it but internal/ has no such code. Tracked as REQ-056 partial (audit bucket A/B)."
    expires_at: "2026-12-31"




  - owner: "release-manager"
    code: "emergency_feature_disabled"
    reason: "REQ-058: server-side annotation validation is missing; the codes exist only in the web client. Tracked as REQ-058 partial (audit bucket C)."
    expires_at: "2026-12-31"


  - owner: "release-manager"
    code: "target_changed"
    reason: "REQ-058 AC-058-18: the server never returns this code, and as of task-14 the web client no longer maps it either (the display key was deleted from web/src/features/emergency/errors.ts; nothing emits it). The drift assertion is explicitly deferred (2026-09-28 scope-change) and the literal stays on the AC line so this exception keeps being tracked. Emitting it needs an emergency confirmation-token contract that does not exist (emergency.go:500-503 validates operation_version shape only; ListEmergencyTargets is read-only and mints no token) plus the target observation capability (D-R / TASK-154 / TASK-168). Tracked as REQ-058 partial (audit bucket C)."
    expires_at: "2026-12-31"

  - owner: "release-manager"
    code: "job_not_found"
    reason: "REQ-060 is not delivered: the notification job service never existed (audit bucket A, first item). The code is asserted by an AC on a feature that was never implemented."
    expires_at: "2026-12-31"

  - owner: "release-manager"
    code: "retry_not_allowed"
    reason: "REQ-060 is not delivered: the notification job service never existed (audit bucket A, first item)."
    expires_at: "2026-12-31"

  - owner: "release-manager"
    code: "invalid_stage_selection"
    reason: "REQ-066: the staged E2E runner validates --stages but does not emit this stable code. Tracked as REQ-066 partial (audit bucket D)."
    expires_at: "2026-12-31"

  - owner: "release-manager"
    code: "secret_output_forbidden"
    reason: "REQ-046 AC-046-07's second half is explicitly deferred (scope-change 2026-09-28, TASK-162): the persistence boundary cannot observe Secret data because RenderResult carries no manifest field and raw manifests are consumed by the cluster stage without ever being persisted, so the guard is structurally unreachable; front-loading it into the render path would violate AC-046-02 (rendering a Secret must succeed and leave only digest/summary). Before 2026-10-08 this code was outside the gate entirely because REQ-046 listed its error codes as bullets and AC-046-07 named it in plain text; the REQ is now table-shaped (TASK-260), so the entry is load-bearing. Revisit at expiry."
    expires_at: "2027-03-31"
