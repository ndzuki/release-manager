name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run-e2e:
        description: Run the E2E environment gate
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# New pushes cancel the in-flight run for the same branch/PR: only the latest
# commit's checks matter.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

#
# Runner selection fallback (private-repo Actions billing block):
#   jobs run on `${{ vars.RUNS_ON || 'ubuntu-latest' }}`.
#   GitHub-hosted minutes for private repos are limited (2000/month);
#   when jobs start failing instantly with "recent account payments have
#   failed or your spending limit needs to be increased", switch to the
#   local self-hosted runner (arch-dev-1, systemd user service
#   actions-runner-release-manager):
#     gh variable set RUNS_ON self-hosted --repo ndzuki/release-manager
#   and back when billing is restored:
#     gh variable delete RUNS_ON --repo ndzuki/release-manager
#
jobs:
  sdk-check:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      - name: Run SDK-only static gate
        run: go run ./cmd/sdkcheck/ -exceptions sdkcheck.exceptions.yaml ./...

  license-check:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      # The checker classifies the license text of every module in the build
      # closure straight out of the module cache and reads the license field of
      # the frontend lockfile, so it needs jq (preinstalled on hosted runners)
      # and no additional scanner. It also fails when NOTICE no longer matches
      # the notices those modules ship, so a dependency bump cannot silently
      # leave the release artifact stale.
      - name: Check dependency licenses
        run: make check-licenses

  install-sdk:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0

      - name: Run Helm Install SDK integration gate
        run: make test-install-sdk

  upgrade-sdk:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0

      - name: Run Helm Upgrade SDK integration gate
        run: make test-upgrade-sdk

  operator-image-sdk-only:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      - name: Run operator image SDK-only gate
        run: make test-operator-image-sdk-only

  test:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --new-from-rev needs the base commit

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      # v1.50.0 is the latest upstream release, so the Node 20 deprecation warning
      # this action triggers on Node 24 runners cannot be fixed by upgrading it
      # (verified 2026-09-17). Decision (TASK-109): keep it. The successor
      # bufbuild/buf-action v1.5.0 is a higher-level action (its inputs are
      # input/paths/lint/format/breaking/push/archive — there is no setup-only
      # mode), so adopting it means redesigning the proto jobs, not fixing a
      # runtime; the warning is informational and the runner already forces Node
      # 24. Revisit only if GitHub turns it into a hard failure, and never by
      # setting ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION.
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.71.0"
          # Authenticate API calls to avoid GitHub API rate limits on
          # unauthenticated buf release lookups.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto
        run: make proto

      # Cache the whole Go module cache (root go.sum + analyzer fixture
      # go.sums). analysistest compiles its testdata fixtures in module mode
      # with GOPROXY=off (x/tools go/analysis/analysistest), so every fixture
      # dependency must already be in the module cache; prefetching them here
      # also makes the cache self-contained. The key covers both sums so a
      # fixture change invalidates exactly the right entries.
      #
      # Two gotchas handled here:
      #  1. Go module cache files are read-only (0444); restoring over a
      #     pre-existing module cache fails with "Cannot open: File exists".
      #     Wipe the target first so tar restores into a clean tree.
      #  2. This job is the single cache writer: the parallel test-sqlite and
      #     test-sdkcheck jobs restore with actions/cache/restore, so
      #     concurrent saves never race on the same key.
      - name: Prepare module cache for restore
        # Skip on self-hosted: ~/go/pkg/mod is a shared persistent dir there
        # (wiping it would nuke every local Go project's cache).
        if: vars.RUNS_ON != 'self-hosted'
        run: |
          # Go module cache files are read-only (0444) and directories 0555,
          # so rm fails without write permission on parent dirs. chmod first.
          chmod -R u+w ~/go/pkg/mod 2>/dev/null || true
          rm -rf ~/go/pkg/mod

      - name: Cache Go modules
        # Skip on self-hosted: module cache is already shared between jobs.
        if: vars.RUNS_ON != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum', 'internal/quality/sdkcheck/testdata/**/go.mod', 'internal/quality/sdkcheck/testdata/**/go.sum') }}
          restore-keys: go-mod-

      - name: Prefetch analyzer fixture modules
        run: |
          for d in internal/quality/sdkcheck/testdata/*/; do
            go mod download -C "$d"
          done

      - name: Run tests (core suites)
        run: |
          mapfile -t pkgs < <(go list ./... | grep -vE '/(internal/store/sqlite|internal/quality/sdkcheck)(/|$)')
          go test -race -coverprofile=coverage.out "${pkgs[@]}"

      - name: Coverage report
        run: go tool cover -func=coverage.out

      # Lint only the code this PR/commit introduces instead of the whole
      # repository: the check stays fast, and an issue that lands on main cannot
      # block an unrelated pull request. The whole-tree run is clean since
      # TASK-110 (see `make lint`), so widening this gate is a separate decision
      # rather than a prerequisite.
      # A workflow_dispatch run carries neither a pull-request base nor a push
      # `before`, so the fallback chain below used to resolve to the empty
      # string and golangci-lint compared against nothing: every manual
      # dispatch linted the entire tree and failed on the very pre-existing
      # debt this check exists to skip, even when the commit under test was
      # already green on its pull request.
      - name: Run lint (changed code only)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before || format('origin/{0}', github.event.repository.default_branch) }}

  # PostgreSQL is the production engine (ADR-015), but every integration test in
  # the store is tagged `integration` and skips unless POSTGRES_TEST_DSN is set —
  # so CI never exercised the PostgreSQL SQL at all. This job runs a real
  # PostgreSQL 16 and the DB-backed suites against it.
  #
  # ./internal/migration/... is included since TASK-108: its end-to-end
  # SQLite->PostgreSQL import test used to expose a backlog of parity gaps (a
  # missing table, unregistered boolean/array/JSONB columns, pre-seeded singletons
  # and stale backfills), all of which are fixed.
  test-postgres-integration:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.71.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto
        run: make proto

      # docker run rather than a services: block so the job also works on the
      # self-hosted runner (service containers require a Docker-capable runner
      # configuration we do not control). Port 55432 avoids a host PostgreSQL.
      - name: Start PostgreSQL
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=release_manager \
            -p 55432:5432 postgres:16-alpine
          for _ in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready" >&2
          docker logs ci-postgres >&2 || true
          exit 1

      - name: Run PostgreSQL integration tests
        env:
          POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:55432/release_manager?sslmode=disable
        run: | # TASK-168: ./internal/orchestrator/... added so its integration-tagged emergency candidate-list parity gate (TestListCandidateArtifactsEngineParity) runs; its PostgreSQL half never executed while the package was outside this list.
          go test -tags integration -count=1 ./internal/store/postgres/... ./internal/postgres/... ./internal/migration/... ./internal/orchestrator/...

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f ci-postgres || true

  test-sqlite:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.71.0"
          # Authenticate API calls to avoid GitHub API rate limits on
          # unauthenticated buf release lookups.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto
        run: make proto

      # Wipe first: restoring over read-only module files fails (see test job).
      - name: Prepare module cache for restore
        # Skip on self-hosted: ~/go/pkg/mod is a shared persistent dir there.
        if: vars.RUNS_ON != 'self-hosted'
        run: |
          chmod -R u+w ~/go/pkg/mod 2>/dev/null || true
          rm -rf ~/go/pkg/mod

      # Restore-only: the test job is the single cache writer.
      # Skip on self-hosted: module cache is already shared between jobs.
      - name: Restore Go module cache
        if: vars.RUNS_ON != 'self-hosted'
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum', 'internal/quality/sdkcheck/testdata/**/go.mod', 'internal/quality/sdkcheck/testdata/**/go.sum') }}
          restore-keys: go-mod-

      - name: Run sqlite store tests
        run: go test -race -coverprofile=coverage.out ./internal/store/sqlite/...

  vulncheck:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      # REQ-008 §8-8: dependency vulnerabilities must fail the pipeline, not be
      # discovered after a release.
      - name: Run govulncheck
        run: make vulncheck

  test-sdkcheck:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      # Wipe first: restoring over read-only module files fails (see test job).
      - name: Prepare module cache for restore
        # Skip on self-hosted: ~/go/pkg/mod is a shared persistent dir there.
        if: vars.RUNS_ON != 'self-hosted'
        run: |
          chmod -R u+w ~/go/pkg/mod 2>/dev/null || true
          rm -rf ~/go/pkg/mod

      # Restore-only: the test job is the single cache writer.
      # Skip on self-hosted: module cache is already shared between jobs.
      - name: Restore Go module cache
        if: vars.RUNS_ON != 'self-hosted'
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum', 'internal/quality/sdkcheck/testdata/**/go.mod', 'internal/quality/sdkcheck/testdata/**/go.sum') }}
          restore-keys: go-mod-

      - name: Prefetch analyzer fixture modules
        run: |
          for d in internal/quality/sdkcheck/testdata/*/; do
            go mod download -C "$d"
          done

      - name: Run sdkcheck tests
        run: go test -race -coverprofile=coverage.out ./internal/quality/sdkcheck/...

  rollout-watch:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      - name: Install kind v0.32.0
        env:
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
        run: |
          curl -fsSLo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum --check
          if [ "${{ vars.RUNS_ON }}" = "self-hosted" ]; then
            # No sudo on the local runner: install into the user's PATH.
            mkdir -p "$HOME/.local/bin"
            install -m 0755 /tmp/kind "$HOME/.local/bin/kind"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          fi
          kind version

      - name: Run rollout watch integration gate
        # Docker >= 29 saves multi-platform manifests sparsely, which breaks
        # `kind load docker-image` (ctr import: content digest not found).
        # On the self-hosted runner use the single-platform amd64 manifest
        # digest instead of the multi-platform manifest list digest.
        env:
          WORKLOAD_IMAGE: ${{ vars.RUNS_ON == 'self-hosted' && 'busybox:1.36@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f' || 'busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662' }}
        run: make test-rollout-watch

  # AC-066-17 prerequisite smoke. The target preserves data/smoke-result.json
  # under e2e-results/ and always purges the dev environment, so the gate rests
  # on real Upgrade/Rollback/Emergency/devseed evidence rather than "local tests
  # pass".
  #
  # Pull requests intentionally do NOT run it -- the same pattern REQ-066 决策 ⑧
  # already applies to the `e2e` job below. It builds a real k3d environment, so
  # it is a 15-55 minute long tail: on 2026-09-22 four approved changes sat
  # behind it while it failed for environment reasons (one 55-minute run
  # cancelled with no root cause, and one seed that raced a terminating pod and
  # died with `unavailable: unexpected EOF`). The coverage is kept -- it still
  # runs on push main and on demand -- and the environment-specific root cause is
  # fixed in internal/devfixture (convergence retry budget).
  e2e-prerequisite:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: e2e-prerequisite-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      # dev-up requires k3d >= 5.8 and kustomize on PATH, but only detects them
      # (deploy/dev/lib/host.sh) — hosted runners ship neither, and CI sets
      # GOTOOLCHAIN=local, so the pinned Go above must come from setup-go.
      - name: Install dev environment tools
        run: |
          set -euo pipefail
          # k3d must come from a release binary rather than `go install`: the
          # module cannot embed its own version without -ldflags, so the built
          # binary reports "v5-dev" and dev-up's version guard then misreads the
          # k3s line as the k3d version and rejects it as too old.
          base="https://github.com/k3d-io/k3d/releases/download/v5.8.3"
          curl -fsSL -o /tmp/k3d-linux-amd64 "${base}/k3d-linux-amd64"
          curl -fsSL -o /tmp/k3d-checksums.txt "${base}/checksums.txt"
          (cd /tmp && grep -E ' _dist/k3d-linux-amd64$' k3d-checksums.txt | sed 's#_dist/##' | sha256sum -c -)
          mkdir -p "$(go env GOPATH)/bin"
          install -m 0755 /tmp/k3d-linux-amd64 "$(go env GOPATH)/bin/k3d"
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          k3d version
          kustomize version

      - name: Run AC-066-17 prerequisite smoke
        run: make e2e-prerequisite-ci

      - name: Upload smoke result and operator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-prerequisite-diagnostics
          path: e2e-results/
          if-no-files-found: ignore

  # TASK-066 formal E2E gate. Pull requests intentionally do not run this
  # privileged integration job; it runs on push main (REQ-066 决策 ⑧) and on
  # demand.
  #
  # D-034 narrowed this to dispatch-only while the repository secrets it needs
  # were unconfigured. That deviation is now lifted: the secrets are set and
  # run 34814028668 completed the whole gate — environment build, seed,
  # `e2e-all` and the `dev-purge` fallback — in 13m44s, inside the 30-minute
  # cap, on a hosted runner.
  e2e:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run-e2e)
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: e2e-${{ github.repository }}
      cancel-in-progress: false
    env:
      DEV_PROFILE: ci
      E2E_RUN_ID: ${{ github.run_id }}
      E2E_ENVIRONMENT: ci
      E2E_RUNNER_PASSWORD: ${{ secrets.E2E_RUNNER_PASSWORD }}
      DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
      DEV_DEPLOYER_PASSWORD: ${{ secrets.DEV_DEPLOYER_PASSWORD }}
      DEV_READER_PASSWORD: ${{ secrets.DEV_READER_PASSWORD }}
      # REQ-065 AC-065-01: the management-plane JWT is EdDSA (Ed25519), so the
      # ci Secret carries a PKCS#8 PEM private key (the public half is derived).
      DEV_JWT_PRIVATE_KEY: ${{ secrets.DEV_JWT_PRIVATE_KEY }}
      DEV_WEBHOOK_SERVICE_TOKEN: ${{ secrets.DEV_WEBHOOK_SERVICE_TOKEN }}
      # TASK-102 (REQ-011 §562): the CI ingress key and the Harbor ingress key
      # are independent credentials; the fixture presents the CI key and the
      # Harbor path forwards its own service token.
      DEV_CI_API_KEY: ${{ secrets.DEV_CI_API_KEY }}
      DEV_HARBOR_SERVICE_TOKEN: ${{ secrets.DEV_HARBOR_SERVICE_TOKEN }}
      # TASK-096 made the notifier surface authenticate with a rotatable service
      # token pair and added notifier-service-token to dev.sh's SERVICE_TOKEN_FILES;
      # the ci profile refuses to generate it, so dev-up fails (service_unhealthy)
      # unless this env is present. The previous-token slot stays unset here: the
      # notifier tolerates an empty pair entry, and rotation is exercised by its
      # own tests rather than by the CI development environment.
      DEV_NOTIFIER_SERVICE_TOKEN: ${{ secrets.DEV_NOTIFIER_SERVICE_TOKEN }}
      DEV_M_TLS_CA_KEY: ${{ secrets.DEV_M_TLS_CA_KEY }}
      DEV_M_TLS_CA_CERT: ${{ secrets.DEV_M_TLS_CA_CERT }}
      DEV_TRUST_ROOT_PRIVATE_KEY: ${{ secrets.DEV_TRUST_ROOT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: ${{ vars.RUNS_ON != 'self-hosted' }}

      - name: Install dev environment tools
        run: |
          set -euo pipefail
          # k3d must come from a release binary rather than `go install`: the
          # module cannot embed its own version without -ldflags, so the built
          # binary reports "v5-dev" and dev-up's version guard then misreads the
          # k3s line as the k3d version and rejects it as too old.
          base="https://github.com/k3d-io/k3d/releases/download/v5.8.3"
          curl -fsSL -o /tmp/k3d-linux-amd64 "${base}/k3d-linux-amd64"
          curl -fsSL -o /tmp/k3d-checksums.txt "${base}/checksums.txt"
          (cd /tmp && grep -E ' _dist/k3d-linux-amd64$' k3d-checksums.txt | sed 's#_dist/##' | sha256sum -c -)
          mkdir -p "$(go env GOPATH)/bin"
          install -m 0755 /tmp/k3d-linux-amd64 "$(go env GOPATH)/bin/k3d"
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          k3d version
          kustomize version

      - name: Start CI development environment
        run: make dev-up

      - name: Seed CI development fixture
        run: make dev-seed

      - name: Run all E2E stages
        env:
          E2E_RUNNER_PASSWORD: ${{ secrets.E2E_RUNNER_PASSWORD }}
        run: make e2e-all

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ github.run_id }}
          path: e2e-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Purge CI development environment
        if: always()
        run: make dev-purge CONFIRM=1

  # ---------------------------------------------------------------------------
  # Static gates. These two jobs are appended at the end on purpose: documents in
  # this repository cite test.yml by line number, so inserting a job in the middle
  # would invalidate dozens of citations unrelated to this change.
  # ---------------------------------------------------------------------------

  docs-check:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Documents assert facts: every `make <target>`, repository path, relative
      # link and `file:line` citation written into docs/** or a README has to hold
      # against the tree it sits in. Without this the documentation surface rots
      # silently on the next rename or moved line, and a reader cannot tell a
      # retired path from a current one. Only bash, grep and git are needed, so a
      # documentation-only pull request fails in seconds rather than after a
      # toolchain setup.
      - name: Check documented facts
        run: make check-docs

  proto-check:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.71.0"
          # Authenticate the release lookup; unauthenticated calls hit GitHub API
          # rate limits. Same parameters as the jobs that already generate code.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # buf.yaml has declared lint rules since the contract existed, but nothing
      # ever executed `buf lint`, so naming failures accumulated invisibly. Note
      # that a clean run here does not mean the contract is documented: the
      # COMMENT_* family is deliberately off (see buf.yaml).
      - name: Lint the contract
        run: make lint-proto

      # The jobs above run `make proto` and then test whatever they got, which
      # quietly tolerates a committed api/gen that no longer matches api/proto -
      # the regenerated code is what gets tested, and the stale committed one is
      # never noticed. Here the regeneration must reproduce what is committed.
      # `git status` rather than `git diff`, because a proto file that gained a
      # brand-new generated sibling would otherwise show up as untracked noise.
      - name: Require committed generated code to be current
        run: |
          make proto
          out=$(git status --porcelain -- api/gen web/src/gen)
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            echo "::error::generated code is stale; run 'make proto' and commit the result"
            exit 1
          fi
