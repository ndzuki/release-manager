apiVersion: v1
kind: Secret
metadata:
  name: release-manager-dev-credentials
  namespace: release-manager-dev
type: Opaque
stringData:
  JWT_SIGNING_KEY: dev-only-signing-key
  POSTGRES_USER: release_manager
  POSTGRES_PASSWORD: dev-release-manager
  POSTGRES_DB: release_manager
  DATABASE_DRIVER: postgres
  DATABASE_DSN: postgres://release_manager:dev-release-manager@postgres:5432/release_manager?sslmode=disable
