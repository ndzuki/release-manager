syntax = "proto3";

package api.v1;

import "common/v1/domain.proto";
import "common/v1/types.proto";

option go_package = "github.com/ndzuki/release-manager/api/gen/api/v1;apiv1";

// ListCustomersRequest is a paginated request for customers.
message ListCustomersRequest {
  common.v1.Pagination pagination = 1;
}

// ListCustomersResponse returns a page of customers.
message ListCustomersResponse {
  repeated common.v1.Customer customers = 1;
  common.v1.PaginationResponse pagination = 2;
}

// GetReleaseDefinitionRequest fetches a single release definition.
message GetReleaseDefinitionRequest {
  string id = 1;
}

// GetReleaseDefinitionResponse returns the release definition.
message GetReleaseDefinitionResponse {
  common.v1.ReleaseDefinition definition = 1;
}

// APIService exposes HTTP-friendly read operations across domains.
service APIService {
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  rpc GetReleaseDefinition(GetReleaseDefinitionRequest) returns (GetReleaseDefinitionResponse);
}
