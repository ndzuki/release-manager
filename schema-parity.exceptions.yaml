version: "1"
# Accepted dual-engine schema drift for `make check-schema-parity` (D-ε/ε-1).
#
# Every entry needs an owner, a reason and an expires_at; an expired entry stops
# excepting, so the gate fails until the drift is fixed or the exception is
# renewed with a fresh justification. This mirrors errcodes.exceptions.yaml: an
# allowance is a dated, owned decision, never a permanent one.
#
# The 2026-09-27 run classified the eight findings as follows:
#   - two are INTENTIONAL -- the PostgreSQL migration moved the columns;
#   - two are residue from the legacy baseline;
#   - four were REAL engine divergences (release_bundles signature_digest/sbom_digest/
#     provenance_digest and candidate_artifacts.last_seen_at, which only PostgreSQL
#     declared and stored). TASK-163 resolved them by aligning SQLite, so those four
#     entries were REMOVED rather than renewed: the file now carries the four
#     intentional/residue findings only.
exceptions:
  # ── Intentional relocation (PostgreSQL migration 000007) ─────────────
  - owner: "release-manager"
    table: "candidate_artifacts"
    column: "ref"
    reason: "REQ-014: migrations/000007_bundle_services.up.sql rebuilt candidate_artifacts and moved this column to candidate_artifact_locations; internal/migration/copy.go registers it as dropped. SQLite keeps the legacy shape."
    expires_at: "2027-03-31"
  - owner: "release-manager"
    table: "candidate_artifacts"
    column: "bundle_id"
    reason: "REQ-014: same 000007 relocation as candidate_artifacts.ref."
    expires_at: "2027-03-31"

  # ── Legacy baseline residue ──────────────────────────────────────────
  - owner: "release-manager"
    table: "bundle_candidate_artifacts"
    column: "orphaned_at"
    reason: "Legacy baseline residue: declared by SQLite only. Tracked with TASK-163 so it is either aligned or removed rather than forgotten."
    expires_at: "2027-03-31"
  - owner: "release-manager"
    table: "enrollment_tokens"
    column: "used"
    reason: "Legacy baseline residue: PostgreSQL carries a boolean used, SQLite tracks used_at instead."
    expires_at: "2027-03-31"

  # ── Real nullability divergence found by TASK-213's new comparison ────
  - owner: "release-manager"
    table: "candidate_artifacts"
    column: "last_seen_at"
    reason: "TASK-213 (2026-09-30): SQLite adds the column with `ALTER TABLE candidate_artifacts ADD COLUMN last_seen_at TEXT` (nullable, internal/store/sqlite/db.go) while PostgreSQL declares `last_seen_at TIMESTAMPTZ NOT NULL` (migrations/000007_bundle_services.up.sql). TASK-163's alignment backfilled the data (`UPDATE ... SET last_seen_at = created_at WHERE last_seen_at IS NULL`) but never made the SQLite column NOT NULL, so SQLite still accepts a row PostgreSQL rejects -- a real cross-engine divergence the storage-class comparison could not see. Fixing it changes production DDL, which is outside TASK-213's scope, and note the two options are not symmetric: an existing SQLite column cannot be ALTERed to NOT NULL in place, so that side needs a TABLE REBUILD (the 000007 pattern: create the new table with the constraint, copy, rename) -- `ADD COLUMN ... NOT NULL DEFAULT` only applies to a NEW column, i.e. to freshly created databases. The alternative is relaxing PostgreSQL to nullable. Runtime risk today is LOW: the write path always sets the column (sqlite/candidate_artifacts.go lists it in the INSERT), the bootstrap backfills historical NULLs, and the cutover synthesizes a default (internal/migration/copy.go targetColumnDefaults), so this is a structural divergence rather than an active one; the entry exists so it cannot be forgotten (it fails the gate when it expires)."
    expires_at: "2027-03-31"
