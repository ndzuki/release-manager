apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: release-manager
spec:
  # Replaces the dev ../redis Deployment (deleted by a patch in
  # kustomization.yaml); the Redis Service is reused from ../redis and its
  # selector matches this StatefulSet's pod labels.
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: release-manager
    spec:
      # redis:7-alpine runs as uid/gid 999.
      securityContext:
        fsGroup: 999
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # AOF is the durability mechanism for the auth session cache and
          # blacklist: everysec bounds loss to ~1s while keeping the write path
          # off the critical path. dir=/data puts both the AOF and the RDB
          # snapshot on the PVC.
          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        # Replaced from production-settings.storageClassName; kept literal here
        # so the manifest is valid when rendered standalone.
        storageClassName: local-path
