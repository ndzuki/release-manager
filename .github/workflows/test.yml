name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run SDK-only static gate
        run: go run ./cmd/sdkcheck/ -exceptions sdkcheck.exceptions.yaml ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.71.0"

      - name: Generate proto
        run: make proto

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
