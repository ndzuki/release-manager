{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "release-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "release-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow gRPC from the notification service
    - from:
        {{- toYaml .Values.networkPolicy.ingressSources | nindent 8 }}
      ports:
        - protocol: TCP
          port: grpc
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow access to Kubernetes API server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Allow access to Harbor registry
    - to:
        {{- toYaml .Values.networkPolicy.harborCIDRs | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
