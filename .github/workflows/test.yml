name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# New pushes cancel the in-flight run for the same branch/PR: only the latest
# commit's checks matter.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

#
# Runner selection fallback (private-repo Actions billing block):
#   jobs run on `${{ vars.RUNS_ON || 'ubuntu-latest' }}`.
#   GitHub-hosted minutes for private repos are limited (2000/month);
#   when jobs start failing instantly with "recent account payments have
#   failed or your spending limit needs to be increased", switch to the
#   local self-hosted runner (arch-dev-1, systemd user service
#   actions-runner-release-manager):
#     gh variable set RUNS_ON self-hosted --repo ndzuki/release-manager
#   and back when billing is restored:
#     gh variable delete RUNS_ON --repo ndzuki/release-manager
#
jobs:
  sdk-check:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Run SDK-only static gate
        run: go run ./cmd/sdkcheck/ -exceptions sdkcheck.exceptions.yaml ./...

  install-sdk:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0

      - name: Run Helm Install SDK integration gate
        run: make test-install-sdk

  operator-image-sdk-only:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Run operator image SDK-only gate
        run: make test-operator-image-sdk-only

  test:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --new-from-rev needs the base commit

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: "1.71.0"

      - name: Generate proto
        run: make proto

      # Cache the whole Go module cache (root go.sum + analyzer fixture
      # go.sums). analysistest compiles its testdata fixtures in module mode
      # with GOPROXY=off (x/tools go/analysis/analysistest), so every fixture
      # dependency must already be in the module cache; prefetching them here
      # also makes the cache self-contained. The key covers both sums so a
      # fixture change invalidates exactly the right entries.
      #
      # Two gotchas handled here:
      #  1. Go module cache files are read-only (0444); restoring over a
      #     pre-existing module cache fails with "Cannot open: File exists".
      #     Wipe the target first so tar restores into a clean tree.
      #  2. This job is the single cache writer: the parallel test-sqlite and
      #     test-sdkcheck jobs restore with actions/cache/restore, so
      #     concurrent saves never race on the same key.
      - name: Prepare module cache for restore
        run: |
          # Go module cache files are read-only (0444) and directories 0555,
          # so rm fails without write permission on parent dirs. chmod first.
          chmod -R u+w ~/go/pkg/mod 2>/dev/null || true
          rm -rf ~/go/pkg/mod

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum', 'internal/quality/sdkcheck/testdata/**/go.mod', 'internal/quality/sdkcheck/testdata/**/go.sum') }}
          restore-keys: go-mod-

      - name: Prefetch analyzer fixture modules
        run: |
          for d in internal/quality/sdkcheck/testdata/*/; do
            go mod download -C "$d"
          done

      - name: Run tests (core suites)
        run: |
          mapfile -t pkgs < <(go list ./... | grep -vE '/(internal/store/sqlite|internal/quality/sdkcheck)(/|$)')
          go test -race -coverprofile=coverage.out "${pkgs[@]}"

      - name: Coverage report
        run: go tool cover -func=coverage.out

      # Lint only the code this PR/commit introduces instead of the whole
      # repository: pre-existing issues on main (gocyclo/gosec debt from
      # other tasks) must not block new work, and the check is much faster.
      - name: Run lint (changed code only)
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before }}

  test-sqlite:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: "1.71.0"

      - name: Generate proto
        run: make proto

      # Wipe first: restoring over read-only module files fails (see test job).
      - name: Prepare module cache for restore
        run: |
          chmod -R u+w ~/go/pkg/mod 2>/dev/null || true
          rm -rf ~/go/pkg/mod

      # Restore-only: the test job is the single cache writer.
      - name: Restore Go module cache
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum', 'internal/quality/sdkcheck/testdata/**/go.mod', 'internal/quality/sdkcheck/testdata/**/go.sum') }}
          restore-keys: go-mod-

      - name: Run sqlite store tests
        run: go test -race -coverprofile=coverage.out ./internal/store/sqlite/...

  test-sdkcheck:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # Wipe first: restoring over read-only module files fails (see test job).
      - name: Prepare module cache for restore
        run: |
          chmod -R u+w ~/go/pkg/mod 2>/dev/null || true
          rm -rf ~/go/pkg/mod

      # Restore-only: the test job is the single cache writer.
      - name: Restore Go module cache
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum', 'internal/quality/sdkcheck/testdata/**/go.mod', 'internal/quality/sdkcheck/testdata/**/go.sum') }}
          restore-keys: go-mod-

      - name: Prefetch analyzer fixture modules
        run: |
          for d in internal/quality/sdkcheck/testdata/*/; do
            go mod download -C "$d"
          done

      - name: Run sdkcheck tests
        run: go test -race -coverprofile=coverage.out ./internal/quality/sdkcheck/...

  rollout-watch:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install kind v0.32.0
        env:
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
        run: |
          curl -fsSLo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum --check
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Run rollout watch integration gate
        run: make test-rollout-watch
