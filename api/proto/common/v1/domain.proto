// File: common/v1/domain.proto
// Package common.v1 canonical domain records: the release bundle and its
// artifacts, customers, clusters, release definitions and immutable values
// revisions that every service exchanges.
// No service is declared here. release-orchestrator owns writes to these
// records (management plane, JWT plus organization-scoped authorization); the
// browser console and the customer-cluster operator agent read them through
// orchestrator.v1 and operator.v1. Field semantics stated here are binding for
// all of those surfaces.
syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ndzuki/release-manager/api/gen/common/v1;commonv1";

// BundleStatus is the lifecycle state of a ReleaseBundle.
enum BundleStatus {
  BUNDLE_STATUS_UNSPECIFIED = 0;
  BUNDLE_STATUS_RECEIVED = 1;
  BUNDLE_STATUS_VALIDATED = 2;
  BUNDLE_STATUS_REJECTED = 3;
  BUNDLE_STATUS_ARCHIVED = 4;
}

// ReleaseDigest is an immutable content-addressable identifier for a ReleaseBundle.
message ReleaseDigest {
  string algorithm = 1;
  string value = 2;
}

// ImageValueKind describes which Helm value a binding replaces.
enum ImageValueKind {
  IMAGE_VALUE_KIND_UNSPECIFIED = 0;
  IMAGE_VALUE_KIND_FULL_REFERENCE = 1;
  IMAGE_VALUE_KIND_REPOSITORY = 2;
  IMAGE_VALUE_KIND_TAG = 3;
  IMAGE_VALUE_KIND_DIGEST = 4;
}

// ArtifactType classifies a globally indexed candidate artifact.
enum ArtifactType {
  ARTIFACT_TYPE_UNSPECIFIED = 0;
  ARTIFACT_TYPE_IMAGE = 1;
  ARTIFACT_TYPE_CHART = 2;
  ARTIFACT_TYPE_SBOM = 3;
  ARTIFACT_TYPE_PROVENANCE = 4;
  ARTIFACT_TYPE_SIGNATURE = 5;
}

// BundleImage maps a container image to its Helm values path.
message BundleImage {
  string ref = 1;
  // Digest-pinned identity of the image. A tag alone is mutable, so the digest
  // is authoritative for verification, rollback and inventory comparison.
  string digest = 2;
  // Path of the values file inside the bundle that pins this image; it must
  // resolve inside the bundle, which is what ties an image to a values input.
  string values_path = 3;
  // How the image reference is expressed: a pinned digest is authoritative,
  // a tag is mutable and therefore only accepted when the policy allows it.
  ImageValueKind value_kind = 4;
}

// ArtifactReference identifies immutable evidence stored outside the service.
message ArtifactReference {
  // Pullable reference; a digest-pinned value is the authoritative identity and
  // overrides the registry and repository fields, which exist for display.
  string ref = 1;
  string digest = 2;
}

// CandidateArtifact describes an additional artifact observed with a bundle.
message CandidateArtifact {
  ArtifactType artifact_type = 1;
  string ref = 2;
  // Immutable identity of the candidate artifact; the (bundle, digest) pair is
  // the natural key used when events are replayed.
  string digest = 3;
}

// EventResource is one artifact resource carried by an external event.
message EventResource {
  string digest = 1;
  string ref = 2;
  string tag = 3;
}

// ReleaseBundle is the atomic unit of a release — immutable once published.
message ReleaseBundle {
  string id = 1;
  string name = 2;
  ReleaseDigest digest = 3;
  BundleStatus status = 4;
  string chart_ref = 5;
  string chart_version = 6;
  string chart_digest = 7;
  repeated BundleImage images = 8;
  string git_commit = 9;
  string pipeline_id = 10;
  string signature_ref = 11;
  string sbom_ref = 12;
  string provenance_ref = 13;
  google.protobuf.Timestamp created_at = 14;
  string signature_digest = 15;
  string sbom_digest = 16;
  string provenance_digest = 17;
}

// ReleaseDefinition decouples the install preflight cycle from artifact ingestion.
message ReleaseDefinition {
  string id = 1;
  string name = 2;
  string customer_id = 3;
  string cluster_id = 4;
  string namespace = 5;
  string release_name = 6;
  string chart_name = 7;
  string status = 8;
  int64 version = 9;
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  bool hpa_managed = 13;
  int32 max_emergency_replicas = 14;
  // JSON-encoded bytes, not a nested message: the allow-list of release
  // annotations a customer cluster may propagate. Decoding is the caller's job
  // and an undecodable value is a contract violation, not a transport error.
  bytes approved_annotation_keys = 15;
  // JSON-encoded bytes describing environment promotion rules, for the same
  // reason as approved_annotation_keys.
  bytes promotion_mappings = 16;
}

// ValuesStatus is the approval state of a values revision.
enum ValuesStatus {
  VALUES_STATUS_UNSPECIFIED = 0;
  VALUES_STATUS_DRAFT = 1;
  VALUES_STATUS_APPROVED = 2;
  VALUES_STATUS_REJECTED = 3;
  VALUES_STATUS_PENDING_APPROVAL = 4;
  VALUES_STATUS_SUPERSEDED = 5;
  VALUES_STATUS_DISCARDED = 6;
}

// ValuesRevision stores the desired configuration for a release target.
message ValuesRevision {
  string id = 1;
  string release_definition_id = 2;
  int64 version = 3;
  // Byte-exact YAML as persisted; the digest is computed over these bytes, so
  // reformatting on the client changes the revision identity.
  bytes canonical_document = 4;
  google.protobuf.Timestamp created_at = 5;
  ValuesStatus status = 6;
  string digest = 7;
  string parent_revision_id = 8;
  // References only. A revision that names a Secret the target cluster cannot
  // resolve fails at execution time rather than at creation time.
  repeated SecretRef secret_refs = 9;
  // Monotonically increased by the server on every state transition and used as
  // the compare-and-swap token by the review RPCs; a client must send back the
  // value it observed and retry after a fresh read when the update is rejected.
  int64 state_version = 10;
  string created_by_user_id = 11;
  google.protobuf.Timestamp submitted_at = 12;
  google.protobuf.Timestamp decided_at = 13;
  // Convergence bindings (REQ-079 D10): operation ids of the Convergence
  // Tasks locking this revision, and the locked values paths.
  repeated string convergence_task_ids = 14;
  // Values paths a promotion has frozen; a later revision that changes any of
  // them is rejected so approved inputs cannot drift.
  repeated string locked_paths = 15;
}

// SecretRef holds a reference to a secret, never the secret value itself.
message SecretRef {
  string path = 1;
  string name = 2;
  string key = 3;
}

// Customer represents a tenant in the release manager.
message Customer {
  string id = 1;
  string name = 2;
  string slug = 3;
  string status = 5;
  google.protobuf.Timestamp created_at = 4;
  // version is the optimistic-lock revision used for CAS updates (AC-051-02).
  int64 version = 6;
}

// CustomerEvent is one immutable customer lifecycle observation returned by
// ListCustomerEvents. It never carries Secret, token, or certificate content.
message CustomerEvent {
  string id = 1;
  string customer_id = 2;
  string event_type = 3;
  google.protobuf.Timestamp created_at = 4;
}

// CustomerDisabledEvent is emitted when a customer is disabled.
// Receivers (downstream services) use this to trigger cascading cleanup.
// The event MUST be idempotent — emitting it for an already-disabled
// customer is a no-op at the consumer side.
message CustomerDisabledEvent {
  string customer_id = 1;
  google.protobuf.Timestamp disabled_at = 2;
}

// ClusterStatus represents the lifecycle state of a cluster.
enum ClusterStatus {
  CLUSTER_STATUS_UNSPECIFIED = 0;
  CLUSTER_STATUS_ACTIVE = 1;
  CLUSTER_STATUS_DISABLED = 2;
}
// Cluster represents a target cluster within a customer.
message Cluster {
  string id = 1;
  string name = 2;
  string customer_id = 3;
  // Reference to where cluster credentials are held. Never a credential: no
  // endpoint in this contract carries client credentials, and none may be added
  // to the metadata fields.
  string kubeconfig_ref = 4;
  ClusterStatus status = 6;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 7;
  int64 version = 8;
  // Number of routing entries that bind this cluster to an operator agent; zero
  // means no work can reach it, which is why it appears on the read model.
  int32 route_count = 9;
}

// ActorContext identifies the initiating principal for audit and authorization.
message ActorContext {
  string user_id = 1;
  string organization = 2;
}

