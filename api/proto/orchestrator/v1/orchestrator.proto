// File: orchestrator/v1/orchestrator.proto
// Package orchestrator.v1 is the release control plane: bundle ingestion and
// artifact events, release definitions, customers and clusters, operator and
// enrollment records, artifact routing, values revisions and their approval
// flow, release operations with a watched timeline, inventory observation, the
// guard rails around the emergency entry point, and the retention-facing
// queries that support all of that.
// release-orchestrator serves BundleService and OrchestratorService on its
// management listener (dev port 8083) for the browser console, CI and
// administrative tooling. The customer-cluster operator agent reaches only one
// procedure, SyncInventory, and only over the mTLS agent-gateway listener (dev
// port 8084); everything else on this service is management-plane traffic.
// Management-plane calls carry a bearer access token or the console's access
// cookie. The shared interceptor requires that any organization_id in the
// request match the token, maps each procedure to a Casbin object and action
// (release, bundle, customer, binding, operator), and refuses any procedure it
// cannot map, so a new RPC needs a policy mapping before it can be called.
// Writes to release state are further gated by the caller's capability set and
// by an explicit authorization snapshot, and most are rejected while the
// orchestrator runs in maintenance mode.
// Every mutation is either keyed by the Idempotency-Key request header or by a
// natural key in the message; version fields are compare-and-swap tokens. Read
// surfaces are paginated with an opaque cursor and a page size clamped to
// [1, 100].
syntax = "proto3";

package orchestrator.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/domain.proto";
import "common/v1/trust.proto";
import "common/v1/types.proto";

option go_package = "github.com/ndzuki/release-manager/api/gen/orchestrator/v1;orchestratorv1";

// ── Release Bundle Ingestion and Query (REQ-011) ──────────────────

message SubmitBundleRequest {
  // Display name only; identity is the canonical digest, so the same content
  // submitted under a different name is still the same bundle.
  string name = 1;
  string chart_ref = 2;
  string chart_version = 3;
  // Must be in sha256 form. A chart reference without a digest is mutable and is
  // rejected.
  string chart_digest = 4;
  // Image-to-values bindings: between 1 and 100 entries, each pinned by digest
  // with a values path inside this bundle.
  repeated common.v1.BundleImage images = 5;
  string git_commit = 6;
  string pipeline_id = 7;
  common.v1.ArtifactReference signature = 8;
  common.v1.ArtifactReference sbom = 9;
  common.v1.ArtifactReference provenance = 10;
  // Optional candidate-artifact evidence, at most 500 entries.
  repeated common.v1.CandidateArtifact artifacts = 20;
}

message BundleImageBindingSummary {
  string ref = 1;
  string digest = 2;
  string values_path = 3;
  common.v1.ImageValueKind value_kind = 4;
}

message BundleSummary {
  string id = 1;
  string name = 2;
  common.v1.ReleaseDigest digest = 3;
  common.v1.BundleStatus status = 4;
  string chart_ref = 5;
  string chart_version = 6;
  string chart_digest = 7;
  repeated BundleImageBindingSummary images = 8;
  google.protobuf.Timestamp created_at = 9;
}

message SubmitBundleResponse {
  BundleSummary bundle = 1;
  // False when the submission resolved to an existing bundle, so callers must read
  // the bundle rather than assume this call made it.
  bool created = 2;
}

message RecordArtifactEventRequest {
  string source_id = 1;
  // Registry-assigned identifier; with source_id it is the natural deduplication
  // key, so a retry must reuse both unchanged.
  string event_id = 2;
  string event_type = 3;
  // RFC 3339 string, deliberately not a Timestamp: it is the registry's own
  // statement of when the event happened, kept verbatim for replay.
  string occurred_at = 4;
  string raw_payload = 5;
  // Hex sha256 of raw_payload without the algorithm prefix; the server recomputes
  // it and rejects a mismatch, which is what makes an accepted event reproducible.
  string payload_sha256 = 6;
  common.v1.ArtifactType artifact_type = 7;
  string repository = 8;
  repeated common.v1.EventResource resources = 9;
  map<string, string> request_metadata = 10;
}

message RecordArtifactEventResponse {
  string event_record_id = 1;
  // False for a redelivered event, in which case the counters describe the
  // original recording.
  bool created = 2;
  int32 new_candidates = 3;
  int32 updated_locations = 4;
}

message ListBundlesRequest {
  string release_definition_id = 1;
  repeated common.v1.BundleStatus status_filter = 2;
  common.v1.Pagination pagination = 3;
  string chart_name_filter = 4;
}

message ListBundlesResponse {
  repeated BundleSummary bundles = 1;
  common.v1.PaginationResponse pagination = 2;
}

message GetBundleRequest {
  string bundle_id = 1;
  string release_definition_id = 2;
}

message BundleDetail {
  BundleSummary summary = 1;
  string git_commit = 2;
  string pipeline_id = 3;
  string signature_digest = 4;
  string sbom_digest = 5;
  string provenance_digest = 6;
  string signature_ref = 7;
  string sbom_ref = 8;
  string provenance_ref = 9;
}

message GetBundleResponse {
  BundleDetail bundle = 1;
}

// BundleService is the ingress and query surface for release bundles and the
// artifact events that describe candidate artifacts.
// Callers: release-webhook forwarding CI submissions, the browser console, and
// artifact registries or pipelines that record events directly.
// Trust boundary: the management listener, so a bearer token authorized for
// bundle/read or bundle/write, or the development service token that is scoped
// to SubmitBundle alone. Bundles are global evidence: they are content-addressed
// and not owned by an organization, while the query procedures are tenant
// checked through the definition the caller names.
service BundleService {
  // Records a release bundle with its chart, image bindings and evidence
  // references, and queues it for asynchronous validation. The bundle lands in the
  // received state; the response is not a statement that it is deployable.
  // Replay-safe through two mechanisms: the canonical digest of the submission is
  // the natural key, so an identical submission returns the recorded bundle with
  // created false, and an Idempotency-Key request header held for 24 hours makes
  // the retry of the same key and payload return the original answer. The same
  // key with a different payload is refused with ALREADY_EXISTS
  // (idempotency_conflict) rather than silently replacing anything.
  // INVALID_ARGUMENT carries the failing rule in the message prefix, such as a
  // missing chart reference or digest, a digest that is not a sha256 form, an
  // image list outside 1 to 100 entries, or a duplicate values path.
  // Requires bundle/write; the scoped development service token is accepted here
  // only.
  rpc SubmitBundle(SubmitBundleRequest) returns (SubmitBundleResponse);
  // Records one artifact-registry event and folds the artifacts it mentions into
  // the candidate-artifact pool, answering how many candidates were new and how
  // many locations were refreshed.
  // Deduplicated on the (source_id, event_id) pair: a redelivery with the same
  // content answers created false, while the same pair with different content is
  // refused with ALREADY_EXISTS (artifact_event_conflict) instead of overwriting
  // history.
  // INVALID_ARGUMENT for a missing field, an empty or oversized resource list
  // (1 to 100 entries), an unspecified artifact type, an occurred_at that is not
  // RFC 3339, a payload hash that does not match raw_payload, or a resource
  // without a digest and reference.
  // Requires bundle/write.
  rpc RecordArtifactEvent(RecordArtifactEventRequest) returns (RecordArtifactEventResponse);
  // Lists bundles, optionally narrowed to one release definition and to a set of
  // statuses, with cursor pagination.
  // Read-only and replayable. Cursors are opaque and bound to the filter that
  // produced them, so a filter change must restart from the first page.
  // INVALID_ARGUMENT for a malformed page size or cursor; a bundle set the caller
  // may not see is reported as PERMISSION_DENIED rather than as an empty page.
  // Requires bundle/read.
  rpc ListBundles(ListBundlesRequest) returns (ListBundlesResponse);
  // Reads one bundle in full, including its evidence references and digests, by
  // bundle identifier or by release definition and bundle.
  // Read-only and replayable; NOT_FOUND for an unknown bundle and PERMISSION_DENIED
  // when the bundle is not reachable from the caller's organization.
  // Requires bundle/read.
  rpc GetBundle(GetBundleRequest) returns (GetBundleResponse);
}

// CreateOperationGateDetail carries the associated IDs for creation gates
// (AC-067-20/21/22). The top-level reason uses only the highest-priority gate.
message CreateOperationGateDetail {
  repeated string unresolved_operation_ids = 1;
  repeated string convergence_task_ids = 2;
}

// CreateOperationRequest submits a new standard release operation for orchestration.
message CreateOperationRequest {
  // INSTALL or UPGRADE only; anything else is INVALID_ARGUMENT.
  string operation_type = 1;          // INSTALL or UPGRADE
  string bundle_id = 2;               // ReleaseBundle ID
  string release_definition_id = 3;
  // Must be a revision in the approved state, which is the gate that keeps
  // unreviewed inputs out of a cluster.
  string values_revision_id = 4;      // must be approved
  // JSON merge patch applied over the revision's document; it is not persisted in
  // the readable operation projection.
  google.protobuf.Struct values_patch = 5;  // JSON Merge Patch (nullable)
  // Required for UPGRADE: the Helm revision the caller believes is live. A stale
  // value is a conflict, not a silent override.
  int32 expected_current_revision = 6;// required for UPGRADE
  reserved 7, 8;
  reserved "idempotency_key", "actor";
  common.v1.SignatureRef signature_ref = 9;   // optional: artifact trust verification
}

// CreateOperationResponse returns the pending operation details.
message CreateOperationResponse {
  string operation_id = 1;
  string state = 2; // always "pending"
  string preflight_id = 3;
  google.protobuf.Timestamp accepted_at = 4;
  common.v1.VerificationResult verification_result = 5; // trust verification outcome
}

// PublishReleaseRequest triggers release orchestration for a definition.
message PublishReleaseRequest {
  string release_definition_id = 1;
}

// PublishReleaseResponse returns the release operation status.
message PublishReleaseResponse {
  string operation_id = 1;
  string status = 2;
}

// RollbackReleaseRequest rolls back a release to a specific Helm revision.
message RollbackReleaseRequest {
  string release_definition_id = 1;
  int32 target_revision = 2;             // revision to rollback TO
  int32 expected_current_revision = 3;   // current revision (optimistic lock)
  string reason = 4;                     // required
  reserved 5, 6;
  reserved "actor", "idempotency_key";
  string values_revision_id = 7 [deprecated = true];  // rejected server-side (AC-067-16)
  string values_patch = 8 [deprecated = true];        // rejected server-side (AC-067-16)
}

// RollbackReleaseResponse returns the created rollback operation.
message RollbackReleaseResponse {
  string operation_id = 1;
  int32 from_revision = 2;
  int32 to_revision = 3;
  string state = 4;
}

// OperationStatus is the authoritative lifecycle state of a release operation.
enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_STATUS_PENDING = 1;
  OPERATION_STATUS_PREFLIGHT = 2;
  OPERATION_STATUS_QUEUED = 3;
  OPERATION_STATUS_RUNNING = 4;
  OPERATION_STATUS_CANCELLING = 5;
  OPERATION_STATUS_SUCCEEDED = 6;
  OPERATION_STATUS_FAILED = 7;
  OPERATION_STATUS_CANCELLED = 8;
  OPERATION_STATUS_TIMEOUT = 9;
}

// Operation exposes the safe, authoritative release-operation fields.
message Operation {
  string operation_id = 1;
  string release_definition_id = 2;
  string operation_type = 3;
  OperationStatus state = 4;
  // Compare-and-swap token for cancellation: echo it as expected_state_version.
  int64 state_version = 5;
  string bundle_id = 6;
  string values_revision_id = 7;
  int32 expected_revision = 8;
  int32 target_revision = 9;
  common.v1.ActorContext actor = 10;
  // Reserved for the projected creation time. The current projection leaves this
  // and updated_at unset, so read terminal_at for finished operations.
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp terminal_at = 13;
  google.protobuf.Timestamp deadline = 14;
  string last_error = 15;
  // effect_status is the authoritative cluster effect for EMERGENCY operations.
  // Non-EMERGENCY operations always project NOT_STARTED.
  EmergencyEffectStatus effect_status = 16;
}

message GetOperationRequest {
  string operation_id = 1;
}

message GetOperationResponse {
  Operation operation = 1;
  EmergencyResult emergency_result = 2;
}

message CancelOperationRequest {
  string operation_id = 1;
  string reason = 2;
  // The state_version the caller observed. Zero is not a wildcard: a mismatch is
  // reported as a conflict.
  int64 expected_state_version = 3;
  reserved 4;
  reserved "idempotency_key";
}

message CancelOperationResponse {
  Operation operation = 1;
  string request_id = 2;
}

message WatchOperationRequest {
  string operation_id = 1;
  // Last timeline sequence already processed; zero replays the retained history
  // from the beginning of the retention window.
  int64 after_sequence = 2;
}

message WatchOperationResponse {
  // Exactly one member per frame. A snapshot is the state as of its own sequence
  // and is what a client must apply before any entry, including the one that
  // follows it in the same stream; entries then advance the view, and heartbeats
  // carry no state and exist to keep intermediaries from closing an idle stream.
  oneof payload {
    OperationSnapshot snapshot = 1;
    TimelineEntry entry = 2;
    Heartbeat heartbeat = 3;
  }
}

message OperationSnapshot {
  Operation operation = 1;
  int64 snapshot_sequence = 2;
  int64 retained_from_sequence = 3;
}

// Labels what a retained operation timeline entry records, so a watcher can
// decode the payload field it cares about without reparsing text.
enum TimelineEntryKind {
  // What the read path returns for a stored entry whose kind it does not
  // recognise, so an older client sees an unknown label rather than a wrong one.
  TIMELINE_ENTRY_KIND_UNSPECIFIED = 0;
  TIMELINE_ENTRY_KIND_STATE_TRANSITION = 1;
  TIMELINE_ENTRY_KIND_ACK = 2;
  TIMELINE_ENTRY_KIND_ROLLOUT_PROGRESS = 3;
  TIMELINE_ENTRY_KIND_ERROR = 4;
  TIMELINE_ENTRY_KIND_EMERGENCY_EFFECT_RESOLVED = 5;
}

message TimelineEntry {
  string id = 1;
  string operation_id = 2;
  int64 sequence = 3;
  int64 operation_state_version = 4;
  google.protobuf.Timestamp timestamp = 5;
  TimelineEntryKind kind = 6;
  string request_id = 7;
  string error_code = 8;
  string error_message = 9;
  string ack_stage = 10;
  string from_state = 11;
  string to_state = 12;
  string workload_ref = 13;
  int32 ready = 14;
  int32 desired = 15;
  string effect_from = 16;
  string effect_to = 17;
}

message Heartbeat {
  int64 latest_sequence = 1;
  string request_id = 2;
  google.protobuf.Timestamp sent_at = 3;
}

// ── Release Definition Management ────────────────────────────────

message CreateReleaseDefinitionRequest {
  string customer_id = 1;
  string cluster_id = 2;
  string namespace = 3;
  string release_name = 4;
  string chart_name = 5;
  bool enabled = 6;
  common.v1.ActorContext actor = 7;
  bool hpa_managed = 8;
  int32 max_emergency_replicas = 9;
  repeated ApprovedAnnotationKey approved_annotation_keys = 10;
  repeated PromotionMapping promotion_mappings = 11;
}

message CreateReleaseDefinitionResponse {
  common.v1.ReleaseDefinition definition = 1;
}

message GetReleaseDefinitionRequest {
  string definition_id = 1;
}

message GetReleaseDefinitionResponse {
  common.v1.ReleaseDefinition definition = 1;
}

message ListReleaseDefinitionsRequest {
  string customer_id = 1;
  string cluster_id = 2;
  bool include_disabled = 3;
}

message ListReleaseDefinitionsResponse {
  repeated common.v1.ReleaseDefinition definitions = 1;
}

message UpdateReleaseDefinitionRequest {
  string definition_id = 1;
  string namespace = 2;
  string release_name = 3;
  string chart_name = 4;
  int64 expected_version = 5;
  optional bool hpa_managed = 6;
  optional int32 max_emergency_replicas = 7;
  repeated ApprovedAnnotationKey approved_annotation_keys = 8;
  repeated PromotionMapping promotion_mappings = 9;
}

message UpdateReleaseDefinitionResponse {
  common.v1.ReleaseDefinition definition = 1;
}

message DisableReleaseDefinitionRequest {
  string definition_id = 1;
  int64 expected_version = 2;
}

message DisableReleaseDefinitionResponse {
  common.v1.ReleaseDefinition definition = 1;
}

// ── Customer Management ────────────────────────────────────────────

message CreateCustomerRequest {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message CreateCustomerResponse {
  common.v1.Customer customer = 1;
}

message GetCustomerRequest {
  string customer_id = 1;
}

message GetCustomerResponse {
  common.v1.Customer customer = 1;
}

message ListCustomersRequest {
  // include_disabled includes disabled customers in the response.
  // Defaults to false (only active customers are returned).
  bool include_disabled = 1;
}

message ListCustomersResponse {
  repeated common.v1.Customer customers = 1;
}

message UpdateCustomerRequest {
  string customer_id = 1;
  string name = 2;
  string slug = 3;
  // expected_version carries the version the client observed; the update is
  // rejected with optimistic_lock_conflict when it does not match (AC-051-02).
  int64 expected_version = 4;
}

message UpdateCustomerResponse {
  common.v1.Customer customer = 1;
}

message DisableCustomerRequest {
  string customer_id = 1;
}

message DisableCustomerResponse {}

message ListCustomerEventsRequest {
  string customer_id = 1;
}

message ListCustomerEventsResponse {
  // events are ordered by (created_at DESC, id DESC) for a stable view.
  repeated common.v1.CustomerEvent events = 1;
}

// ── Cluster Management ────────────────────────────────────────────

message CreateClusterRequest {
  string id = 1;
  string name = 2;
  string customer_id = 3;
  string kubeconfig_ref = 4;
}

message CreateClusterResponse {
  common.v1.Cluster cluster = 1;
}

message UpdateClusterRequest {
  string cluster_id = 1;
  string name = 2;
  bool enabled = 3;
  int64 version = 4;
  repeated ClusterRouteInput routes = 5;
}

message UpdateClusterResponse {
  common.v1.Cluster cluster = 1;
  repeated ClusterRoute routes = 2;
}

message GetClusterRequest {
  string cluster_id = 1;
}

message GetClusterResponse {
  common.v1.Cluster cluster = 1;
}

message ListClustersRequest {
  string customer_id = 1;
}

message ListClustersResponse {
  repeated common.v1.Cluster clusters = 1;
}

message DisableClusterRequest {
  string cluster_id = 1;
}

message DisableClusterResponse {}

// ── Operator Status Enums ──────────────────────────────────────────

// OperatorLifecycleStatus is the lifecycle state of an operator identity.
enum OperatorLifecycleStatus {
  OPERATOR_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  OPERATOR_LIFECYCLE_STATUS_ACTIVE = 1;
  OPERATOR_LIFECYCLE_STATUS_SUPERSEDED = 2;
  OPERATOR_LIFECYCLE_STATUS_REVOKED = 3;
}

// OperatorSessionStatus tracks the operator connection lifecycle.
enum OperatorSessionStatus {
  OPERATOR_SESSION_STATUS_UNSPECIFIED = 0;
  OPERATOR_SESSION_STATUS_ONLINE = 1;
  OPERATOR_SESSION_STATUS_SUSPECT = 2;
  OPERATOR_SESSION_STATUS_OFFLINE = 3;
  OPERATOR_SESSION_STATUS_REVOKED = 4;
}

// OperatorSessionStatusReason explains why a session is in its current state.
enum OperatorSessionStatusReason {
  OPERATOR_SESSION_STATUS_REASON_UNSPECIFIED = 0;
  OPERATOR_SESSION_STATUS_REASON_NO_SESSION = 1;
  OPERATOR_SESSION_STATUS_REASON_HEARTBEAT_TIMEOUT = 2;
  OPERATOR_SESSION_STATUS_REASON_HEARTBEAT_DELAYED = 3;
  OPERATOR_SESSION_STATUS_REASON_CERTIFICATE_REVOKED = 4;
  OPERATOR_SESSION_STATUS_REASON_OPERATOR_SUPERSEDED = 5;
  OPERATOR_SESSION_STATUS_REASON_SESSION_REPLACED = 6;
  OPERATOR_SESSION_STATUS_REASON_UNKNOWN = 7;
}

// EnrollmentTokenState is the lifecycle of an enrollment token.
enum EnrollmentTokenState {
  ENROLLMENT_TOKEN_STATE_UNSPECIFIED = 0;
  ENROLLMENT_TOKEN_STATE_PENDING = 1;
  ENROLLMENT_TOKEN_STATE_USED = 2;
  ENROLLMENT_TOKEN_STATE_EXPIRED = 3;
  ENROLLMENT_TOKEN_STATE_REVOKED = 4;
}

// ── Operator Messages ──────────────────────────────────────────────

// OperatorSummary is a compact view of an operator for list display.
message OperatorSummary {
  string id = 1;
  string name = 2;
  string customer_id = 3;
  string cluster_id = 4;
  string cluster_name = 5;
  OperatorLifecycleStatus lifecycle_status = 6;
  OperatorSessionStatus session_status = 7;
  OperatorSessionStatusReason session_status_reason = 8;
  google.protobuf.Timestamp last_heartbeat = 9;
  google.protobuf.Timestamp registered_at = 10;
  google.protobuf.Timestamp superseded_at = 11;
  google.protobuf.Timestamp revoked_at = 12;
}

// OperatorDetail contains the full operator information including metadata.
message OperatorDetail {
  OperatorSummary summary = 1;
  string superseded_by = 2;
  string revoke_reason = 3;
  string instance_id = 4;
  string version = 5;
  map<string, string> capabilities = 6;
}

message ListOperatorsRequest {
  string customer_id = 1;
  string cluster_id = 2;
  optional OperatorLifecycleStatus lifecycle_status = 3;
  optional OperatorSessionStatus session_status = 4;
  int32 page_size = 5; // default 20, maximum 100
  string page_token = 6; // opaque cursor
}

message ListOperatorsResponse {
  repeated OperatorSummary operators = 1;
  string next_page_token = 2;
  int32 total_count = 3;
  int32 heartbeat_interval_seconds = 4;
}

message GetOperatorRequest {
  string customer_id = 1;
  string cluster_id = 2;
  string operator_id = 3;
}

message GetOperatorResponse {
  OperatorDetail operator = 1;
  int32 heartbeat_interval_seconds = 2;
}

message RevokeOperatorRequest {
  string customer_id = 1;
  string cluster_id = 2;
  string operator_id = 3;
  string reason = 4; // 5–500 Unicode characters after trimming
}

message RevokeOperatorResponse {
  OperatorSummary operator = 1;
  bool changed = 2; // false means the revocation was already recorded; the state stays revoked
}

// ── Enrollment Token Messages ──────────────────────────────────────

message CreateEnrollmentTokenRequest {
  string customer_id = 1;
  string cluster_id = 2;
  string operator_name = 3;
  int32 ttl_minutes = 4; // 0 means default 60
  bool replace_pending_token = 5;
}

message CreateEnrollmentTokenResponse {
  string token = 1; // plaintext, returned once and never persisted
  google.protobuf.Timestamp expires_at = 2;
  string customer_id = 3;
  string cluster_id = 4;
  string cluster_name = 5;
  string operator_endpoint = 6;
  string install_command_template_version = 7;
  string install_command_template = 8; // contains ${ENROLLMENT_TOKEN}
}

message GetEnrollmentTokenStatusRequest {
  string customer_id = 1;
  string cluster_id = 2;
}

message EnrollmentTokenStatus {
  EnrollmentTokenState state = 1; // pending or no active record
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp expires_at = 3;
  string created_by_display_name = 4; // redacted display name only
}

message GetEnrollmentTokenStatusResponse {
  EnrollmentTokenStatus status = 1;
}

message RevokePendingEnrollmentTokenRequest {
  string customer_id = 1;
  string cluster_id = 2;
}

message RevokePendingEnrollmentTokenResponse {
  bool changed = 1;
  EnrollmentTokenState final_state = 2; // revoked, expired, used, or unspecified
}

// OperatorErrorDetail carries a stable machine-readable code and optional field violations.
message OperatorErrorDetail {
  string error_code = 1;
  repeated common.v1.FieldViolation field_violations = 2;
}
// ── Cluster Artifact Routing (REQ-014) ────────────────────────────

// ArtifactType classifies the kind of artifact routed to a cluster.
enum ArtifactType {
  ARTIFACT_TYPE_UNSPECIFIED = 0;
  ARTIFACT_TYPE_IMAGE = 1;
  ARTIFACT_TYPE_CHART = 2;
}

// ArtifactMode describes how the cluster obtains the artifact.
enum ArtifactMode {
  ARTIFACT_MODE_UNSPECIFIED = 0;
  ARTIFACT_MODE_DIRECT = 1;
  ARTIFACT_MODE_PULL_THROUGH_CACHE = 2;
  ARTIFACT_MODE_REPLICATED = 3;
}

// ClusterRoute defines a prefix-based routing rule per artifact type.
message ClusterRoute {
  string id = 1;
  string cluster_id = 2;
  ArtifactType artifact_type = 3;
  ArtifactMode mode = 4;
  string source_prefix = 5;
  string target_prefix = 6;
}

message ClusterRouteInput {
  string id = 1;
  ArtifactType artifact_type = 2;
  ArtifactMode mode = 3;
  string source_prefix = 4;
  string target_prefix = 5;
  string provider = 6;
}

message RouteValidationDetail {
  string error_code = 1;
  string field = 2;
  string description = 3;
  string conflicting_rule_id = 4;
}

message ConfigureClusterRouteRequest {
  string id = 1;
  string cluster_id = 2;
  ArtifactType artifact_type = 3;
  ArtifactMode mode = 4;
  string source_prefix = 5;
  string target_prefix = 6;
}

message ConfigureClusterRouteResponse {
  ClusterRoute route = 1;
}

message GetClusterRoutesRequest {
  string cluster_id = 1;
}

message GetClusterRoutesResponse {
  repeated ClusterRoute routes = 1;
}

message DeleteClusterRouteRequest {
  string route_id = 1;
}

message DeleteClusterRouteResponse {}

// SubmitValuesRevisionRequest moves a draft revision into pending approval.
message SubmitValuesRevisionRequest {
  string revision_id = 1;
  int64 expected_state_version = 2;
  string comment = 3;
}

// ApproveValuesRevisionRequest approves a pending values revision.
message ApproveValuesRevisionRequest {
  string revision_id = 1;
  int64 expected_state_version = 2;
  string comment = 3;
}

// RejectValuesRevisionRequest rejects a pending values revision.
message RejectValuesRevisionRequest {
  string revision_id = 1;
  int64 expected_state_version = 2;
  string reason = 3;
}

// ValuesRevisionDecisionResponse reports the committed state transition.
message ValuesRevisionDecisionResponse {
  common.v1.ValuesRevision revision = 1;
  common.v1.ValuesStatus previous_state = 2;
  common.v1.ValuesStatus new_state = 3;
  google.protobuf.Timestamp decided_at = 4;
  repeated string superseded_revision_ids = 5;
}

// CreateValuesRevisionRequest creates one immutable draft from a complete document.
message CreateValuesRevisionRequest {
  string release_definition_id = 1;
  string document = 2;
  repeated common.v1.SecretRef secret_refs = 3;
  string parent_revision_id = 4;
  int64 expected_parent_version = 5;
  string prepare_token = 6;
}

message CreateValuesRevisionResponse {
  common.v1.ValuesRevision revision = 1;
  bool created = 2;
}

message GetValuesRevisionRequest {
  string revision_id = 1;
}

message ListValuesRevisionsRequest {
  string release_definition_id = 1;
  common.v1.ValuesStatus status = 2;
  int32 page_size = 3;
  string cursor = 4;
}

message ListValuesRevisionsResponse {
  repeated common.v1.ValuesRevision items = 1;
  string next_cursor = 2;
}

message DiscardValuesRevisionRequest {
  string revision_id = 1;
  int64 expected_state_version = 2;
  string comment = 3;
}

message CreatePrepareSessionRequest {
  string release_definition_id = 1;
  repeated string task_ids = 2;
  int64 expected_parent_version = 3;
}

message CreatePrepareSessionResponse {
  string prepare_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string parent_revision_id = 3;
  int64 parent_version = 4;
  repeated string locked_paths = 5;
  repeated string conflict_task_ids = 6;
}

message GetPrepareSessionRequest {
  string prepare_token = 1;
}

message GetPrepareSessionResponse {
  string release_definition_id = 1;
  string parent_revision_id = 2;
  string document = 3;
  repeated string locked_paths = 4;
  google.protobuf.Timestamp expires_at = 5;
  repeated string task_ids = 6;
  string locked_paths_hash = 7;
  int64 parent_version = 8;
}

// ── Release Inventory Query and Manual Sync (REQ-054) ────────────

// State of a release row in the inventory cache the agent last reported, not
// the live Helm state of the cluster.
enum ReleaseInventoryStatus {
  // Means no status filter when sent as status_filter; it is never returned as
  // the status of a release.
  RELEASE_INVENTORY_STATUS_UNSPECIFIED = 0;
  RELEASE_INVENTORY_STATUS_ACTIVE = 1;
  RELEASE_INVENTORY_STATUS_MISSING = 2;
  // Accepted as a filter but reserved: nothing in the sync path writes it today,
  // so filtering on it returns an empty page rather than an error.
  RELEASE_INVENTORY_STATUS_OUT_OF_SYNC = 3;
}

message ReleaseSummary {
  string namespace = 1;
  string name = 2;
  string chart = 3;
  string chart_version = 4;
  int32 revision = 5;
  ReleaseInventoryStatus status = 6;
  string values_digest = 7;
  google.protobuf.Timestamp last_sync_at = 8;
  string release_definition_id = 9;
  // Canonical Emergency contract fields (REQ-079, D5 — names are fixed by the
  // TASK-058 gate fixture; optional in proto3).
  string operation_version = 10;
  bool emergency_conflict = 11;
  int32 pending_convergence_count = 12;
  string revert_status_summary = 13;
}

message ListReleasesRequest {
  string customer_id = 1;
  string cluster_id = 2;
  ReleaseInventoryStatus status_filter = 3;
  string name_search = 4;
  int32 page_size = 5;
  string cursor = 6;
}

message ListReleasesResponse {
  repeated ReleaseSummary releases = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

message TriggerInventorySyncRequest {
  string customer_id = 1;
  string cluster_id = 2;
}

// ── ValuesRevision CRUD and secret metadata (REQ-055) ─────────────

message ListSecretsRequest {
  string cluster_id = 1;
  string release_definition_id = 2;
}

message SecretOption {
  string name = 1;
  repeated string keys = 2;
}

message ListSecretsResponse {
  repeated SecretOption secrets = 1;
}

message TriggerInventorySyncResponse {
  // Correlates with the X-Sync-Request-ID response header; match it against the
  // sync_id the agent eventually reports to confirm the request was acted on.
  string sync_request_id = 1;
}
// OrchestratorService is the release control plane: it creates and watches
// release operations, owns release definitions, customers, clusters, operator
// records, artifact routing, values revisions and their approval flow,
// inventory observation, and the guard rails around emergency execution.
// Callers: the browser console, administrative tooling and CI on the management
// listener, plus the customer-cluster operator agent for the single inventory
// reporting procedure on the mTLS agent gateway.
// Trust boundary: management procedures carry a user token whose organization
// must match every organization-scoped field, and are authorized per procedure
// against Casbin (release, customer, binding, operator objects) plus the
// handler's own capability check for values and execution writes. Agent
// procedures are authorized by the verified client certificate instead.
// Writes are versioned: an operation, values revision or record carries a state
// or optimistic version the caller must echo, and a lost race is reported as a
// conflict rather than resolved silently. Most writes carry an Idempotency-Key
// request header; the ones that do not say so in their comment are ordered by a
// natural key or by state instead.
service OrchestratorService {
  // Queues a release operation (install or upgrade) for a bundle and values
  // revision against a release definition; the orchestrator, not the caller,
  // decides when and how the operator agent executes it.
  // Carries an Idempotency-Key request header. A retry with the same key and the
  // same payload replays the operation created the first time; the same key with a
  // different payload is refused with ALREADY_EXISTS, and a conflicting stored
  // record is reported the same way rather than as a second operation.
  // Refused while a cluster effect is unresolved or a convergence task is still
  // running for the definition: FAILED_PRECONDITION with a machine reason and a
  // typed detail naming the blocking work, which is the caller's signal to wait
  // rather than to retry blindly.
  // INVALID_ARGUMENT for an unsupported operation type or a missing input,
  // NOT_FOUND for an unknown definition, bundle or revision, PERMISSION_DENIED for
  // a disabled customer or cluster, and UNAVAILABLE when the authorization state
  // cannot be read. The response reports the post-gate state, usually the
  // preflight state, not the queued state.
  // Requires release/write with the deployer or administrator capability.
  rpc CreateOperation(CreateOperationRequest) returns (CreateOperationResponse);
  // Publishes a bundle to a release definition. It validates that the definition,
  // customer and cluster can be targeted, but the publishing step itself is a
  // skeleton: the response carries no operation identifier and a status of
  // not_implemented.
  // Because nothing is enqueued, calling it twice is harmless, and it must not be
  // used as a way to trigger a deployment. Use CreateOperation for real work.
  // NOT_FOUND for an unknown definition or cluster and PERMISSION_DENIED for a
  // disabled customer or cluster are still enforced.
  // Requires release/write.
  rpc PublishRelease(PublishReleaseRequest) returns (PublishReleaseResponse);
  // Queues a rollback of a release definition to a previous Helm revision, as a
  // new operation rather than an in-place mutation of the failed one.
  // Carries an Idempotency-Key request header with the same replay and conflict
  // semantics as CreateOperation.
  // FAILED_PRECONDITION when the requested revision no longer matches what the
  // cluster reports (a stale revision view), when the target is not operable, or
  // when a cluster effect is unresolved; NOT_FOUND for an unknown definition.
  // Requires release/write with the deployer or administrator capability.
  rpc RollbackRelease(RollbackReleaseRequest) returns (RollbackReleaseResponse);
  // Reads one release operation: state, versions, targets and the last error,
  // with the caller's own actor recorded.
  // Read-only and replayable. The projection is intentionally public-safe: the
  // values patch, the stored idempotency material and the request hash are never
  // returned, so this is not the way to recover an input document.
  // NOT_FOUND for an unknown operation or one belonging to another organization.
  // Requires release/read.
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  // Streams an operation's timeline: a snapshot of the retained history, then live
  // state entries as they are recorded, with periodic heartbeat frames to keep
  // proxies alive.
  // Resumable rather than idempotent: pass the last sequence you processed as
  // after_sequence and the stream replays everything retained from that point, so
  // reconnecting after a drop does not lose or duplicate state. The stream ends
  // when the operation reaches a terminal state.
  // A cursor older than the retention window answers OUT_OF_RANGE with reason
  // cursor_expired and carries the current snapshot sequence, the oldest retained
  // sequence and a base64 snapshot in error metadata, which lets a client rebuild
  // state without a second round trip.
  // NOT_FOUND for an unknown operation. Requires release/read. Note that streaming
  // bypasses the unary maintenance-mode gate, so a watch keeps working during a
  // cutover while writes are blocked.
  rpc WatchOperation(WatchOperationRequest) returns (stream WatchOperationResponse);
  // Requests cancellation of a non-terminal operation and records the reason.
  // Carries an Idempotency-Key request header.
  // Versioned: expected_state_version must match the operation as the caller saw
  // it, and a stale value is refused as a conflict so the caller re-reads. A
  // terminal operation is refused with FAILED_PRECONDITION (cancel_not_allowed), as
  // is an operation already cancelling or an in-flight emergency, which cannot be
  // cancelled by design.
  // NOT_FOUND for an unknown operation. Requires release/write.
  rpc CancelOperation(CancelOperationRequest) returns (CancelOperationResponse);
  // Moves a values revision into the pending-approval state so an approver other
  // than the author can decide on it.
  // Versioned by expected_state_version; a stale value answers ABORTED
  // (optimistic_lock_conflict). An Idempotency-Key request header is honoured but
  // optional: without one there is no replay protection, so a client that retries
  // must be prepared for the state check to reject the second attempt.
  // NOT_FOUND (revision_not_found) for an unknown revision,
  // FAILED_PRECONDITION (invalid_revision_state) when the revision is not in a
  // submittable state, PERMISSION_DENIED when the caller lacks the role or is not
  // an active member, FAILED_PRECONDITION when the customer or organization is
  // disabled or the binding is revoked, and UNAVAILABLE when the authorization
  // snapshot is stale.
  // Requires the values-approval capability; the handler decides, not Casbin.
  rpc SubmitValuesRevision(SubmitValuesRevisionRequest) returns (ValuesRevisionDecisionResponse);
  // Approves a pending values revision, making it eligible for execution.
  // Versioned by expected_state_version, with ABORTED (optimistic_lock_conflict)
  // on a lost race, and approval_already_pending or invalid_revision_state as
  // FAILED_PRECONDITION when the revision is not awaiting a decision.
  // An approver may not approve a revision they authored: PERMISSION_DENIED
  // (self_approval_forbidden).
  // Same optional Idempotency-Key and authorization-snapshot behaviour as the
  // submit path. Requires the values-approval capability.
  rpc ApproveValuesRevision(ApproveValuesRevisionRequest) returns (ValuesRevisionDecisionResponse);
  // Rejects a pending values revision with a mandatory reason, which is retained
  // for audit.
  // Versioned and state-checked exactly like approval: ABORTED on a stale
  // expected_state_version, FAILED_PRECONDITION when the revision is not awaiting
  // a decision, and INVALID_ARGUMENT when the reason is missing, too long or
  // carries forbidden characters.
  // Rejection is terminal for the revision: it cannot be resubmitted, so the
  // author must create a successor. Requires the values-approval capability.
  rpc RejectValuesRevision(RejectValuesRevisionRequest) returns (ValuesRevisionDecisionResponse);
  // ValuesRevision CRUD and secret metadata (REQ-055)
  // Submits an immutable values document for a release definition, optionally
  // inside a prepare session, and returns the revision in its initial state.
  // Carries an Idempotency-Key request header. Beyond replay protection, the
  // revision itself never changes once created: correcting values means a new
  // revision with a parent pointer.
  // ABORTED (parent_conflict) when another revision became the chain head while
  // this one was being written, FAILED_PRECONDITION for an expired prepare token,
  // NOT_FOUND for an unknown definition or token, INVALID_ARGUMENT for a missing
  // document or a malformed secret reference, and RESOURCE_EXHAUSTED when the
  // document is over the size limit.
  // Requires the values-creation capability on the definition's organization; the
  // handler performs that check itself in addition to the policy gate.
  rpc CreateValuesRevision(CreateValuesRevisionRequest) returns (CreateValuesRevisionResponse);
  // Reads one values revision, including its canonical document and secret
  // references.
  // Read-only and replayable; NOT_FOUND (revision_not_found) for an unknown
  // identifier and INVALID_ARGUMENT for a missing one.
  // Requires release/read on the owning definition.
  rpc GetValuesRevision(GetValuesRevisionRequest) returns (common.v1.ValuesRevision);
  // Lists the revision history of a release definition, optionally filtered by
  // status, with cursor pagination.
  // Read-only and replayable while a cursor is valid.
  // INVALID_ARGUMENT for a missing definition, a page size above 100, an unknown
  // status filter or an undecodable cursor (invalid_cursor), the one place in this
  // contract where a stale cursor is reported as a client error rather than
  // internally.
  // Requires release/read.
  rpc ListValuesRevisions(ListValuesRevisionsRequest) returns (ListValuesRevisionsResponse);
  // Discards a values revision that is not yet executing, so it can never be
  // approved or run.
  // Carries an Idempotency-Key request header and a compare-and-swap on
  // expected_state_version, which must be at least 1.
  // FAILED_PRECONDITION when the revision's state does not allow discarding; the
  // operation is not reversible, so a mistaken discard needs a new revision.
  // NOT_FOUND for an unknown revision. Requires the values-creation capability on
  // the owning definition.
  rpc DiscardValuesRevision(DiscardValuesRevisionRequest) returns (ValuesRevisionDecisionResponse);
  // Opens a short-lived prepare session that resolves secret references and locks
  // values paths before a revision is submitted, returning the token to pass to
  // CreateValuesRevision.
  // Not idempotent: each call opens a new session, and an unrecovered session
  // simply expires.
  // ABORTED when an in-flight convergence task conflicts with the paths being
  // prepared, FAILED_PRECONDITION for a definition that cannot be prepared,
  // NOT_FOUND for an unknown definition, PERMISSION_DENIED when the caller lacks
  // the capability, and UNAVAILABLE when secret metadata cannot be resolved.
  // Requires the values-creation capability.
  rpc CreatePrepareSession(CreatePrepareSessionRequest) returns (CreatePrepareSessionResponse);
  // Reads a prepare session's resolved state and expiry.
  // Read-only and replayable while the session exists; NOT_FOUND for an unknown
  // token and FAILED_PRECONDITION once it has expired, at which point a new
  // session must be opened rather than resumed.
  // Requires the same authorization as the write it prepared.
  rpc GetPrepareSession(GetPrepareSessionRequest) returns (GetPrepareSessionResponse);
  // Lists the secret metadata (paths and digests, never values) that a definition
  // resolves in its target cluster.
  // This is not a local database read: it enqueues a metadata command and waits
  // for the agent to answer, for up to about fifteen seconds.
  // Read-only but not replay-safe under pressure: an offline or slow agent answers
  // UNAVAILABLE (operator_offline, or metadata temporarily unavailable) and the
  // client should retry later, which is the intended back pressure rather than a
  // bug.
  // INVALID_ARGUMENT when the scope fields are missing and NOT_FOUND when the
  // definition is not in the named cluster. Requires release/read.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // Release definition management
  // Creates the pairing of a bundle source with a customer, cluster, namespace
  // and release name, which is the object every operation targets.
  // Not idempotent: the same inputs submitted twice create two definitions unless
  // the natural tuple already exists, in which case ALREADY_EXISTS is returned
  // rather than the existing row.
  // INVALID_ARGUMENT for a missing field or a cluster that does not belong to the
  // named customer, NOT_FOUND for an unknown customer or cluster, and
  // PERMISSION_DENIED when either is disabled.
  // Requires release/write.
  rpc CreateReleaseDefinition(CreateReleaseDefinitionRequest) returns (CreateReleaseDefinitionResponse);
  // Reads one release definition by identifier.
  // Read-only and replayable; NOT_FOUND for an unknown identifier.
  // Requires release/read.
  rpc GetReleaseDefinition(GetReleaseDefinitionRequest) returns (GetReleaseDefinitionResponse);
  // Lists the release definitions visible to the caller's organization.
  // Read-only and replayable; unpaginated, so the response grows with the tenant.
  // Requires release/read.
  rpc ListReleaseDefinitions(ListReleaseDefinitionsRequest) returns (ListReleaseDefinitionsResponse);
  // Updates a definition's mutable fields (namespace, release name, chart name,
  // emergency guard rails, promotion configuration).
  // Versioned when the caller supplies expected_version: a stale value answers
  // FAILED_PRECONDITION (optimistic_lock_conflict). Leaving it at zero skips the
  // check and writes unconditionally, so a caller that cares about lost updates
  // must send the version it read.
  // Unset fields are left alone rather than cleared, so this cannot remove an
  // approved annotation key or mapping.
  // NOT_FOUND for an unknown definition, FAILED_PRECONDITION when the definition
  // is disabled, INTERNAL on a store fault.
  // Requires release/write.
  rpc UpdateReleaseDefinition(UpdateReleaseDefinitionRequest) returns (UpdateReleaseDefinitionResponse);
  // Disables a definition so no new operation can target it; existing history and
  // inventory are kept.
  // Convergent: an already disabled definition answers success again rather than
  // reporting a conflict.
  // NOT_FOUND for an unknown definition. Requires release/write.
  rpc DisableReleaseDefinition(DisableReleaseDefinitionRequest) returns (DisableReleaseDefinitionResponse);
  // Registers a customer, the tenant that clusters, bindings and releases hang
  // off.
  // Not idempotent: no deduplication key and no natural key on the name, so a
  // retry after a lost response can create a second customer. Check before
  // retrying.
  // The handler reports INVALID_ARGUMENT for a missing name, NOT_FOUND when the
  // resolved owner organization is unknown and INTERNAL on a store fault.
  // Requires customer access in the caller's organization.
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);
  // Reads one customer by identifier.
  // Read-only and replayable; NOT_FOUND for an unknown customer.
  // Requires customer/read.
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  // Lists the customers the caller's organization can see.
  // Read-only, replayable and unpaginated.
  // Requires customer/read.
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  // Updates a customer's mutable metadata under optimistic locking.
  // Versioned: a stale expected_version is refused so a lost update cannot
  // silently rename or reconfigure a tenant.
  // NOT_FOUND for an unknown customer. Requires customer access in the caller's
  // organization.
  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse);
  // Disables a customer, which stops new work for every cluster beneath it while
  // leaving already-applied releases running.
  // Convergent: disabling an already disabled customer answers success again.
  // Disabling cascades: outstanding enrollment tokens, operators and sessions are
  // retired with it, which is why it is the kill switch for a tenant.
  // NOT_FOUND for an unknown customer. Requires customer access.
  rpc DisableCustomer(DisableCustomerRequest) returns (DisableCustomerResponse);
  // Reads the recorded lifecycle events of a customer, such as disable and
  // re-enable transitions.
  // Read-only and replayable; NOT_FOUND for an unknown customer.
  // Requires customer/read.
  rpc ListCustomerEvents(ListCustomerEventsRequest) returns (ListCustomerEventsResponse);
  // Registers a cluster beneath a customer, the target an operator agent will
  // later enroll against.
  // Not idempotent: there is no key, so a retry can create a second cluster row;
  // the customer and name tuple is constrained by storage.
  // NOT_FOUND for an unknown customer and PERMISSION_DENIED when that customer is
  // disabled. Requires customer access.
  rpc CreateCluster(CreateClusterRequest) returns (CreateClusterResponse);
  // Updates a cluster's mutable metadata under optimistic locking.
  // ABORTED when expected_version is stale, so the caller re-reads instead of
  // overwriting a concurrent change.
  // INVALID_ARGUMENT for a malformed request, ALREADY_EXISTS for a name collision
  // within the customer, NOT_FOUND for an unknown cluster.
  // Requires customer access.
  rpc UpdateCluster(UpdateClusterRequest) returns (UpdateClusterResponse);
  // Reads one cluster, including its route count and credential reference.
  // Read-only and replayable; NOT_FOUND for an unknown cluster.
  // Requires customer/read.
  rpc GetCluster(GetClusterRequest) returns (GetClusterResponse);
  // Lists clusters, optionally narrowed to one customer.
  // Read-only, replayable and unpaginated.
  // Requires customer/read.
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);
  // Disables a cluster so it can no longer be targeted or routed to.
  // Convergent: an already disabled cluster answers success again.
  // NOT_FOUND for an unknown cluster. Requires customer access.
  rpc DisableCluster(DisableClusterRequest) returns (DisableClusterResponse);

  // Operator management (REQ-053)
  // Lists the operator agents registered for a customer and cluster pair.
  // Read-only and replayable. Both scope fields are required: INVALID_ARGUMENT
  // rather than an unfiltered enumeration.
  // Requires operator/read.
  rpc ListOperators(ListOperatorsRequest) returns (ListOperatorsResponse);
  // Reads one operator record by identifier.
  // Read-only and replayable; an unknown identifier is reported through the
  // handler's own error mapping rather than as an empty record.
  // Requires operator/read.
  rpc GetOperator(GetOperatorRequest) returns (GetOperatorResponse);
  // Revokes an operator agent's identity so its certificate and session stop being
  // accepted, and drops its live stream.
  // Convergent: revoking an already revoked operator is not an error, and the
  // changed flag on the response says whether this call is what revoked it, so a
  // retry after a lost response is safe.
  // INVALID_ARGUMENT when the reason is shorter than 5 or longer than 500
  // characters, NOT_FOUND when the operator is not under the named customer and
  // cluster, and UNAVAILABLE when the revocation is durable but the live stream
  // could not be closed.
  // Requires the operator/revoke permission, which the built-in model gives
  // platform_admin and release_admin.
  rpc RevokeOperator(RevokeOperatorRequest) returns (RevokeOperatorResponse);
  // Mints the single-use enrollment token an operator agent presents to the
  // gateway in order to get its client certificate.
  // Not idempotent: each call creates a new token. Issuing a second one does not
  // revoke the first, so a token left over from a failed enrollment stays usable
  // until it expires or is revoked.
  // INVALID_ARGUMENT for a bad time-to-live (0 means the default, otherwise 5 to
  // 1440 minutes), ALREADY_EXISTS when the requested operator name is already an
  // active operator, NOT_FOUND for an unknown cluster, UNAUTHENTICATED without a
  // resolvable caller and UNAVAILABLE when the enrollment state cannot be read.
  // Requires the operator/enroll permission. The returned credential should be
  // treated as a secret and delivered out of band.
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);
  // Reads the pending enrollment token outstanding for a customer and cluster,
  // which is how an operator confirms a token is still waiting to be used.
  // Read-only and replayable. Only a pending, unexpired token is reported: no
  // pending token, or one past its expiry, answers with an unspecified state
  // rather than NOT_FOUND, so this cannot tell used from revoked from absent.
  // Requires operator/read.
  rpc GetEnrollmentTokenStatus(GetEnrollmentTokenStatusRequest) returns (GetEnrollmentTokenStatusResponse);
  // Revokes an enrollment token that has not been used yet, so a leaked credential
  // can be retired without enrolling anything.
  // Convergent for a token already in the revoked state: the changed flag reports
  // whether this call is what revoked it, so a replay is distinguishable instead of
  // an error.
  // Only a pending token can be revoked; one that was already used has no pending
  // state to return to. Requires the operator/enroll permission.
  rpc RevokePendingEnrollmentToken(RevokePendingEnrollmentTokenRequest) returns (RevokePendingEnrollmentTokenResponse);
  // Emergency change (REQ-079 canonical contract; replaces the REQ-032 legacy call surface)
  // Runs an out-of-band emergency action against a workload in a customer cluster,
  // bypassing the normal bundle and values pipeline, and records it as an operation
  // with an authoritative effect status.
  // Keyed by the idempotency_key field of the request itself, not by the header:
  // it is required, and a replay of the same key answers the recorded outcome
  // instead of executing twice. A missing key is INVALID_ARGUMENT
  // (idempotency_key_required).
  // Refused before execution when the definition has an unresolved prior effect,
  // when the caller lacks the emergency capability, when the target is outside the
  // caller's organization, or when the emergency kill switch is off; those come
  // back as FAILED_PRECONDITION or PERMISSION_DENIED with a machine reason code.
  // UNAVAILABLE when no agent stream can accept the command.
  // Requires the organization's emergency capability in addition to release/write;
  // administrators only in the built-in model.
  rpc ExecuteEmergencyChange(ExecuteEmergencyChangeRequest) returns (ExecuteEmergencyChangeResponse);
  // Lists the workloads an emergency action may target for a definition, built
  // from the last observed inventory rather than by asking the cluster.
  // Read-only and replayable, but the answer is only as fresh as the last
  // inventory sync; use TriggerInventorySync when it must be current.
  // NOT_FOUND for an unknown definition, INVALID_ARGUMENT for a malformed scope,
  // INTERNAL on a store fault.
  // Requires release/read.
  rpc ListEmergencyTargets(ListEmergencyTargetsRequest) returns (ListEmergencyTargetsResponse);
  // Reports whether in-flight work would collide with a proposed emergency action,
  // so a caller can resolve a conflict before executing.
  // Read-only and replayable; it reserves nothing, so a clean answer is a
  // statement about this instant and execution can still be refused later.
  // INVALID_ARGUMENT for a malformed scope. Requires release/read.
  rpc CheckEmergencyConflict(CheckEmergencyConflictRequest) returns (CheckEmergencyConflictResponse);
  // Lists the candidate artifacts validated for one release definition, narrowed
  // by workload, container or operation version.
  // Read-only and replayable. Requires a release definition: INVALID_ARGUMENT
  // rather than an unbounded scan of every artifact ever recorded.
  // Requires bundle/read.
  rpc ListCandidateArtifacts(ListCandidateArtifactsRequest) returns (ListCandidateArtifactsResponse);
  // Lists the convergence tasks that reconcile a definition towards its approved
  // inputs, which is what blocks new operations while they run.
  // Read-only and replayable; an empty list is the normal answer for a definition
  // with nothing pending.
  // INVALID_ARGUMENT for a malformed scope. Requires release/read.
  rpc ListConvergenceTasks(ListConvergenceTasksRequest) returns (ListConvergenceTasksResponse);
  // Emergency stuck-lock observation and release (REQ-087): terminal
  // operations whose effect is still UNKNOWN past the observe window surface
  // as stuck locks for release_admin/platform_admin operators.
  // Lists emergency operations whose cluster effect is still unknown past the
  // observation window, the condition that keeps a definition from accepting new
  // work.
  // Read-only and replayable.
  // UNAUTHENTICATED when the caller's identity cannot be resolved; the list is
  // scoped to the caller's own organization.
  // Requires release/read, and the release action itself requires an
  // administrator role.
  rpc ListStuckLocks(ListStuckLocksRequest) returns (ListStuckLocksResponse);
  // Records that a stuck emergency effect has been resolved out of band, clearing
  // the block so the definition can accept work again.
  // Not replayable as a success: the lock must still be stuck, so a second call
  // after the release reports NOT_FOUND or a state conflict. There is no undo, so
  // releasing wrongly reopens a definition whose cluster state is still unknown.
  // INVALID_ARGUMENT for a missing identifier, NOT_FOUND for an unknown lock,
  // UNAUTHENTICATED without a resolvable caller.
  // Requires an administrator role.
  rpc ReleaseEmergencyLock(ReleaseEmergencyLockRequest) returns (ReleaseEmergencyLockResponse);
  // Creates or replaces the routing entry that binds a cluster to the operator
  // agent allowed to serve it, which is what makes delivery to that cluster
  // possible at all.
  // Keyed by the pair of cluster and artifact type, or by the supplied route
  // identifier when one is given, which turns this into an update of that entry
  // instead of an insertion; a retry converges rather than accumulating routes.
  // INVALID_ARGUMENT for a rejected route shape, NOT_FOUND for an unknown cluster,
  // ALREADY_EXISTS for a route that overlaps an existing one, PERMISSION_DENIED
  // when the cluster is disabled.
  // Requires release/write, and routing is an administrator concern.
  rpc ConfigureClusterRoute(ConfigureClusterRouteRequest) returns (ConfigureClusterRouteResponse);
  // Lists the routing entries of a cluster.
  // Read-only and replayable; an empty list means nothing can reach the cluster.
  // Requires release/read.
  rpc GetClusterRoutes(GetClusterRoutesRequest) returns (GetClusterRoutesResponse);
  // Removes a routing entry by identifier, so the cluster stops receiving
  // dispatched work through it.
  // Not convergent: an unknown or already deleted route answers NOT_FOUND, so a
  // retry after a lost response must treat that as done.
  // Requires release/write.
  rpc DeleteClusterRoute(DeleteClusterRouteRequest) returns (DeleteClusterRouteResponse);
  // Lists the Helm releases recorded in the inventory of one cluster. The answer
  // is the last snapshot the agent reported, not a live query, so freshness is
  // governed by TriggerInventorySync and SyncInventory.
  // Read-only and replayable, with an opaque cursor; a cursor the store cannot
  // decode answers INVALID_ARGUMENT (invalid_cursor).
  // INVALID_ARGUMENT for a missing customer or cluster, or a name search over
  // 253 characters; NOT_FOUND for an unknown customer or cluster.
  // Requires release/read.
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  // E2E observability (REQ-066): unfiltered release-inventory enumeration.
  // Each row carries the stable identity of one observed release plus its
  // active (non-terminal) operation when present; used for identity checks,
  // release_busy discovery and e2e-cleanup recovery. values_digest and
  // internal sync data are intentionally not exposed.
  // Enumerates observed release inventory, each row carrying the stable identity
  // of one observed release plus its active operation when there is one.
  // Read-only and replayable, and deliberately unfiltered so that reconciliation
  // and cleanup tooling can walk the whole set; the values digest and internal sync
  // data are not exposed.
  // UNAUTHENTICATED when no caller identity can be resolved.
  // Requires release/read.
  rpc ListReleaseInventory(ListReleaseInventoryRequest) returns (ListReleaseInventoryResponse);
  // Operation query (REQ-056)
  // Declared for operation search across definitions, statuses and time.
  // Not implemented in the release-orchestrator handler: every call answers
  // UNIMPLEMENTED. Enumerate operations through GetOperation and WatchOperation
  // for identifiers you already hold, or through the release definition's own
  // history.
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  // Asks the orchestrator to schedule an inventory refresh for one cluster and
  // returns immediately; the agent reports the result through SyncInventory
  // later.
  // Not idempotent: each call enqueues another request with its own identifier,
  // which is harmless but means a retry doubles the work rather than replaying.
  // NOT_FOUND when the cluster is unknown or not under the named customer, and
  // UNAVAILABLE when no agent stream is online to take the request.
  // The response identifier is also echoed in the X-Sync-Request-ID response
  // header for log correlation.
  // Requires release/write.
  rpc TriggerInventorySync(TriggerInventorySyncRequest) returns (TriggerInventorySyncResponse);

  // Inventory sync (REQ-017)
  // Records an inventory snapshot reported by an operator agent, marking releases
  // that disappeared from a full snapshot as missing, and answers the accepted and
  // missing counts with the snapshot version.
  // Idempotent on the sync_id field: a report replayed with the same identifier is
  // answered from the recorded result with status duplicate and no second write.
  // This is the only management procedure the customer-cluster agent may call, and
  // it is served on the mTLS agent-gateway listener, where a verified client
  // certificate naming this operator, customer and cluster is the credential; a
  // caller without one is refused before the handler runs. The identity fields must
  // match the certificate, so an agent cannot report for another cluster.
  // INVALID_ARGUMENT for a malformed report or an over-large item list.
  rpc SyncInventory(SyncInventoryRequest) returns (SyncInventoryResponse);
}

// ── Emergency Change (REQ-032) ────────────────────────────────────

// EmergencyAction is a typed operation whitelisted for emergency changes.
enum EmergencyAction {
  EMERGENCY_ACTION_UNSPECIFIED = 0;
  EMERGENCY_ACTION_SET_CONTAINER_IMAGE = 1;
  EMERGENCY_ACTION_SET_REPLICAS = 2;
  EMERGENCY_ACTION_SET_APPROVED_ANNOTATION = 3;
}

// EmergencyConvergence controls how the system returns to normal state.
enum EmergencyConvergence {
  EMERGENCY_CONVERGENCE_UNSPECIFIED = 0;
  // REQUIRE_PROMOTION means the emergency change must be promoted to a
  // standard ValuesRevision and go through the normal Helm pipeline.
  EMERGENCY_CONVERGENCE_REQUIRE_PROMOTION = 1;
  // REVERT_ON_NEXT_RECONCILE means the emergency change will be reverted
  // on the next reconciliation cycle.
  EMERGENCY_CONVERGENCE_REVERT_ON_NEXT_RECONCILE = 2;
}

message ApprovedAnnotationKey {
  string key = 1;
  string scope = 2;
  string promotion_values_path = 3;
}

message PromotionMapping {
  string workload_kind = 1;
  string workload_name = 2;
  string container = 3;
  string field = 4;
  string values_path = 5;
}

message WorkloadRef {
  string kind = 1;
  string name = 2;
  string namespace = 3;
  string uid = 4;
}

message SetContainerImage {
  string container = 1;
  string artifact_id = 2;
}

message SetReplicas {
  int32 replicas = 1;
}

message SetApprovedAnnotations {
  repeated AnnotationEntry entries = 1;
}

message AnnotationEntry {
  string key = 1;
  string value = 2;
}

message ListEmergencyTargetsRequest {
  string release_definition_id = 1;
}

message ListEmergencyTargetsResponse {
  repeated EmergencyTarget targets = 1;
}

message EmergencyTarget {
  WorkloadRef workload_ref = 1;
  repeated string containers = 2;
  repeated EmergencyAction supported_operations = 3;
  repeated PromotionMapping promotions = 4;
  map<string, string> current_image_refs = 5;
  int32 current_replicas = 6;
  map<string, string> current_annotations = 7;
  bool hpa_managed = 8;
  int32 max_emergency_replicas = 9;
  // Cluster the workload runs in. The emergency workload belongs to the release
  // definition's customer cluster, not the management plane, so a caller that
  // must read the workload itself (the E2E replica observer) needs the cluster
  // identity to select the right control plane.
  string cluster = 10;
}

message CheckEmergencyConflictRequest {
  string release_definition_id = 1;
}

message CheckEmergencyConflictResponse {
  bool has_conflict = 1;
  RunningOperationDetail running_operation = 2;
}

message RunningOperationDetail {
  string operation_id = 1;
  string type = 2;
  string status = 3;
  google.protobuf.Timestamp started_at = 4;
}

message ListCandidateArtifactsRequest {
  string organization_id = 1;
  string release_definition_id = 2;
  // Cascade parameters (REQ-079 AC-079-08 / D11): workload_ref is the
  // "<gvr.resource>/<namespace>/<name>" form also used by the operator
  // control stream; container/operation_version require workload_ref.
  string workload_ref = 3;
  string container = 4;
  string operation_version = 5;
}

message ListCandidateArtifactsResponse {
  repeated CandidateArtifactSummary artifacts = 1;
}

message CandidateArtifactSummary {
  string id = 1;
  string repository = 2;
  string digest = 3;
  string ref = 4;
  google.protobuf.Timestamp validated_at = 5;
  string source_id = 6;
}

message ListConvergenceTasksRequest {
  string release_definition_id = 1;
  string status_filter = 2;
}

message ListConvergenceTasksResponse {
  repeated ConvergenceTaskDetail tasks = 1;
}

message ConvergenceTaskDetail {
  string task_id = 1;
  string operation_id = 2;
  EmergencyAction op_type = 3;
  string target_summary = 4;
  google.protobuf.Timestamp submitted_at = 5;
  string reason = 6;
  string active_revision_id = 7;
  string active_revision_status = 8;
  repeated string promotion_paths = 9;
  bool selectable = 10;
  string incompatibility_reason = 11;
}

// ExecuteEmergencyChange is the canonical emergency execution contract
// (REQ-079, D-94 decision A). It replaces the legacy REQ-032 call surface.
// workload_ref uses the "<gvr.resource>/<namespace>/<name>" string form
// shared with the operator control stream.
message ExecuteEmergencyChangeRequest {
  string release_definition_id = 1; // required (domain term: ReleaseDefinition)
  string workload_ref = 2;          // required; "<gvr.resource>/<namespace>/<name>"
  string container = 3;             // optional; requires workload_ref (D11)
  string operation_version = 4;     // optional; requires workload_ref (D11/D4)
  string artifact_ref = 5;          // required; must resolve to a ListCandidateArtifacts candidate (D14)
  ConvergenceStrategy convergence_strategy = 6; // required; UNSPECIFIED rejected (D12/D13)
  repeated string target_locks = 7; // required when REQUIRE_PROMOTION (D12)
  string idempotency_key = 8;       // write idempotency key (ADR-009)
  bytes request_hash = 9;           // request fingerprint (ADR-009)
  // REQ-081 (D3=A/D4=A): flat replicas scalar for the SET_REPLICAS action.
  // Mutually exclusive with container/artifact_ref (image change) — sending
  // both is rejected as conflicting_change. 0 means "replicas not requested"
  // (flat scalar has no presence; scale-to-zero needs a contract revisit).
  // The request-level operation_version (field 4) also governs this branch
  // (D5=A); idempotency key + request hash are reused unchanged (ADR-009).
  int32 set_replicas = 10;
  // REQ-058 annotations action (TASK-126 / D15 follow-up): the annotation
  // entries to set, and the scope they belong to. Every key must be on the
  // definition's approved-annotation-key whitelist for that scope, so the
  // request cannot widen its own authority. Mutually exclusive with the image
  // branch and with set_replicas.
  repeated AnnotationEntry annotations = 11;
  string annotation_scope = 12;
}

message ExecuteEmergencyChangeResponse {
  EmergencyResult result = 1;
  string operation_id = 2;         // linked Operation for traceability
  string operation_version = 3;    // authoritative version derived on acceptance (D4)
}

// buf:lint:ignore ENUM_VALUE_PREFIX
// REQ-079 §4 pins the canonical value names REVERT_ON_NEXT_RECONCILE /
// REQUIRE_PROMOTION (grilling decisions D12/D13); prefixing would diverge
// from the contract wording and the Go constant names derived from it.
enum ConvergenceStrategy {
  CONVERGENCE_STRATEGY_UNSPECIFIED = 0; // proto3 zero value; rejected by the server (D13)
  REVERT_ON_NEXT_RECONCILE = 1;         // revert at next reconcile (ADR-011)
  REQUIRE_PROMOTION = 2;                // persistent Convergence Task (ADR-011)
}

// OperationVersion is a message (not a scalar) so connect-es emits an
// OperationVersionSchema export consumed by the frontend gate fixture.
message OperationVersion {
  string version = 1; // semver-style string (e.g. "v1.0.0")
}

message EmergencyErrorDetail {
  EmergencyReasonCode reason_code = 1; // typed classification (D2)
  string message = 2;                  // user-facing message
  bool retryable = 3;                  // client retry guidance (D3)
}

// Machine-readable reason attached to an emergency attempt, either in the
// failure detail of the response or in the audit record, so an operator can
// branch on why an emergency action was refused without parsing text.
enum EmergencyReasonCode {
  // Means no reason was attached, which is what a successful attempt records;
  // never treat it as an internal-error code or as an unknown state.
  EMERGENCY_REASON_CODE_UNSPECIFIED = 0;
  EMERGENCY_REASON_CODE_KILL_SWITCH_DISABLED = 1;
  EMERGENCY_REASON_CODE_NO_CANDIDATE_ARTIFACT = 2;
  EMERGENCY_REASON_CODE_VALUES_CONFLICT = 3;
  EMERGENCY_REASON_CODE_OPERATION_IN_PROGRESS = 4;
  EMERGENCY_REASON_CODE_INTERNAL = 5;
  EMERGENCY_REASON_CODE_ARTIFACT_NOT_FOUND = 6;
  EMERGENCY_REASON_CODE_WORKLOAD_NOT_FOUND = 7;
  EMERGENCY_REASON_CODE_CONTAINER_NOT_FOUND = 8;
  EMERGENCY_REASON_CODE_VERSION_INVALID = 9;
  EMERGENCY_REASON_CODE_LOCKED_PATH = 10;
}

// The authoritative cluster effect of an emergency operation, as projected for
// readers rather than stored verbatim: a non-emergency operation and an
// emergency one that never crossed the delivery boundary both project the
// never-started value, while an emergency operation whose effect no result has
// confirmed projects unknown. It is the unknown case that keeps a definition
// from accepting new work.
enum EmergencyEffectStatus {
  EMERGENCY_EFFECT_STATUS_UNSPECIFIED = 0;
  EMERGENCY_EFFECT_STATUS_UNKNOWN = 1;
  EMERGENCY_EFFECT_STATUS_APPLIED = 2;
  // Terminal and resolved as "the cluster was not changed". A closed answer, not
  // a pending one: it is distinct from unknown, which is what an unreconciled
  // effect reports.
  EMERGENCY_EFFECT_STATUS_NOT_APPLIED = 3;   // pre-existing value
  // No cluster effect was ever attempted, either because the operation is not an
  // emergency one or because it stopped before its command was delivered. Not the
  // same as a checked-and-unchanged cluster.
  EMERGENCY_EFFECT_STATUS_NOT_STARTED = 4;   // added later
}

message EmergencyResult {
  EmergencyAction op_type = 1;
  EmergencyConvergence convergence_policy = 2;
  EmergencyTypedValues before = 3;
  EmergencyTypedValues after = 4;
  repeated ConvergenceTaskSummary convergence_tasks = 5;
  string revert_status = 6;
  string reconciled_by_operation_id = 7;
  EmergencyEffectStatus effect_status = 8;
  // requested=true means the change was accepted and queued; execution is
  // asynchronous and its terminal state arrives via GetOperation/WatchOperation
  // or events (REQ-079 D1).
  bool requested = 9;
}

message EmergencyTypedValues {
  // The typed echo of what the request asked for, set according to the derived
  // action; it is what makes a replay of a recorded intent show the change that
  // was actually submitted rather than its text rendering.
  oneof values {
    ImageRefValues image_ref_values = 1;
    ReplicasValues replicas_values = 2;
    AnnotationValues annotation_values = 3;
  }
}

message ImageRefValues {
  string container = 1;
  string image_reference = 2;
}

message ReplicasValues {
  int32 replicas = 1;
}

message AnnotationValues {
  repeated AnnotationEntry annotations = 1;
}

message ConvergenceTaskSummary {
  string task_id = 1;
  string status = 2;
}

// ── Emergency stuck locks (REQ-087) ───────────────────────────────

// buf:lint:ignore ENUM_VALUE_PREFIX
// NOT_APPLIED_PROVEN and AUDITED_OVERRIDE predate the enum-value prefix
// convention but are already on the wire (their json_name is part of the
// request/response shape) and mirrored by Go constants in the converge path.
// Renaming them to RELEASE_MODE_* would spend a breaking contract change on a
// naming nit; the ConvergenceStrategy enum above records the same trade-off for
// its own REQ-pinned value names.
// ReleaseMode classifies how a stuck emergency target lock is released
// (REQ-087 §4.2, D4=A/D5=B). Both modes require a terminal operation whose
// effect is still UNKNOWN past the observe window.
enum ReleaseMode {
  RELEASE_MODE_UNSPECIFIED = 0;
  // NOT_APPLIED_PROVEN releases the lock and records the effect as
  // NOT_APPLIED: the operator can prove the command never took effect (e.g.
  // it was never ACK_PERSISTED and the operator session is offline).
  NOT_APPLIED_PROVEN = 1;
  // AUDITED_OVERRIDE releases the lock while the effect stays UNKNOWN: the
  // operator cannot prove the change did not take effect but must take over
  // the target. The release is fully audited and a late result may still
  // resolve the effect later (REQ-032 AC-032-31).
  AUDITED_OVERRIDE = 2;
}

message ListStuckLocksRequest {
  // Optional; empty lists all stuck locks within the authorized scope.
  string release_definition_id = 1;
}

message ListStuckLocksResponse {
  repeated StuckLock locks = 1;
}

message StuckLock {
  string intent_id = 1;
  string operation_id = 2;
  string release_definition_id = 3;
  EmergencyAction action = 4;
  // Sanitized human-readable lock path summary, e.g. "Deployment/api, container=app".
  string lock_path_summary = 5;
  // Always EMERGENCY_EFFECT_STATUS_UNKNOWN for a stuck lock.
  EmergencyEffectStatus effect_status = 6;
  google.protobuf.Timestamp terminal_at = 7;
  // terminal_at + emergency.effect_observe_timeout (when the lock became stuck).
  google.protobuf.Timestamp stuck_since = 8;
  // Current observe-window value, for display only.
  string observe_timeout_display = 9;
}

message ReleaseEmergencyLockRequest {
  // Target emergency intent id (emergency_intents.id).
  string intent_id = 1;
  // Required; 1-1000 UTF-8 characters, trimmed before storage.
  string reason = 2;
  ReleaseMode mode = 3;
  // Optional unlock evidence summary (<=500 chars, sanitized on ingestion).
  string evidence = 4;
}

message ReleaseEmergencyLockResponse {
  string intent_id = 1;
  bool lock_released = 2;
  // Effect after the release: NOT_APPLIED for NOT_APPLIED_PROVEN, or the
  // retained UNKNOWN for AUDITED_OVERRIDE.
  EmergencyEffectStatus effect_status = 3;
  string audit_event_id = 4;
}

// ── Inventory Sync (REQ-017) ───────────────────────────────────────

// InventoryItem represents a single Helm release in a cluster inventory snapshot.
// It carries only metadata and a values digest — NEVER raw Secret values.
message InventoryItem {
  string namespace = 1;
  string name = 2;
  string chart = 3;
  string chart_version = 4;
  int32 revision = 5;
  string status = 6;
  string values_digest = 7; // SHA-256 of canonical values, not the values themselves
  string definition_id = 8;
}

// SyncInventoryRequest is a full snapshot from an operator.
message SyncInventoryRequest {
  string operator_id = 1;
  string cluster_id = 2;
  string customer_id = 3;
  // Agent-generated identifier that is the idempotency key for this report: a
  // replayed sync_id is answered from the recorded result with status duplicate.
  string sync_id = 4; // unique per snapshot, used for idempotency
  // At most 10000 entries; a larger report is rejected as INVALID_ARGUMENT
  // (payload_too_large) rather than truncated.
  repeated InventoryItem items = 5;
  // True declares the list complete, so inventory rows absent from it are marked
  // missing; false updates only the items listed.
  bool full_snapshot = 6; // true = full sync, false = targeted update
}

// SyncInventoryResponse returns the application result.
message SyncInventoryResponse {
  int32 accepted_count = 1;
  int32 missing_marked_count = 2;
  int64 snapshot_version = 3;
  // One of applied or duplicate: applied recorded this sync identifier, duplicate
  // replayed the earlier answer. A stale variant is declared in the shape but the
  // implementation never produces it.
  string status = 4; // "applied", "duplicate", "stale"
}

// TargetedInventoryUpdate is sent after a single operation completes.
message TargetedInventoryUpdate {
  string operator_id = 1;
  string cluster_id = 2;
  string customer_id = 3;
  string sync_id = 4;
  InventoryItem item = 5; // the single release that changed
  string triggered_by_operation = 6; // operation_id that triggered this update
}

// ── Operation query (REQ-056) ─────────────────────────────────────
message ListOperationsRequest {
  string release_definition_id = 1;
  string status_filter = 2;
  int32 limit = 3;
  string cursor = 4;
}

message ListOperationsResponse {
  repeated OperationSummary operations = 1;
  string next_cursor = 2;
}

message OperationSummary {
  string operation_id = 1;
  string operation_type = 2;
  string state = 3;
  int32 revision = 4;
  google.protobuf.Timestamp created_at = 5;
}

message BundleImage {
  string repository = 1;
  string tag = 2;
  string digest = 3;
  string values_path = 4;
}

// ── E2E release-inventory observability (REQ-066) ────────────────

// ListReleaseInventoryRequest requests the full, unfiltered release-inventory
// view. All rows are returned; callers page at their own risk on very large
// environments (E2E/dev scale is bounded).
message ListReleaseInventoryRequest {}

// ListReleaseInventoryResponse is the complete observed release inventory.
message ListReleaseInventoryResponse {
  repeated ReleaseInventoryRow rows = 1;
}

// ReleaseInventoryRow is one observed release row plus its stable identity.
// values_digest and internal sync data (snapshot versions, sync ids, observed
// digests, workload UID) are intentionally not exposed.
message ReleaseInventoryRow {
  string customer_id = 1;
  string customer_name = 2;
  string cluster_id = 3;
  string cluster_name = 4;
  string release_definition_id = 5;
  string release_definition_name = 6;
  string namespace = 7;
  string release_name = 8;
  int32 revision = 9;
  ReleaseInventoryStatus status = 10;
  // active_operation carries the release definition's current non-terminal
  // Operation (REQ-066): E2E uses it for e2e-runner startup takeover and for
  // release_busy detection when the actor is not e2e-runner.
  ActiveOperationRef active_operation = 11;
}

// ActiveOperationRef is the minimal public identity of one operation.
message ActiveOperationRef {
  string operation_id = 1;
  string operation_type = 2;
  OperationStatus state = 3;
  // actor is the stable principal string (e.g. "e2e-runner" or a user id).
  string actor = 4;
}
