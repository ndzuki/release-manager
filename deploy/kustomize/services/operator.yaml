apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: release-manager-dev
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/part-of: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator
        app.kubernetes.io/part-of: release-manager
    spec:
      serviceAccountName: release-manager-operator
      securityContext:
        fsGroup: 65532
      containers:
        - name: operator
          image: localhost:5001/release-operator:dev
          imagePullPolicy: IfNotPresent
          args: ["--config", "/configs/operator.dev.yaml", "--db", "/data/release-manager.db", "--command-db", "/data/operator-commands.db", "--orchestrator-addr", "http://orchestrator:8083", "--operator-addr", "http://operator:8084"]
          ports:
            - name: http
              containerPort: 8084
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: release-manager-dev-data
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: release-manager-dev
spec:
  selector:
    app.kubernetes.io/name: operator
  ports:
    - name: http
      port: 8084
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-manager-operator
  namespace: release-manager-dev
