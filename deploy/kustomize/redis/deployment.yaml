apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: release-manager-dev
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: release-manager
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
