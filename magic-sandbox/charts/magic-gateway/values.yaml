# Default values for magic-gateway
replicaCount: 3

imageRegistry: "registry.local:5001"
imageRepository: magic/magic-gateway
imageTag: "0.0.7"
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

# Gateway settings
gateway:
  port: "80"
  debug: "false"
  apiKey: ""

# Magic Service (内部服务)
magicService:
  baseUrl: "http://magic-service.magic.local"
  apiKey: ""

# AI Model Services (使用 magic-service 作为代理)
openai:
  apiBaseUrl: ""  # 默认使用 magicService.baseUrl/v1
  apiKey: ""

claude:
  apiBaseUrl: ""  # 默认使用 magicService.baseUrl/v1
  apiKey: ""
  
claudeCache:
  apiBaseUrl: ""  # 默认使用 magicService.baseUrl/v1
  apiKey: ""

deepseek:
  apiBaseUrl: ""  # 默认使用 magicService.baseUrl/v1
  apiKey: ""

doubao:
  apiBaseUrl: ""  # 默认使用 magicService.baseUrl/v1
  apiKey: ""

qwen:
  apiBaseUrl: ""  # 默认使用 magicService.baseUrl/v1
  apiKey: ""

gemini:
  apiBaseUrl: "https://new-api.letsmagic.cc/v1"
  apiKey: ""

# Image and Voice Services
imageGenerator:
  apiUrl: ""  # 默认使用 magicService.baseUrl/api/chat
  apiKey: ""

textToImage:
  platform: "magic-service"
  apiBaseUrl: ""  # 默认使用 magicService.baseUrl/v2
  accessKey: ""

voiceUnderstanding:
  apiBaseUrl: ""  # 默认使用 magicService.baseUrl/api/v1
  apiKey: ""

# Third-party Services
bing:
  subscriptionEndpoint: "https://search-apis.xmindai.cn/xs/v7.0"
  subscriptionKey: ""

serpapi:
  apiEndpoint: "https://serpapi.com"
  apiKey: ""

metaso:
  apiEndpoint: "https://metaso.cn"
  apiKey: ""

amap:
  apiKey: ""

tikhub:
  apiKey: ""


