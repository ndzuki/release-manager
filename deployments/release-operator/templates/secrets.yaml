{{- if and .Values.tls.enabled .Values.tls.cert .Values.tls.key (not .Values.tls.existingCertSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-tls
  labels:
    {{- include "release-operator.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.cert | b64enc | quote }}
  tls.key: {{ .Values.tls.key | b64enc | quote }}
{{- end }}
---
{{- if and .Values.tls.enabled .Values.tls.ca (not .Values.tls.existingCaSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ca
  labels:
    {{- include "release-operator.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ .Values.tls.ca | b64enc | quote }}
{{- end }}
---
{{- if and .Values.harbor.username .Values.harbor.password (not .Values.harbor.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-harbor-creds
  labels:
    {{- include "release-operator.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.harbor.username | b64enc | quote }}
  password: {{ .Values.harbor.password | b64enc | quote }}
{{- end }}
---
{{- if and .Values.harbor.caCert (not .Values.harbor.existingCaSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-harbor-ca
  labels:
    {{- include "release-operator.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ .Values.harbor.caCert | b64enc | quote }}
{{- end }}
