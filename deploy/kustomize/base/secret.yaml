apiVersion: v1
kind: Secret
metadata:
  name: release-manager-dev-credentials
  namespace: release-manager-dev
type: Opaque
stringData:
  # Shared dev-only credentials. The postgres Deployment consumes the
  # POSTGRES_* entries; services read their own DSN from their mounted config.
  # The JWT signing key has its own authority: the release-manager-jwt Secret
  # generated/injected by dev.sh (D3), not this credentials Secret.
  # (TASK-094 §7-10: the old DATABASE_DRIVER key was dropped — the postgres
  # image ignores it, no service envFrom's this Secret, and the viper
  # DATABASE_DRIVER binding only sees env actually injected into containers.)
  POSTGRES_USER: release_manager
  POSTGRES_PASSWORD: dev-release-manager
  POSTGRES_DB: release_manager
