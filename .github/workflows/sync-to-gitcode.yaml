name: Sync to GitCode

on:
  push:
    branches:
      - main # 如果你默认的分支是 master，请修改为 master

env:
  GITCODE_USER: ndmizuki
jobs:
  gitcode-sync:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 获取完整提交历史，防止强制推送失败

      - name: Push to GitCode
        # Credentials travel via the environment, never on the command line.
        env:
          GITCODE_REMOTE: "https://${{ env.GITCODE_USER }}:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ env.GITCODE_USER }}/${{ github.event.repository.name }}.git"
        run: |
          # 强制将本地全部分支与标签推送到 GitCode
          git push --mirror "$GITCODE_REMOTE"
