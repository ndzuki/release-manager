// File: common/v1/trust.proto
// Package common.v1 trust vocabulary: the outcome of verifying an artifact
// signature, a reference to a detached signature, and the environment-level
// verification policy.
// No service is declared here. release-orchestrator verifies bundles and
// release definitions in process (signature material and trust roots resolve
// against the database), so these types cross the wire inside orchestrator.v1
// and webhook.v1 messages rather than through their own RPC surface.
syntax = "proto3";

package common.v1;

option go_package = "github.com/ndzuki/release-manager/api/gen/common/v1;commonv1";

// VerificationResult captures the outcome of an artifact trust verification.
enum VerificationResult {
  // Verification has not run. Treat it as failure, not as absence of risk.
  VERIFICATION_RESULT_UNSPECIFIED = 0;
  VERIFICATION_RESULT_TRUSTED = 1;
  VERIFICATION_RESULT_REJECTED = 2;
  VERIFICATION_RESULT_POLICY_WARNING = 3;
  VERIFICATION_RESULT_SIGNATURE_MISSING = 4;
  // The verifier could not reach the key material or transparency log, so no
  // verdict was reached; distinct from REJECTED, and a fail-closed policy treats
  // it as a rejection while a fail-open policy records it as a warning.
  VERIFICATION_RESULT_VERIFICATION_UNAVAILABLE = 5;
}

// SignatureRef identifies a cryptographic signature for an artifact.
message SignatureRef {
  // Digest of the signed artifact this signature covers, not of the signature
  // blob itself.
  string digest = 1;
  string signature = 2;
  string issuer = 3;
  string subject = 4;
}

// TrustPolicy defines the verification rules for an environment.
message TrustPolicy {
  string policy_version = 1;
  // True blocks the release when verification is unavailable or the signature is
  // missing; false records the finding and continues.
  bool fail_closed = 2;
  repeated string trusted_issuers = 3;
}
