apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: release-manager-dev
  labels:
    app.kubernetes.io/name: webhook
    app.kubernetes.io/part-of: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook
        app.kubernetes.io/part-of: release-manager
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: webhook
          image: localhost:5001/release-webhook:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /configs/webhook.dev.yaml
            - --orchestrator-url
            - http://orchestrator:8083
          # REQ-065 AC-065-01: the webhook does NOT mount any JWT key. It only
          # forwards a service token to the orchestrator, so the old
          # release-manager-jwt mount handed it signing material it never read
          # (exposure with zero benefit).
          # 批次3 D2 (AC-065-33): sender-side bundle ingress service token —
          # forwarded as `Authorization: Bearer <token>` to the orchestrator
          # BundleService (actor service:release-webhook, REQ-011 §562).
          env:
            - name: DEV_WEBHOOK_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: release-manager-webhook-service-token
                  key: WEBHOOK_SERVICE_TOKEN
            # TASK-102 (REQ-011 §562): the CI key guards the SubmitReleaseBundle
            # entrypoint; the Harbor key guards POST /webhooks/harbor and is
            # forwarded to the orchestrator as the Harbor service identity.
            # optional: an overlay that does not provision the Secret leaves the
            # ingress closed (an empty allowlist matches nothing).
            - name: DEV_CI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: release-manager-ci-api-key
                  key: CI_API_KEY
                  optional: true
            - name: DEV_HARBOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: release-manager-harbor-service-token
                  key: HARBOR_SERVICE_TOKEN
                  optional: true
            - name: DEV_HARBOR_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: release-manager-harbor-service-token
                  key: HARBOR_SERVICE_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 8082
          # TASK-099: startupProbe absorbs the synchronous store-open +
          # migration window; liveness must not fight slow startup.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /configs/webhook.dev.yaml
              subPath: webhook.dev.yaml
      volumes:
        - name: config
          configMap:
            name: webhook-config
---
apiVersion: v1
kind: Service
metadata:
  name: webhook
  namespace: release-manager-dev
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: webhook
  ports:
    - name: http
      port: 8082
      targetPort: http
      nodePort: 30082
