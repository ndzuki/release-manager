syntax = "proto3";

package operator.v1;

import "common/v1/domain.proto";
import "operator/v1/upgrade_result.proto";

option go_package = "github.com/ndzuki/release-manager/api/gen/operator/v1;operatorv1";

// EnrollRequest registers an operator agent with the orchestrator using a single-use token.
message EnrollRequest {
  string enrollment_token = 1;
  string customer_id = 2;
  string cluster_id = 3;
  string operator_id = 4;
  bytes csr_pem = 5;
  map<string, string> capabilities = 6;
}

// EnrollResponse acknowledges enrollment and starts a session.
message EnrollResponse {
  string session_id = 1;
  int64 ttl_seconds = 2;
  bytes certificate_pem = 3;
}
message CommandStreamRequest {
  oneof payload {
    Hello hello = 1;
    Ack ack = 2;
    Heartbeat heartbeat = 3;
    Result result = 4;
    ResyncResponse resync_response = 5;
    CommandResult command_result = 6;
  }
}

// Hello is sent by the operator to establish a session after enrollment.
message Hello {
  string session_id = 1;
  string operator_id = 2;
  int64 last_seen_sequence = 3;
}

// AckType classifies the acknowledgment level.
enum AckType {
  ACK_TYPE_UNSPECIFIED = 0;
  ACK_TYPE_RECEIVED = 1;
  ACK_TYPE_PERSISTED = 2;
}

// Ack acknowledges receipt of a command delivered to the operator.
message Ack {
  string outbox_id = 1;
  string command_id = 2;
  int64 sequence = 3;
  AckType ack_type = 4;
}

// Heartbeat signals operator liveness.
message Heartbeat {
  string session_id = 1;
}

// Result reports legacy command execution outcome.
message Result {
  string outbox_id = 1;
  string command_id = 2;
  string status = 3;
  string message = 4;
  bytes output = 5;
  int64 sequence = 6;
  string result_json = 7;
}

// CommandStreamResponse delivers commands and session events.
message CommandStreamResponse {
  oneof payload {
    Command command = 1;
    SessionEvent session_event = 2;
    ResyncRequest resync_request = 3;
    DuplicateResponse duplicate_response = 4;
  }
}

// Command is a deploy directive sent to the operator.
message Command {
  string outbox_id = 1;
  string command_id = 2;
  string operation_id = 3;
  string operation_type = 4;
  common.v1.ReleaseBundle bundle = 5;
  bytes values = 6;
  int64 sequence = 7;
  string definition_id = 8;
  string namespace = 9;
  string release_name = 10;
  bool create_namespace = 11;
  int64 timeout_seconds = 12;
  uint32 payload_version = 13;
  oneof typed_payload {
    UpgradeCommand upgrade = 20;
  }
}

// ResyncRequest asks the operator to report its last seen sequence for gap recovery.
message ResyncRequest {
  int64 orchestrator_last_sequence = 1;
  string reason = 2;
}

// ResyncResponse is sent by the operator in response to a ResyncRequest.
message ResyncResponse {
  int64 operator_last_sequence = 1;
}

// DuplicateResponse is sent when the operator receives a command it has already completed.
message DuplicateResponse {
  string command_id = 1;
  string result_json = 2;
}

// SessionEvent signals a session lifecycle change.
message SessionEvent {
  string type = 1;
  string message = 2;
}

// OperatorService manages the bidirectional stream between orchestrator and operator agents.
service OperatorService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc CommandStream(stream CommandStreamRequest) returns (stream CommandStreamResponse);
  rpc RevokeOperator(RevokeOperatorRequest) returns (RevokeOperatorResponse);
}

// RevokeOperatorRequest revokes an operator and closes its active sessions.
message RevokeOperatorRequest {
  string operator_id = 1;
  string reason = 2;
}

// RevokeOperatorResponse confirms operator revocation.
message RevokeOperatorResponse {
  string operator_id = 1;
  string status = 2;
}
