<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Release Manager</title>
    <!--
      Last-resort boot surface (AC-178-06).

      `src/main.ts` can only report a failure it is alive to catch. If the module
      graph itself fails to evaluate — a chunk fails to load, a top-level import
      throws — main.ts never runs, nothing is mounted, and the page is blank with
      no diagnostic. This inline guard is the only code guaranteed to run, so it
      is deliberately dependency-free (no imports, no build step) and duplicated
      on purpose:

        * the styles are a deliberately reduced duplicate of the `.boot-failure`
          rules in src/styles/base.css with literal values (a CSS import is part
          of the module graph that may be exactly what failed), and without the
          token-driven hover state;
        * it stops reporting once main.ts sets `window.__rmBootMounted`, so a late
          unrelated error cannot replace a working console.
    -->
    <style>
      .boot-failure { display: grid; gap: 0.75rem; place-content: center; min-height: 100vh; padding: 2rem; text-align: center; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; color: #0f172a; }
      .boot-failure__title { margin: 0; font-size: 1.5rem; }
      .boot-failure__message { max-width: 40rem; margin: 0 auto; color: #64748b; }
      .boot-failure__detail { max-width: 40rem; margin: 0 auto; padding: 0.75rem; overflow-wrap: anywhere; border: 1px solid #e2e8f0; border-radius: 0.5rem; background: #fff; color: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.75rem; white-space: pre-wrap; }
      .boot-failure__retry { justify-self: center; padding: 0.5rem 1rem; border: 1px solid #2563eb; border-radius: 0.375rem; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    </style>
    <script>
      (function () {
        function show(reason) {
          var app = document.getElementById('app');
          if (!app || window.__rmBootMounted) return;
          app.textContent = '';
          var main = document.createElement('main');
          main.className = 'boot-failure';
          main.setAttribute('role', 'alert');
          var title = document.createElement('h1');
          title.className = 'boot-failure__title';
          title.textContent = '无法启动发布管理控制台';
          var message = document.createElement('p');
          message.className = 'boot-failure__message';
          message.textContent = '脚本加载失败。请刷新页面；若持续发生，请联系平台团队。';
          var detail = document.createElement('pre');
          detail.className = 'boot-failure__detail';
          detail.textContent = String(reason || '未知错误');
          var retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'boot-failure__retry';
          retry.textContent = '重新加载';
          retry.addEventListener('click', function () { window.location.reload(); });
          main.appendChild(title);
          main.appendChild(message);
          main.appendChild(detail);
          main.appendChild(retry);
          app.appendChild(main);
        }
        // capture:true is required. A resource load failure (the entry bundle
        // 404s, a lazy chunk never arrives) dispatches `error` on the ELEMENT and
        // it does not bubble, so a bubble-phase window listener never sees the
        // single most common cause of a blank SPA.
        function describe(event) {
          if (event && event.message) return event.message;
          // A failed <script src>/<link href> dispatches a plain Event (no
          // message); name the asset so the report is actionable.
          var target = event && event.target;
          if (target && (target.src || target.href)) {
            return '加载失败 ' + (target.src || target.href);
          }
          return '未知错误';
        }
        window.addEventListener('error', function (event) { show(describe(event)); }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          show(reason && reason.message ? reason.message : reason);
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
