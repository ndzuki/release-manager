# Nightly logical backups of the two production databases (TASK-340).
#
# Scope: `release_manager` (required) and `release_notifier` (dumped only when
# the database is proven to exist and to hold at least one base table). Any
# failure while probing or dumping either database fails the Job: the optional
# database may be skipped only when its absence (or emptiness) is positively
# established, never because a connection or query failed. The dumps are
# PostgreSQL custom-format archives (`pg_dump -Fc`) written to a dedicated
# ReadWriteOnce PVC, so they survive Pod and node restarts but stay on the same
# node as this single-node cluster. Off-site copies are still an operator
# responsibility (see docs/production-deploy.md §7).
#
# The backup runs inside the `postgres:16` image, i.e. with a client major
# version that matches the server. That deliberately avoids the
# `pg_dump` 18.6 -> PostgreSQL 16 `SET transaction_timeout` incompatibility
# documented in docs/production-deploy.md §7.2: the host-side manual dump still
# needs that workaround, these archives do not.
#
# Archives are written atomically per database (TASK-342): `pg_dump` writes
# `<db>-<stamp>.dump.tmp`, and only a successful, non-empty, synced archive is
# renamed to `<db>-<stamp>.dump`. A failed run never publishes a *.dump under
# the final name, so a red Job leaves no file that looks like a good backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: release-manager-backups
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Replaced from production-settings.storageClassName (same knob as the
  # PostgreSQL/Redis claim templates and the other two standalone PVCs); kept
  # literal here so the manifest is valid when rendered standalone.
  storageClassName: local-path
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: release-manager-backup
  labels:
    app.kubernetes.io/part-of: release-manager
spec:
  # 02:00 UTC every day. The cluster runs with UTC; the filename timestamp is
  # UTC as well (`date -u`), so a dump's name and its schedule agree.
  schedule: "0 2 * * *"
  # Automatic runs never overlap: Forbid makes the CronJob controller skip a
  # scheduled run while the previous one is still active (a second run could
  # dump while the first is still writing). It does NOT serialise manual runs:
  # `kubectl create job --from=cronjob/...` creates an independent Job that
  # this policy knows nothing about, so an operator triggering one by hand must
  # stay clear of the 02:00 UTC slot. Tolerate a short node outage as well.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # A backup that has not finished in 30 minutes is stuck (PostgreSQL
      # unreachable or the PVC wedged); fail it visibly instead of pinning the
      # PVC forever.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
            # Required by the `allow-postgres` NetworkPolicy: it admits
            # connections to postgres:5432 only from pods carrying this label.
            # Without it the CronJob Pod cannot reach the database.
            app.kubernetes.io/part-of: release-manager
        spec:
          restartPolicy: Never
          securityContext:
            # The postgres image's `postgres` user is uid/gid 999. The backup
            # only needs to read the database and write /backups, so it runs
            # non-root for its whole lifetime. fsGroup lets the kubelet give
            # the local-path volume a group-writable root (the same mechanism
            # postgres-statefulset.yaml relies on).
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  backup_dir=/backups
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  mkdir -p "$backup_dir"

                  # A freshly started Pod is not admitted to the namespace's
                  # NetworkPolicy at the instant its container starts: on k3s
                  # with kube-router the new Pod IP is programmed ~2s later and
                  # a connection attempted before that is refused. Wait for the
                  # server (bounded) instead of racing it; this also covers a
                  # PostgreSQL restart at 02:00. pg_isready needs no password.
                  attempts=0
                  until pg_isready --host="$PGHOST" --port="$PGPORT" \
                        --username="$POSTGRES_USER" --timeout=3 >/dev/null 2>&1; do
                    attempts=$((attempts + 1))
                    if [ "$attempts" -ge 60 ]; then
                      printf 'postgres not ready after 60 attempts\n' >&2
                      exit 1
                    fi
                    sleep 2
                  done
                  printf 'postgres is accepting connections\n'

                  # Write each archive atomically: pg_dump writes
                  # <db>-<stamp>.dump.tmp, and the file is renamed to
                  # <db>-<stamp>.dump only after pg_dump succeeds, the archive
                  # is non-empty, and it has been flushed to disk. Without the
                  # rename, a failed pg_dump left a 0-byte *.dump that was
                  # indistinguishable from a good backup until retention
                  # deleted it seven days later; a failed Job must instead
                  # leave no archive under the final name (TASK-342).
                  #
                  # /bin/sh in the postgres image is dash, which has no
                  # `pipefail`: every step's status is checked explicitly
                  # instead of being taken from a pipeline.
                  dump_database() {
                    label="$1"
                    dbname="$2"
                    final="$backup_dir/$label-$stamp.dump"
                    tmp="$final.tmp"
                    # A leftover with this exact name (a killed attempt in the
                    # same second) must not be mistaken for this attempt's
                    # output.
                    rm -f "$tmp"
                    if ! pg_dump --format=custom --no-owner --no-privileges \
                         --username="$POSTGRES_USER" --dbname="$dbname" \
                         --file="$tmp"; then
                      rm -f "$tmp"
                      printf 'pg_dump failed for %s; no archive written\n' \
                        "$label" >&2
                      return 1
                    fi
                    # A zero-length custom-format archive is never valid: treat
                    # it as a failure instead of publishing it under *.dump.
                    if [ ! -s "$tmp" ]; then
                      rm -f "$tmp"
                      printf 'pg_dump produced an empty archive for %s; no archive written\n' \
                        "$label" >&2
                      return 1
                    fi
                    # Flush before the rename so a node crash cannot leave a
                    # complete-looking *.dump whose contents never reached the
                    # disk.
                    if ! sync "$tmp"; then
                      rm -f "$tmp"
                      printf 'sync failed for %s; no archive written\n' \
                        "$label" >&2
                      return 1
                    fi
                    if ! mv "$tmp" "$final"; then
                      rm -f "$tmp"
                      printf 'failed to rename %s into place\n' "$tmp" >&2
                      return 1
                    fi
                    printf 'dumped %s -> %s (%s bytes)\n' \
                      "$label" "$final" "$(wc -c < "$final")"
                  }

                  # release_manager is the authoritative management-plane
                  # database: a failure here fails the Job. `set -e` turns the
                  # helper's non-zero return into a failed container.
                  dump_database release_manager "$POSTGRES_DB"

                  # release_notifier is optional: skip it when the database is
                  # absent or a freshly initialised database has no base tables
                  # yet. Both checks are read-only and both run with
                  # ON_ERROR_STOP=1, and the query output is captured instead of
                  # being piped into `if`/`grep`: the image's /bin/sh is dash,
                  # which has no `pipefail`, so a failing `psql` inside a
                  # pipeline would take the else-branch and the log would claim
                  # "database does not exist" while the Job stayed green and
                  # the database went unbacked-up. A failed probe is an unknown
                  # state, therefore a failed Job.
                  exists="$(psql -v ON_ERROR_STOP=1 --username="$POSTGRES_USER" \
                    --dbname=postgres \
                    --tuples-only --no-align \
                    --command="SELECT 1 FROM pg_database WHERE datname = 'release_notifier'")" || {
                    printf 'psql failed while probing release_notifier (database status unknown)\n' >&2
                    exit 1
                  }
                  case "$exists" in
                    '')
                      printf 'release_notifier database does not exist; skipping\n' >&2
                      ;;
                    1)
                      tables="$(psql -v ON_ERROR_STOP=1 --username="$POSTGRES_USER" \
                        --dbname=release_notifier \
                        --tuples-only --no-align \
                        --command="SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")" || {
                        printf 'psql failed while counting release_notifier base tables\n' >&2
                        exit 1
                      }
                      # `[ "" -gt 0 ]` is an "integer expression expected" error
                      # in dash and would land in the skip branch: validate the
                      # count before comparing it.
                      case "$tables" in
                        ''|*[!0-9]*)
                          printf "unexpected release_notifier table count: '%s'\n" "$tables" >&2
                          exit 1
                          ;;
                      esac
                      if [ "$tables" -gt 0 ]; then
                        dump_database release_notifier release_notifier
                      else
                        printf 'release_notifier has no base tables; skipping\n' >&2
                      fi
                      ;;
                    *)
                      printf "unexpected release_notifier probe result: '%s'\n" "$exists" >&2
                      exit 1
                      ;;
                  esac

                  # Retention: keep the last 7 days, delete older *.dump files.
                  # The postgres image is Debian-based and ships GNU find
                  # (coreutils/findutils), so -mtime/-delete are available.
                  # "Older than 7 days" means a file survives 7 full days plus
                  # the rest of the day it was written; it is not a count of
                  # seven files. A missed run therefore cannot delete the last
                  # good dump. `-print` keeps the deleted names in the Job log.
                  find "$backup_dir" -maxdepth 1 -type f -name '*.dump' \
                    -mtime +7 -print -delete
                  printf 'retention applied: files older than 7 days removed\n'

                  # Orphaned temp files: a hard kill (the activeDeadlineSeconds
                  # watchdog, a node crash) skips the helper's own cleanup and
                  # leaves a *.dump.tmp behind. Such a file is never a valid
                  # archive, so drop ones older than a day; the age guard keeps
                  # this pass from touching the temp file of a run that started
                  # moments ago. The pattern is '*.dump.tmp' and therefore
                  # cannot match a completed '*.dump'.
                  find "$backup_dir" -maxdepth 1 -type f -name '*.dump.tmp' \
                    -mtime +1 -print -delete
                  printf 'orphaned .tmp files older than 1 day removed\n'

                  ls -l "$backup_dir"
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                # Credentials come from the same Secret the PostgreSQL
                # StatefulSet boots from; no password ever appears in this
                # manifest, in the Job spec or in the logs.
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: release-manager-credentials
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: release-manager-credentials
                      key: POSTGRES_PASSWORD
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: release-manager-credentials
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: release-manager-credentials
                      key: POSTGRES_DB
              volumeMounts:
                - name: backups
                  mountPath: /backups
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                # Nothing in the script writes outside /backups; a read-only
                # root filesystem makes that a guarantee instead of a promise.
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: release-manager-backups
