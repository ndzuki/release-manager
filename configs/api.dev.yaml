http_port: 8087
log_level: debug
audit:
  archive:
    retention_days: 90
    poll_interval: 6h
    batch_size: 1000
    archive_dir: data/archives
    compression: gzip_jsonl
    checksum_algorithm: sha256
# release-api asks release-auth for the caller's role-aware audit scope
# (ADR-021); the default matches the dev release-auth port.
authorization:
  auth_url: http://localhost:8085
