http_port: 8083
log_level: debug
database:
  driver: postgres
  dsn: postgres://release_manager:dev-release-manager@postgres:5432/release_manager?sslmode=disable
authorization:
  auth_url: http://auth:8085
  pull_interval: 1s
  pull_backoff_max: 30s
values:
  max_document_bytes: 1048576
  secret_patterns: []
trust:
  verification_timeout: 5s
maintenance: false
retention:
  bundle_days: 90
  candidate_artifact_days: 30
  preflight_result_hours: 168
  prepare_session_hours: 24
  gc_interval_hours: 6
gateway:
  enabled: true
  port: 8084
  ca_key_path: /data/gateway-ca.key
  ca_cert_path: /data/gateway-ca.crt
