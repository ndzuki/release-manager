version: "1"
# govulncheck exceptions (REQ-008 §8-8, TASK-101).
#
# `make vulncheck` fails when govulncheck reports a vulnerability that this
# module's code actually calls. An entry here suppresses exactly one advisory and
# must carry: why it is accepted, what compensating control exists, an owner, and
# a review date. Unlike sdkcheck.exceptions.yaml the expiry is a *review* date:
# govulncheck has no automatic invalidation, so the date records when the team
# agreed to look again (and to remove the entry once upstream ships a fix).
exceptions:
  - id: "GO-2026-5932"
    owner: "release-manager"
    module: "golang.org/x/crypto/openpgp"
    reason: >-
      The advisory states that golang.org/x/crypto/openpgp is unmaintained,
      unsafe by design, and has no fixed version. Every call path runs through
      the Helm Go SDK (helm.sh/helm/v3/pkg/action chart provenance verification)
      plus incidental init/error paths; ADR-004 forbids executing helm/kubectl as
      a process, so the SDK cannot be replaced, and the openpgp package cannot be
      dropped without dropping chart provenance support entirely.
    compensating_control: >-
      Chart CONTENT is digest-pinned end to end: the artifact preflight stage
      recomputes sha256 over the chart archive bytes and requires it to equal the
      bundle's chart_digest, failing closed (internal/operator/stage_artifact.go:106-110),
      and the install path re-verifies the same parity before rendering
      (internal/operator/helmengine/real.go:275,591) — so an operator can only act
      on the exact chart bytes the bundle approved, and provenance signatures are
      an additional check rather than the perimeter. Route/allowlist configuration
      is validated when a cluster route is saved (artifact type and mode, non-empty
      and whitespace-free prefixes, no conflicting prefix per cluster+type:
      internal/orchestrator/route_validate.go:22-70).
      ⚠️ STRENGTH NEEDS OWNER RE-EVALUATION (V14, 2026-09-28): this entry used to
      cite `internal/preflight/oci.go` for "charts reach the operator only from
      source registries on the server-side allowlist". That package was dead code
      (zero importers) and has been deleted, and the claim does not hold as stated
      today: the operator's chart-fetch path does not consult cluster_routes at all
      (no SourcePrefix/ClusterRoutes use under internal/operator/), and the
      execution-time `routing_no_match` producer is a recorded gap (REQ-045
      AC-045-02). Digest pinning is real and enforced; the source-registry
      allowlist is configuration-time only. Whether the two together are an
      equivalent compensating control for this advisory is an owner security
      judgement, not something this file may assert.
      The exposure remains a malicious chart's own signature material, not remote input.
    expires_at: "2027-03-31"
