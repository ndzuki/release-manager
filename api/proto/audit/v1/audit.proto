// File: audit/v1/audit.proto
// Package audit.v1 is the audit trail: who did what to which resource, with
// what outcome.
// Only release-api (dev port 8087) serves AuditService over Connect. Every
// other service records audit in process through the same emitter, so Emit is
// intended for external collectors and side cars; the web console reads the
// trail through QueryAuditEvents.
// The service binary guards the whole method set with a bearer access token
// only (no role evaluation, no cookie fallback) and does not narrow the
// organization a caller asks about, so deployment must keep the listener on a
// trusted network.
// Events are persisted asynchronously: an accepted event is durable only after
// the emitter flushes its buffer.
syntax = "proto3";

package audit.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/types.proto";

option go_package = "github.com/ndzuki/release-manager/api/gen/audit/v1;auditv1";

// ActorKind classifies the principal that performed an action.
enum ActorKind {
  // Missing kind; reject rather than guess.
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_ANONYMOUS = 1;
  ACTOR_KIND_USER = 2;
  ACTOR_KIND_SERVICE = 3;
  // A long-lived credential presented by a pipeline or integration; kind and id
  // must describe the same principal the transport authenticated.
  ACTOR_KIND_API_KEY = 4;
  // An internal worker such as a reconciler or the garbage collector.
  ACTOR_KIND_SYSTEM = 5;
}

// AuditActor identifies the principal that performed an audited action.
message AuditActor {
  ActorKind kind = 1;
  string id = 2;
  string organization_id = 3;
  string role = 4;
}

// AuditEvent represents a single audit trail entry.
message AuditEvent {
  string id = 1;
  AuditActor actor = 2;
  string resource_type = 3;
  string resource_id = 4;
  string action = 5;
  string status = 6;
  // Milliseconds. Not a Timestamp and not a duration message; do not confuse it
  // with second-granularity expiry fields elsewhere in the contract.
  int64 duration_ms = 7;
  // Human-readable diff summary. Secrets must be redacted before submission.
  string change_summary = 8;
  google.protobuf.Timestamp created_at = 9;
  // Metadata carries optional key-value context.
  map<string, string> metadata = 10;
}

// EmitAuditRequest submits one or more audit events for asynchronous persistence.
message EmitAuditRequest {
  repeated AuditEvent events = 1;
}

// EmitAuditResponse acknowledges receipt of audit events.
message EmitAuditResponse {
  int32 accepted = 1;
  int32 rejected = 2;
  repeated string audit_event_ids = 3;
  repeated string rejection_codes = 4;
}

// AuditQueryFilter restricts audit events returned by a query or export.
message AuditQueryFilter {
  string organization_id = 1;
  string resource_type = 2;
  string resource_id = 3;
  string actor_id = 4;
  string action = 5;
  string status = 6;
  common.v1.TimestampRange time_range = 7;
}

// QueryAuditEventsRequest queries organization-scoped audit events.
message QueryAuditEventsRequest {
  AuditQueryFilter filter = 1;
  common.v1.Pagination pagination = 2;
}

// QueryAuditEventsResponse returns a stable cursor-paginated result.
message QueryAuditEventsResponse {
  repeated AuditEvent events = 1;
  common.v1.PaginationResponse pagination = 2;
}

// ExportAuditEventsRequest creates an asynchronous audit export job.
message ExportAuditEventsRequest {
  AuditQueryFilter filter = 1;
}

// ExportAuditEventsResponse identifies the accepted export job.
message ExportAuditEventsResponse {
  string export_id = 1;
  string status = 2;
}

// AuditService collects and queries audit events.
// AuditService accepts audit events for asynchronous persistence and reads
// back the trail for the console and for compliance tooling.
// Callers: external collectors and side cars (write), the web console (read)
// over release-api. Trust boundary: authenticated bearer token. The service
// performs no role check of its own, but every request is scoped to the
// principal's organization: the request cannot read, export, or emit into
// another tenant (TASK-095).
service AuditService {
  // Buffers audit events for asynchronous persistence and answers as soon as
  // they are queued, before any write reaches the database.
  // Not idempotent: there is no event-level deduplication, so a resend of the
  // same event id appends a second row. Partial success is normal: accepted and
  // rejected are counted per event and rejection_codes explains each rejection,
  // which is why a non-zero rejected count is not an RPC failure.
  // Fails with INVALID_ARGUMENT only when the request carries no events at all.
  // Requires a valid access token and a write decision for the audit object from
  // release-auth (ADR-021): release_admin and platform_admin may emit, other roles
  // are refused with PERMISSION_DENIED. The actor recorded on each event is taken
  // from the event itself; an event whose actor carries a different organization
  // than the decision's effective organization is rejected with PERMISSION_DENIED
  // for the whole request. An unavailable or slow decision authority answers
  // UNAVAILABLE rather than falling back to a local role guess.
  rpc Emit(EmitAuditRequest) returns (EmitAuditResponse);
  // Reads the audit trail with keyset pagination, newest event first.
  // Read-only and replayable.
  // organization_id is resolved by release-auth (ADR-021): an omitted value means
  // the caller's own organization, another organization is allowed only for
  // platform_admin (otherwise PERMISSION_DENIED), and the response then reads the
  // effective organization. The time range is capped by the policy-owned window
  // the decision returns (31 days, or 366 for platform_admin); a wider range is
  // rejected with INVALID_ARGUMENT and the reason code range_too_large. Other
  // filter fields (resource, actor, action, status) are taken from the request.
  // page_size is clamped to [1, 100] and defaults to 20; an unreadable
  // page_token is reported as INTERNAL, not as a client error.
  // Requires a valid access token (no role check).
  rpc QueryAuditEvents(QueryAuditEventsRequest) returns (QueryAuditEventsResponse);
  // Registers an asynchronous export request and returns a receipt; it does not
  // produce or hand back a file.
  // Not idempotent: each call mints a new export_id, and repeating an identical
  // request creates a second pending export.
  // Only the filter's time range is recorded, defaulting to the last 30 days;
  // the export needs a write decision for the audit object and is scoped to the
  // effective organization release-auth returns (ADR-021), so a filter naming
  // another organization is rejected with PERMISSION_DENIED for every role but
  // platform_admin. The policy window cap applies here too. No worker consumes the
  // queue today, so status stays pending. Treat the identifier as a request
  // receipt, not as a download handle.
  // Requires a valid access token (no role check).
  rpc ExportAuditEvents(ExportAuditEventsRequest) returns (ExportAuditEventsResponse);
}
