# Exported methods on unexported receiver types that nothing references and no interface claims
# (TASK-234).
#
# The list is produced by `go run ./cmd/deadmethods/`, which loads the module with go/packages
# and answers two questions with go/types: does the method object appear in TypesInfo.Uses or
# TypesInfo.Selections anywhere in shipping code, and does any interface reachable from the
# loaded package graph (standard library and third-party modules included) declare it for a type
# that implements that interface. Comments, string literals and same-named methods on other types
# do not count. Every entry needs a reason and a review date; the gate fails when an unreferenced
# method is missing here, when an entry no longer matches one (stale), when a reason is missing,
# or when review_by has passed.
#
# Wired into CI as the `dead-methods` job, deliberately absent from any required set: this repo
# has no branch protection today, so nothing blocks a merge, and when protection is introduced the
# job should stay non-required. It also stays out of `make quality` on purpose, so a local
# `make quality` does not depend on it. The one known limit that can report a LIVE method (a run-time assembled
# reflect.MethodByName name) is recorded in the package comment and docs/testing.md.
#
# History (comment-only: the machine-readable list is empty, so a reader of the data alone
# cannot tell there ever were entries): the first two were `internal/auth`
# storeAdapter.UpdatePolicy/UpdatePolicies.
# They were unreachable because casbin only selects them through the UNGUARDED assertion
# `e.adapter.(persist.UpdatableAdapter)` in enforcer_distributed.go, which this adapter cannot
# satisfy (it lacks UpdateFilteredPolicies) AND because this repo builds a SyncedEnforcer rather
# than a DistributedEnforcer. On the user's decision (2026-09-30) the two dead stubs were deleted
# instead of completing the interface, so the entries are gone rather than renewed; the caveat for
# anyone adopting a distributed enforcer lives next to the adapter in internal/auth/casbin.go.

exceptions: []
