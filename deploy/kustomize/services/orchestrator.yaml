apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: release-manager-dev
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: release-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
        app.kubernetes.io/part-of: release-manager
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: orchestrator
          image: localhost:5001/release-orchestrator:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /configs/orchestrator.dev.yaml
            # JWT validation key from the release-manager-jwt Secret (D3);
            # Kubernetes expands $(JWT_SIGNING_KEY) from the env entry below.
            - --signing-key
            - $(JWT_SIGNING_KEY)
          env:
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: release-manager-jwt
                  key: JWT_SIGNING_KEY
          ports:
            # Management-plane Connect HTTP listener.
            - name: http
              containerPort: 8083
            # Agent mTLS gateway listener (gateway.enabled: true). Exposed
            # through the operator Service (nodePort 30084) so customer
            # cluster agents can enroll and stream commands.
            - name: gateway
              containerPort: 8084
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /configs/orchestrator.dev.yaml
              subPath: orchestrator.dev.yaml
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: orchestrator-config
        - name: data
          persistentVolumeClaim:
            claimName: release-manager-orchestrator-data
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: release-manager-dev
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: orchestrator
  ports:
    - name: http
      port: 8083
      targetPort: http
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: release-manager-dev
spec:
  # The management-plane OperatorService gateway is served by the orchestrator
  # (gateway.enabled: true, containerPort 8084). This Service exposes that
  # mTLS listener to customer clusters via the 30084 nodePort the k3d
  # loadbalancer maps from host 8084.
  type: NodePort
  selector:
    app.kubernetes.io/name: orchestrator
  ports:
    - name: gateway
      port: 8084
      targetPort: gateway
      nodePort: 30084
