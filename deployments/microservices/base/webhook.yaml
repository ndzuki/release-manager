apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-webhook
  labels:
    app.kubernetes.io/name: release-webhook
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: release-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-webhook
    spec:
      containers:
      - name: webhook
        image: release-webhook:latest
        imagePullPolicy: IfNotPresent
        args:
          - "--config=/etc/release-manager/config.yaml"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: CONFIG_PATH
          value: /etc/release-manager/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/release-manager/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: microservice-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: release-webhook
  labels:
    app.kubernetes.io/name: release-webhook
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: release-webhook
